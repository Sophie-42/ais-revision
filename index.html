  {h:"Anatomie d'un script Bash", g:[
   {def:"Un **script Bash** = un fichier texte + une ligne d'en-tête (shebang) + un droit d'exécution. Il est déjà installé sur tous les serveurs Linux, sans aucune dépendance."},
   {code:"#!/bin/bash              # shebang : quel interpréteur lit la suite\n# purge-logs.sh\n# Objet     : supprime les .log de plus de N jours\n# Auteur    : prenom.nom@exemple.fr\n# Usage     : ./purge-logs.sh <dossier> <jours>\n# Prérequis : root, Debian 12\n\nchmod +x purge-logs.sh   # rendre exécutable\n./purge-logs.sh          # le ./ est obligatoire (. n'est pas dans PATH)\nbash purge-logs.sh       # alternative sans +x"},
   {p:"Sans shebang, le script est lu par le shell courant (pas forcément Bash). L'extension .sh est facultative : c'est le shebang qui décide. **source script.sh** exécute dans le shell courant (à réserver aux fichiers de conf)."}]},
  {h:"Variables : affectation, lecture, substitution", g:[
   {code:"DOSSIER_LOGS=\"/var/log\"            # PAS D'ESPACE autour du =\nRETENTION=30\necho \"$DOSSIER_LOGS\"                # lecture : toujours un $\nSERVEUR=\"srv-web-01\"\necho \"${SERVEUR}_backup.tar.gz\"     # accolades quand un caractère colle\necho \"${VAR:-defaut}\"               # valeur par défaut si vide/absente\nDATE=$(date +%F)                    # substitution de commande (pas les ` `)\nARCHIVE=\"/sauvegardes/etc_${DATE}.tar.gz\""},
   {p:"Erreur n°1 du débutant : DOSSIER = \"/var/log\" → Bash lit DOSSIER comme une commande : « commande introuvable ». **Pas d'espace au =.**"},
   {p:"Variables d'environnement utiles : $HOME, $USER, $PATH, $PWD, $HOSTNAME. Cron hérite d'un environnement très réduit : première cause de « ça marche à la main mais pas en planifié ». %F = AAAA-MM-JJ, trie bien (contrairement à %d-%m-%Y)."}]},
  {h:"Le quoting : la règle qui sauve la prod", g:[
   {code:"DOSSIER=\"/var/log des applis\"\necho \"$DOSSIER\"   # guillemets DOUBLES : variable remplacée, texte préservé\necho '$DOSSIER'   # apostrophes : rien n'est interprété (texte littéral)\necho $DOSSIER     # NU : remplacée PUIS découpée aux espaces → 3 arguments\nFICHIER=\"/var/log/rapport de sauvegarde.log\"\nrm $FICHIER       # ❌ tente de supprimer 3 fichiers différents\nrm \"$FICHIER\"     # ✅ un seul argument"},
   {p:"Le scénario qui fait mal : DOSSIER_TMP=\"\" puis rm -rf $DOSSIER_TMP/* → Bash remplace par du vide et exécute rm -rf /*. Le script n'a pas planté : il a parfaitement fonctionné."},
   {def:"**La règle** : toute variable s'écrit entre guillemets doubles. Toujours. Les apostrophes servent à passer du texte que le shell ne doit pas toucher (regex, motifs pour find : find /var/log -name '*.log')."},
   {p:"Correction (bonus) : contre ce piège, Bash offre \"${VAR:?}\" : le script s'arrête si VAR est vide (c'est ce que suggère shellcheck SC2115)."}]},
  {h:"Tests : [[ … ]], fichiers, chaînes, entiers", g:[
   {p:"Un test = une commande qui pose une question au système. Avec #!/bin/bash, utilisez **[[ ]]** (plus sûr, plus riche que [ ] POSIX). Espaces obligatoires à l'intérieur."},
   {h:"Fichiers", kv:[["-e","Le chemin existe"],["-f","Fichier ordinaire"],["-d","C'est un dossier"],["-r / -w / -x","Lisible / écrivable / exécutable"],["-s","Existe et non vide"]]},
   {h:"Chaînes", kv:[["-z \"$v\"","Vide"],["-n \"$v\"","Non vide"],["\"$a\" == \"$b\"","Égales"],["\"$a\" != \"$b\"","Différentes"]]},
   {h:"Entiers", kv:[["-eq / -ne","Égal / différent"],["-gt / -ge","Plus grand / plus grand ou égal"],["-lt / -le","Plus petit / plus petit ou égal"]]},
   {p:"Jamais > ni < pour comparer des nombres : dans [ \"$a\" > \"$b\" ], le > est une redirection : ça ne compare rien et ça crée un fichier, silencieusement. Utiliser -gt, -lt…"}]},
  {h:"Conditions : if / elif / else & idempotence", g:[
   {code:"if [[ \"$OCC\" -ge 90 ]]; then    # pièges : ; avant then, fi, \"elif\" (pas \"else if\")\n    echo \"CRITIQUE : disque à ${OCC} %\"\nelif [[ \"$OCC\" -ge 75 ]]; then\n    echo \"ATTENTION : ${OCC} %\"\nelse\n    echo \"OK : ${OCC} %\"\nfi\n# Tester une COMMANDE, pas une valeur (on demande au système)\nif id \"$LOGIN\" &>/dev/null; then echo \"Compte existe\"; fi\nif ! ping -c 1 -W 2 \"$SRV\" &>/dev/null; then echo \"$SRV KO\" >&2; fi\n# Pattern d'idempotence : le motif de toute votre carrière\nif [[ -d \"$DOSSIER\" ]]; then\n    echo \"Existe déjà\"\nelse\n    mkdir -p \"$DOSSIER\"\nfi   # version courte : mkdir -p, rm -f"}]},
  {h:"Boucles : for, glob, while read, while condition", g:[
   {code:"# for sur une liste\nfor SRV in srv-web-01 srv-web-02 srv-bdd-01; do\n    ping -c 1 -W 2 \"$SRV\" &>/dev/null && echo \"$SRV OK\" || echo \"$SRV KO\"\ndone\nfor i in {1..254}; do ping -c1 -W1 \"10.0.0.$i\" &>/dev/null && echo \"10.0.0.$i\"; done\n# for sur un motif de fichiers (glob, JAMAIS $(ls))\nfor FICHIER in /var/log/*.log; do\n    [[ -f \"$FICHIER\" ]] || continue   # motif littéral si rien ne match\n    du -h \"$FICHIER\"\ndone\n# while read : lire un CSV ligne par ligne (IFS + -r systématiques)\nwhile IFS=',' read -r LOGIN NOM SERVICE; do\n    id \"$LOGIN\" &>/dev/null && { echo \"$LOGIN existe, ignoré\"; continue; }\n    useradd -m -c \"$NOM\" \"$LOGIN\"\ndone < utilisateurs.csv\n# while condition avec compteur (jamais de boucle infinie non bornée)\nT=1; while [[ \"$T\" -le 3 ]]; do ping -c1 \"$SRV\" && break; sleep 5; ((T++)); done"},
   {p:"Jamais **for … in $(ls …)** : découpage aux espaces, un fichier « rapport de sauvegarde.log » donne 3 itérations. Le glob gère les espaces correctement."}]},
  {h:"Arguments, codes retour & set -euo pipefail", g:[
   {code:"# $0 = nom du script, $1..$N = args, $# = nombre, $@ = tous (toujours quoté)\nDOSSIER=\"${1:-/var/log}\"     # valeur par défaut\nRETENTION=\"${2:-30}\"\n# Bloc d'entrée d'un script sérieux\nif [[ \"$#\" -ne 2 ]]; then\n    echo \"Usage : $0 <dossier> <jours>\" >&2\n    exit 1\nfi\n[[ -d \"$1\" ]] || { echo \"Dossier absent\" >&2; exit 2; }\n# Code retour : 0 = succès, ≠0 = échec. $? = code de la dernière commande.\nif ! tar -czf \"$ARCHIVE\" \"$DOSSIER\"; then\n    echo \"Échec sauvegarde\" >&2; exit 1\nfi\nexit 0\n# Mode strict : en tête de tout script sérieux\nset -euo pipefail  # -e stop à l'échec, -u var non définie, pipefail sur pipes"},
   {p:"Pourquoi le code retour compte : cron, systemd, la supervision et la CI le lisent. Un script de sauvegarde qui échoue en silence avec exit 0 est pire qu'un script absent : il fait croire que la sauvegarde a été faite. Convention : **0** OK, **1** erreur générale, **2** mauvais usage."}]},
  {h:"Fonctions : local, code retour vs valeur", g:[
   {code:"sauvegarder() {\n    local SOURCE=\"$1\"      # local = limite à la fonction\n    local DEST=\"$2\"\n    local NOM\n    NOM=$(basename \"$SOURCE\")\n    tar -czf \"${DEST}/${NOM}_$(date +%F).tar.gz\" \"$SOURCE\"\n}\nsauvegarder /etc /sauvegardes\n# return renvoie un CODE (0-255), pas une valeur. Pour une valeur : echo + $( )\ncompte_existe() { id \"$1\" &>/dev/null; }\nif compte_existe \"alice\"; then echo \"OK\"; fi\noccupation() { df --output=pcent \"$1\" | tail -1 | tr -dc '0-9'; }\nTAUX=$(occupation /var)\n# La fonction que tout le monde écrit\nlog() { echo \"$(date '+%F %T') [$1] $2\"; }\nlog INFO \"Démarrage\"; log ERROR \"Impossible d'écrire\""},
   {p:"Une fonction reçoit ses arguments comme un script : $1, $@. Toutes les fonctions en haut du fichier, le déroulé en bas."}]},
  {h:"Redirections & journalisation", g:[
   {code:"echo \"OK\"           # stdout (canal 1)\necho \"KO\" >&2      # stderr (canal 2)\ncmd > fichier       # écrase (⚠ efface sans prévenir)\ncmd >> fichier      # AJOUTE à la fin\ncmd 2> erreurs.log  # stderr seulement\ncmd &> tout.log     # stdout ET stderr\ncmd &>/dev/null     # tout jeter (garder juste le code retour)\ncmd > f 2>&1        # l'ordre compte : 2>&1 > f ne fait PAS pareil\n# tee : écrire ET afficher, et débloque le cas \"sudo > fichier\"\necho \"srv-web-02\" | sudo tee /etc/hostname     # ✅ (sudo > fichier ❌)\n./inventaire.sh | tee -a /var/log/inventaire.log  # -a = append"},
   {p:"Log daté : LOG_FILE=\"/var/log/mes-scripts/purge-$(date +%F).log\" : un fichier par jour, rotation naturelle, on retrouve un incident par sa date. Ne journalisez jamais mot de passe, token ou donnée personnelle."}]},
  {h:"shellcheck & les pièges classiques", g:[
   {p:"**shellcheck** = analyseur statique. Il lit le code sans l'exécuter et signale ce qui va casser. sudo apt install shellcheck puis shellcheck script.sh. À lancer avant chaque git commit. Il dit si le script est écrit correctement, pas s'il fait la bonne chose."},
   {kv:[["SC2086","Variable non quotée (espaces + globbing)"],["SC2154","Variable jamais assignée (souvent une typo)"],["SC2115","rm -rf \"$VAR\"/ qui peut devenir rm -rf /"],["SC2164","cd sans || exit en cas d'échec"],["SC2148","Shebang manquant"]]},
   {table:{head:["Symptôme","Cause","Correction"], rows:[
    ["DOSSIER : commande introuvable","Espaces autour du =","DOSSIER=\"/var/log\""],
    ["$'\\r' : commande introuvable","Fichier enregistré sous Windows (CRLF)","dos2unix script.sh"],
    ["Permission non accordée","Droit d'exécution absent","chmod +x script.sh"],
    ["Marche depuis son dossier, pas ailleurs","Chemins relatifs","Chemins absolus ou calculés"]]}},
   {p:"Chemin du script lui-même : SCRIPT_DIR=\"$(cd \"$(dirname \"$0\")\" && pwd)\". Dans un script d'exploitation, les chemins sont absolus ou calculés, jamais supposés. Piège classique avec cron."}]}
 ]},
 {id:"03.5", t:"Cron & crontab", sub:"Planifier des scripts : syntaxe des 5 champs, variables, redirections, verrouillage, dépannage, anacron", parts:[
  {h:"Cron : le planificateur de tâches standard", g:[
   {def:"**Cron** (daemon cron ou crond) = service qui tourne en permanence et exécute automatiquement des commandes ou scripts : à des heures précises, à intervalles réguliers, selon des patterns complexes. Usage : sauvegardes, mises à jour, monitoring, nettoyage, rapports."},
   {code:"systemctl status cron     # Debian/Ubuntu\nsystemctl status crond    # RedHat/CentOS\nsudo systemctl enable cron   # activer au démarrage"},
   {p:"Adage : un script qu'il faut penser à lancer est un script qu'on oubliera de lancer. La preuve que ça marche, c'est une ligne dans le log, pas votre souvenir de l'avoir lancé."}]},
  {h:"Où planifier ? Les 4 emplacements", g:[
   {table:{head:["Type","Fichier","Édition"], rows:[
    ["User crontab","/var/spool/cron/crontabs/<user>","crontab -e"],
    ["System crontab","/etc/crontab","Édition directe (root), colonne user en plus"],
    ["Cron.d","/etc/cron.d/*","Packages/applications (colonne user aussi)"],
    ["Répertoires","/etc/cron.{hourly,daily,weekly,monthly}/","Un script exécutable suffit"]]}},
   {p:"Les répertoires hourly/daily/weekly/monthly évitent la syntaxe crontab pour les fréquences courantes."}]},
  {h:"La syntaxe des 5 champs", g:[
   {code:"┌───────── minute        (0-59)\n│ ┌─────── heure         (0-23)\n│ │ ┌───── jour du mois  (1-31)\n│ │ │ ┌─── mois          (1-12)\n│ │ │ │ ┌─ jour semaine  (0-7, 0 et 7 = dimanche)\n│ │ │ │ │\n* * * * * commande\n\n30 2 * * *  /home/user/backup.sh        # tous les jours à 2h30\n0  * * * *  /usr/local/bin/check.sh     # toutes les heures\n0  8 * * 1  /home/user/rapport.sh       # tous les lundis à 8h\n0  0 1 * *  /home/user/mensuel.sh       # le 1er du mois à minuit"},
   {kv:[["*","Toutes les valeurs : * * * * * = chaque minute"],[",","Liste : 0 9,12,18 * * * = 9h, 12h, 18h"],["-","Plage : 0 9-17 * * * = de 9h à 17h"],["/","Intervalle : */15 * * * * = toutes les 15 min"]]},
   {p:"Combinés : **30 8,16 * * 1-5** = 8h30 et 16h30 en semaine. **0 */2 * * *** = toutes les 2 heures."}]},
  {h:"Raccourcis @ & gestion de la crontab", g:[
   {h:"Raccourcis", kv:[["@reboot","Au démarrage"],["@hourly","0 * * * *"],["@daily / @midnight","0 0 * * *"],["@weekly","0 0 * * 0"],["@monthly","0 0 1 * *"],["@yearly / @annually","0 0 1 1 *"]]},
   {h:"Commandes", kv:[["crontab -e","Éditer sa crontab"],["crontab -l","Lister sa crontab"],["crontab -r","Supprimer (⚠ tout)"],["crontab -ri","Supprimer avec confirmation"],["crontab -u alice -e","Éditer celle d'un autre (root)"]]}]},
  {h:"Variables d'environnement & redirections", g:[
   {def:"**Cron a un environnement minimal.** Un PATH incomplet est la première cause de « ça marche à la main mais pas en cron ». Toujours définir en tête de crontab."},
   {code:"SHELL=/bin/bash\nPATH=/usr/local/bin:/usr/bin:/bin\nMAILTO=admin@techsecure.fr      # destinataire des sorties par email\nHOME=/home/admin\n0 2 * * * /home/admin/scripts/backup.sh\n# Redirections : par défaut cron envoie la sortie par mail\n0 2 * * * /home/user/backup.sh > /var/log/backup.log 2>&1   # tout dans un log\n0 2 * * * /home/user/script.sh > /dev/null 2>&1             # tout jeter\n0 2 * * * /home/user/script.sh 2>> /var/log/script.err      # erreurs seules"}]},
  {h:"Bonnes pratiques : un script planifié solide", g:[
   {ul:["**Chemins absolus** toujours : backup.sh ❌ → /home/user/scripts/backup.sh ✅","**Shebang** #!/bin/bash en tête (cron n'utilise pas votre shell interactif)","**Droit d'exécution** avec chmod +x","**Journaliser** chaque exécution (début, fin, code retour)","**Verrouiller** pour éviter les exécutions concurrentes (lockfile)","**Documenter** chaque tâche : un commentaire par ligne de crontab"]},
   {code:"# Verrou anti-concurrence\nLOCKFILE=/var/lock/backup.lock\nif [[ -f \"$LOCKFILE\" ]]; then\n    echo \"Déjà en cours\" >&2 ; exit 1\nfi\ntrap 'rm -f \"$LOCKFILE\"' EXIT     # nettoyage automatique\ntouch \"$LOCKFILE\"\n# Log daté + code retour\nLOG=\"/var/log/backup.log\"\necho \"[$(date '+%F %T')] Début\" >> \"$LOG\"\ntar -czf \"/backup/data_$(date +%F).tar.gz\" /data >> \"$LOG\" 2>&1\nif [[ $? -eq 0 ]]; then echo \"[$(date '+%F %T')] OK\" >> \"$LOG\"\nelse echo \"[$(date '+%F %T')] ÉCHEC\" >> \"$LOG\"; exit 1; fi"},
   {p:"Correction (bonus) : ce verrou (test puis touch) laisse une fenêtre où deux exécutions passent. flock pose le verrou de façon atomique : flock -n /var/lock/backup.lock script.sh."}]},
  {h:"Dépannage : « ça ne part pas »", g:[
   {kv:[
    ["Le service cron tourne ?","systemctl status cron"],
    ["La crontab est bien enregistrée ?","crontab -l"],
    ["Le script est exécutable ?","ls -l script.sh puis chmod +x"],
    ["Logs de cron","grep CRON /var/log/syslog (Debian) / /var/log/cron (RH)"],
    ["Le script marche en direct ?","su - user puis ./script.sh"]]},
   {code:"# Test de l'environnement cron (le vrai piège)\n* * * * * env > /tmp/cron-env.txt   # capture l'env cron\nenv > /tmp/shell-env.txt            # capture l'env shell\ndiff /tmp/cron-env.txt /tmp/shell-env.txt"},
   {p:"**Le piège n°1** : le script marche à la main mais pas en cron. Cause presque toujours un PATH incomplet ou une variable d'env chargée par .bashrc qui n'est pas là. Fixer les chemins ou source ~/.profile en tête du script."}]},
  {h:"Anacron : pour les machines pas 24/7", g:[
   {def:"**Anacron** = alternative à cron pour les postes de travail et laptops. Si la machine était éteinte à l'heure prévue, cron saute la tâche. Anacron rattrape les tâches manquées au prochain démarrage."},
   {table:{head:["Aspect","Cron","Anacron"], rows:[
    ["Précision","À la minute","Au jour"],
    ["Machine off","Tâche perdue","Rattrapage au boot"],
    ["Utilisateurs","User + système","Système uniquement"],
    ["Terrain","Serveurs 24/7","Postes / laptops"]]}},
   {code:"# /etc/anacrontab\n# period delay job-identifier command\n1   5   cron.daily    run-parts /etc/cron.daily\n7   10  cron.weekly   run-parts /etc/cron.weekly\n30  15  cron.monthly  run-parts /etc/cron.monthly"},
   {p:"Aller plus loin : **systemd timers** = alternative moderne (unit files, dépendances, journalisation via journald). **at** = tâche ponctuelle, une seule fois. **batch** = quand la machine est calme."}]}
 ]}
,{id:"04", t:"PowerShell", sub:"Pipeline d'objets, Verbe-Nom, exploration, sécurité d'exécution, garde-fous, AD et IA", parts:[
  {h:"Le principe : pipeline d'objets, pas de texte", g:[
   {def:"La grande différence Bash → PowerShell : en Bash le | transporte du **texte**. En PowerShell il transporte des **objets** (fiches avec type, propriétés nommées, méthodes). C'est le seul point qu'on ne peut pas deviner : le reste est de la traduction."},
   {code:"# Bash : filtrer un affichage (casse si la sortie change de forme)\nsc query state= all | find \"STOPPED\"\n# PowerShell : filtrer des objets par propriété (robuste)\nGet-Service | Where-Object Status -eq 'Stopped'"},
   {p:"Convention : une cmdlet s'appelle toujours **Verbe-Nom**, nom au singulier. Verbes normés (Get-Verb) : Get (lire), Set (modifier), New (créer), Remove, Start/Stop/Restart, Test (booléen), Export/Import."},
   {def:"Le trio qui rend PowerShell explorable : **Get-Command** (ça existe ?), **Get-Help** (ça prend quoi, ça fait quoi ?), **Get-Member** (ça renvoie quoi ?). Réflexe systématique sur tout ce qui est nouveau."},
   {code:"Get-Command *volume*                    # chercher\nGet-Help Get-Volume -Examples -Online   # doc utile\nGet-Volume | Get-Member                 # lister les propriétés (pas les deviner)"},
   {p:"Alias (ls, cd, cat, %, ?) : en console OK, jamais dans un script."}]},
  {h:"Les 5 outils du pipeline & 3 pièges", g:[
   {table:{head:["Cmdlet","Rôle","Exemple"], rows:[
    ["Where-Object","Filtre","… | Where-Object WorkingSet -gt 100MB"],
    ["Select-Object","Choisit / limite","… | Select-Object -First 5 Name, CPU"],
    ["Sort-Object","Trie","… | Sort-Object Length -Descending"],
    ["Measure-Object","Compte, somme","… | Measure-Object Length -Sum"],
    ["Group-Object","Regroupe","… | Group-Object Extension"]]}},
   {code:"# Un pipeline se lit comme une phrase (1MB/1GB/1TB compris nativement)\nGet-ChildItem C:\\Windows -File |\n    Where-Object Length -gt 1MB |\n    Sort-Object Length -Descending |\n    Select-Object -First 5 Name, Length\n# Deux écritures de Where-Object\nGet-Service | Where-Object Status -eq 'Stopped'            # 1 comparaison\nGet-Service | Where-Object { $_.Status -eq 'Stopped' }     # $_ = objet en cours\n# Livrable audit : CSV (les 3 options ne sont PAS décoratives)\n… | Export-Csv .\\rapport.csv -Delimiter ';' -NoTypeInformation -Encoding UTF8"},
   {h:"3 pièges classiques", steps:[
    ["Format-Table tue les objets","En fin de pipeline pour un humain uniquement. Jamais avant Export-* ou Where-Object"],
    ["Write-Host peint des caractères à l'écran","N'écrit pas dans le pipeline : ni capturable, ni redirigeable. Pour envoyer une donnée : Write-Output"],
    ["Jeter une sortie","… | Out-Null (le /dev/null de PowerShell)"]]},
   {p:"Windows en français : les libellés sont traduits, pas les propriétés ni les valeurs. C'est Running, Stopped, Automatic, pas « Arrêté »."}]},
  {h:"Bases du langage : traducteur depuis Bash", g:[
   {table:{head:["Bash","PowerShell"], rows:[
    ["NOM=\"srv\"","$Nom = \"srv\""],
    ["echo \"$NOM\"","\"$Nom\""],
    ["[[ \"$a\" -gt 80 ]]","$a -gt 80"],
    ["&& / || / !","-and / -or / -not"],
    ["== *.log / =~","-like / -match"],
    ["LISTE=(a b c)","@('a','b','c')"],
    ["[[ -f \"$F\" ]]","Test-Path $F -PathType Leaf"]]}},
   {code:"if ($L -lt 10)      { \"Critique\" }\nelseif ($L -lt 25)  { \"Surveille\" }\nelse                { \"RAS\" }\nforeach ($s in @('Spooler','W32Time')) {\n    (Get-Service $s).Status\n}\n# propriété d'objet dans une chaîne :\n\"État : $($Service.Status)\""},
   {p:"Écarts qui piquent : le $ est là à l'affectation aussi. Accolades obligatoires (ni then/fi/done). -eq ignore la casse sur chaînes par défaut (-ceq pour sensibilité)."}]},
  {h:"Exécution, en-tête d'aide, encodage", g:[
   {kv:[["Restricted","Aucun script (défaut client)"],["RemoteSigned","Locaux OK, téléchargés signés"],["Bypass","Tout passe (labo seulement)"]]},
   {code:"Set-ExecutionPolicy RemoteSigned\nUnblock-File .\\script.ps1     # retire \"téléchargé\"\n.\\inventaire.ps1              # .\\ obligatoire\n\n<#\n.SYNOPSIS   Inventaire → CSV.\n.PARAMETER  CheminSortie Défaut : C:\\Logs\n.EXAMPLE    .\\Get-Inv.ps1 -CheminSortie D:\\\n#>\n#Requires -RunAsAdministrator\n#Requires -Version 5.1\n#Requires -Modules ActiveDirectory"},
   {p:"Get-Help .\\script.ps1 = aide comme une cmdlet native. Malgré le #, **#Requires** n'est pas un commentaire : refuse de démarrer si absent."},
   {p:"**Encodage** : enregistrer les .ps1 en UTF-8 avec BOM (WinPS 5.1). Sans BOM → lu en ANSI → terminée devient terminÃ©e. VS Code affiche l'encodage en bas à droite. Fermé par défaut : la majorité des .ps1 reçus par mail sont malveillants."}]},
  {h:"Fonctions param(), idempotence & CSV", g:[
   {code:"function Get-EspaceDisque {\n    param([Parameter(Mandatory=$true)][string]$Lettre,\n          [int]$Seuil=15)\n    $V = Get-Volume -DriveLetter $Lettre\n    [math]::Round(($V.SizeRemaining/$V.Size)*100, 1)\n}\n# Import-Csv : un objet par ligne, propriétés = colonnes (ni IFS ni read -r !)\nforeach ($L in Import-Csv .\\arrivees.csv -Delimiter ';') {\n    $Login = ($L.prenom.Trim().Substring(0,1) + $L.nom.Trim()).ToLower()\n    if (Get-ADUser -Filter \"SamAccountName -eq '$Login'\") { continue }  # idempotence\n    New-ADUser -Name \"$($L.prenom) $($L.nom)\" -SamAccountName $Login `\n        -Department $L.service -Enabled $false                      # créé désactivé\n}"},
   {p:"Fonctions : verbe approuvé obligatoire. **Mandatory=$true** → PowerShell demande le paramètre si absent (contrôle d'usage en déclaratif)."}]},
  {h:"Garde-fous : -WhatIf, ErrorAction Stop, try/catch", g:[
   {def:"**-WhatIf** = --dry-run offert par le langage, disponible sur presque toutes les cmdlets modifiantes (Remove-*, Stop-Service, Restart-Computer). Sur un script que vous n'avez pas écrit, -WhatIf est la 1re chose à taper. -Confirm:$false (fréquent dans les scripts en ligne) désactive la question : méfiance."},
   {p:"**Le piège majeur** : par défaut, la plupart des cmdlets produisent des erreurs non terminantes → un try/catch ne se déclenche jamais. Il faut le dire : -ErrorAction Stop par cmdlet, ou $ErrorActionPreference = 'Stop' global."},
   {code:"try     { Copy-Item $Source $Cible -ErrorAction Stop ; Write-Journal \"OK\" }\ncatch   { Write-Journal \"Échec : $($_.Exception.Message)\" ERROR ; exit 2 }\nfinally { Write-Journal \"Fin du traitement\" }\nexit 0   # 0=OK, 1=erreur, 2=mauvais usage (lu par le Planificateur)"}]},
  {h:"PSScriptAnalyzer & journalisation", g:[
   {p:"**PSScriptAnalyzer** = le shellcheck de PowerShell. Install-Module PSScriptAnalyzer -Scope CurrentUser puis Invoke-ScriptAnalyzer -Path .\\script.ps1. À lancer avant chaque git commit. Il vérifie la forme (pas que le script fait la bonne chose)."},
   {p:"Règles les plus fréquentes : PSUseApprovedVerbs (verbe non approuvé), PSAvoidUsingCmdletAliases (gci), PSAvoidUsingWriteHost, PSAvoidUsingPlainTextForPassword, PSUseDeclaredVarsMoreThanAssignments (signature d'un copier-coller IA)."},
   {code:"# Journalisation minimale : un fichier daté, format uniforme\n$J = \"C:\\Logs\\inventaire-$(Get-Date -Format 'yyyy-MM-dd').log\"\nfunction Write-Journal {\n    param([string]$Message, [ValidateSet('INFO','WARN','ERROR')][string]$Niveau='INFO')\n    \"[{0}] [{1}] {2}\" -f (Get-Date -Format 'yyyy-MM-dd HH:mm:ss'),$Niveau,$Message |\n        Out-File $J -Append -Encoding UTF8\n}"},
   {p:"Mot de passe en clair : ConvertTo-SecureString \"P@ssw0rd\" -AsPlainText -Force : SecureString OK, mot de passe juste à côté non. Sorties propres : Read-Host -AsSecureString, Get-Credential, un coffre. Ne jamais journaliser mot de passe, jeton, donnée personnelle."}]},
  {h:"Inventaire [PSCustomObject] & Active Directory", g:[
   {code:"# Décider les colonnes AVANT de coder, puis fabriquer son propre objet\n$I = [PSCustomObject]@{\n    Machine     = $env:COMPUTERNAME\n    OS          = (Get-CimInstance Win32_OperatingSystem).Caption\n    RAM_Go      = [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1GB,1)\n    Disque_C_Go = [math]::Round((Get-Volume -DriveLetter C).SizeRemaining/1GB,1)\n    Date        = Get-Date -Format 'yyyy-MM-dd HH:mm'\n}\n$I | Export-Csv .\\inv.csv -Delimiter ';' -NoTypeInformation -Encoding UTF8\n# AD : -Properties OBLIGATOIRE pour LastLogonDate, Description, MemberOf…\nGet-ADUser -Filter * -Properties LastLogonDate | Select Name,Enabled,LastLogonDate\nGet-ADUser -Filter \"Enabled -eq 'False'\"          # -Filter a sa PROPRE syntaxe\nSearch-ADAccount -AccountInactive -TimeSpan 90.00:00:00 -UsersOnly\nGet-ADGroupMember -Identity \"Admins du domaine\"   # libellé traduit !"},
   {steps:[
    ["-Filter * sans -Properties","Colonnes vides sans erreur"],
    ["Libellés traduits","Admins du domaine, Administrateurs ; les propriétés non. Sur parc multilingue, viser le SID"],
    ["Get-WmiObject déprécié","→ Get-CimInstance"]]}]},
  {h:"IA & PowerShell : l'hallucination invisible", g:[
   {p:"La convention Verbe-Nom est parfaitement régulière : c'est ce qui rend l'invention indétectable. En Bash, une commande inventée ne ressemble à rien. En PowerShell, elle ressemble à tout le reste."},
   {table:{head:["Existe vraiment","N'existe pas (mais crédible)"], rows:[
    ["Get-Service","Get-ServiceStatus"],["Get-Volume","Get-DiskSpace"],["Get-LocalUser","Get-UserProfile"],["Restart-Computer","Restart-Workstation"]]}},
   {code:"# Le réflexe : les mêmes 3 commandes, en 10 secondes\nGet-Command Get-DiskSpace          # existe ? non !\nGet-Help Get-Volume -Parameter *\nGet-Volume -DriveLetter C | Get-Member"},
   {p:"PSScriptAnalyzer ne détecte pas une cmdlet inventée : il vérifie la forme, **Get-Command vérifie l'existence**. Le cas le plus vicieux : 2 cmdlets sur 3 existent → le script démarre, fait la moitié du travail, s'arrête au milieu. Sur une purge ou une sauvegarde, c'est le pire scénario possible."},
   {p:"Bash hier vs PowerShell aujourd'hui : en Bash, le script généré est mal écrit mais il tourne. En PowerShell, il est très bien écrit et ne peut pas tourner."}]}
 ]},
 {id:"02", t:"Python", sub:"Quand sortir Python, syntaxe, structures, fichiers, API REST, erreurs, argparse, venv et IA", parts:[
  {h:"Quand sortir Python, et quand ne pas", g:[
   {def:"**Python** = 3e langage qu'on sort quand Bash et PowerShell ne suffisent plus. Vous ne réapprenez pas à programmer : vous apprenez une grammaire."},
   {p:"Les signaux qui disent « passe à Python » : votre script Bash appelle jq 3 fois dans le même pipe ; vous parsez du JSON avec sed/cut et beaucoup d'espoir ; vous simulez un tableau 2D avec des variables numérotées ; vous devez appeler une API avec gestion d'erreurs/jetons/pagination ; le même besoin existe sur Windows et Linux."},
   {table:{head:["Besoin","Bash","PowerShell","Python"], rows:[
    ["Données structurées","Texte à découper","Objets (Windows)","Natif partout"],
    ["JSON","jq en dépendance","ConvertFrom-Json","Module standard"],
    ["Appel HTTP","curl + parsing","Invoke-RestMethod","requests"],
    ["Windows et Linux","❌","Possible","✅"]]}},
   {p:"Le meilleur langage n'est pas le plus puissant : c'est celui qui est déjà installé et que l'équipe sait relire. Renommer 40 fichiers → Bash. Croiser 2 sources → Python. Piloter AD → PowerShell. Traitement > 150 lignes → Python."},
   {p:"Le prix Python : un interpréteur, souvent des dépendances, parfois un environnement virtuel. Bash et PowerShell sont déjà là."}]},
  {h:"Syntaxe : table de traduction depuis Bash / PS", g:[
   {table:{head:["Bash","PowerShell","Python"], rows:[
    ["NOM=\"srv\"","$Nom = \"srv\"","nom = \"srv\" (pas de $)"],
    ["echo \"$NOM\"","Write-Output $Nom","print(nom)"],
    ["\"Hôte : $NOM\"","\"Hôte : $Nom\"","f\"Hôte : {nom}\" (f-string)"],
    ["[[ \"$a\" -gt 80 ]]","$a -gt 80","a > 80 (comparaison réelle)"],
    ["&& / || / !","-and / -or / -not","and / or / not"],
    ["${#liste[@]}","$Liste.Count","len(liste)"]]}},
   {def:"**L'indentation fait partie de la syntaxe.** Ailleurs c'est une politesse, en Python c'est le langage. Un bloc mal indenté ne provoque pas toujours une erreur : parfois il change le sens du programme. 4 espaces par niveau, jamais de tabulations mélangées."},
   {code:"seuil = 80\nfor serveur in [\"srv-web-01\", \"srv-bdd-01\"]:   # : ouvre un bloc\n    taux = occupation(serveur)                 # indentation = bloc\n    if taux > seuil:\n        print(f\"{serveur} : {taux} %\")          # f-string"}]},
  {h:"Types & structures : le dictionnaire", g:[
   {p:"En Bash, tout est chaîne. En Python, non. print(\"5\" + 5) → **TypeError**. Tout ce qui sort d'un fichier, CSV ou argument est une chaîne : int() avant de comparer à un seuil (\"91\" > 80 plante)."},
   {code:"# Le dictionnaire : paires clé/valeur, pas d'équivalent simple en Bash\nserveur = {\"nom\": \"srv-web-01\", \"role\": \"web\", \"disque_pct\": 91}\nprint(serveur[\"nom\"])                   # srv-web-01\nprint(serveur.get(\"os\", \"inconnu\"))      # fallback au lieu de planter\n# La LISTE DE DICTIONNAIRES : la forme de toutes vos données\n# (ligne de CSV, objet JSON, réponse d'API…)\nparc = [\n    {\"nom\": \"srv-web-01\", \"role\": \"web\", \"disque_pct\": 91},\n    {\"nom\": \"srv-bdd-01\", \"role\": \"bdd\", \"disque_pct\": 44},\n]\ncritiques = [s[\"nom\"] for s in parc if s[\"disque_pct\"] > 80]   # compréhension\npire = max(parc, key=lambda s: s[\"disque_pct\"])"},
   {p:"serveur[\"os\"] sur clé absente lève **KeyError** et arrête le script. Sur données d'API, .get() est presque toujours le bon choix."}]},
  {h:"Fichiers, CSV, JSON", g:[
   {code:"# with ferme le fichier automatiquement, même sur exception\nwith open(\"/etc/hosts\", encoding=\"utf-8\") as f:\n    for ligne in f:\n        print(ligne.strip())\n# CSV → liste de dictionnaires (DictReader lit l'en-tête)\nimport csv\nwith open(\"parc.csv\", newline=\"\", encoding=\"utf-8-sig\") as f:\n    parc = list(csv.DictReader(f, delimiter=\";\"))\nfor s in parc:\n    if int(s[\"disque_pct\"]) > 80:          # int() obligatoire !\n        print(f\"{s['nom']:14} {s['role']:6} {s['disque_pct']} %\")\n# JSON = dict Python. loadS/dumpS avec 's' = string, sans s = fichier\nimport json\nwith open(\"suivi.json\", encoding=\"utf-8\") as f:\n    conf = json.load(f)"},
   {p:"Les 2 pièges CSV : ① **newline=\"\"** à l'ouverture (sans lui, Windows → ligne vide sur deux). ② **encoding=\"utf-8-sig\"** dès que le fichier vient d'Excel (BOM invisible en tête) → sinon KeyError: 'nom' car la 1re clé est \\ufeffnom. utf-8-sig lit avec ou sans BOM."},
   {p:"Toujours encoding=\"utf-8\" : sinon marche sur le poste, casse sur le serveur au 1er accent. Jamais d'open() sans with."}]},
  {h:"API REST avec requests", g:[
   {p:"Une **API REST** = URL (ressource) + verbe (GET/POST/PUT/DELETE) + code de statut. En Python, la réponse arrive directement comme dictionnaire."},
   {code:"import requests\nreponse = requests.get(\n    \"https://api.github.com/repos/grafana/grafana/releases/latest\",\n    timeout=10,                     # ⚠ JAMAIS optionnel\n)\nprint(reponse.status_code)          # 200\ndonnees = reponse.json()            # → dict Python\nprint(donnees[\"tag_name\"], donnees[\"published_at\"])\n# Bon rapport : \"à jour\" / \"à mettre à jour\" / \"impossible de savoir\"\nif reponse.status_code == 404:\n    return None                     # produit → statut INCONNU\nreponse.raise_for_status()          # exception sur 4xx et 5xx\nprint(reponse.headers[\"X-RateLimit-Remaining\"])   # quota restant"},
   {p:"Sans **timeout**, un serveur muet suspend votre script indéfiniment. En tâche planifiée, personne ne le voit. Piège du quota : GitHub anonyme = 60 req/h par IP publique ; toute la salle sort par la même IP, donc 60 pour tout le monde. Parade : enregistrer une réponse en JSON, développer dessus."}]},
  {h:"Erreurs, codes retour, argparse, venv", g:[
   {code:"try:\n    with open(chemin, encoding=\"utf-8\") as f:\n        conf = json.load(f)\nexcept FileNotFoundError:\n    print(f\"Fichier introuvable : {chemin}\", file=sys.stderr)\n    sys.exit(2)\nexcept json.JSONDecodeError as e:\n    print(f\"JSON invalide : {e}\", file=sys.stderr)\n    sys.exit(2)"},
   {p:"**Jamais d'except nu !** except: ou même except Exception: pass avale la faute de frappe que vous cherchez 2 h, le Ctrl+C de l'opérateur, la panne réseau que la supervision aurait dû voir. Motif classique des scripts hérités « qui ne plantent jamais » et ne font plus rien depuis 8 mois."},
   {code:"# argparse : --help généré gratuitement (en Bash, à écrire à la main)\nimport argparse\np = argparse.ArgumentParser(description=\"Veille de versions.\")\np.add_argument(\"config\", help=\"fichier JSON des produits suivis\")   # positionnel\np.add_argument(\"-o\", \"--sortie\", default=\"veille.csv\")              # option\np.add_argument(\"-v\", \"--verbeux\", action=\"store_true\")              # drapeau\nargs = p.parse_args()\n# venv + requirements.txt (sur Debian 13, pip system-wide est bloqué)\npython3 -m venv .venv && source .venv/bin/activate\npip install requests && pip freeze > requirements.txt"},
   {p:"requirements.txt se commite. Le dossier .venv, jamais (dans .gitignore) : il se régénère en 10 secondes. Codes retour : 0 OK, 1 erreur, 2 mauvais usage."}]},
  {h:"IA & Python : le vrai risque est hors du langage", g:[
   {p:"Python est le langage que les modèles écrivent le mieux. Le problème n'est pas la syntaxe : c'est tout ce qui est en dehors du langage, et une API est en dehors du langage."},
   {code:"# Code parfait, entièrement faux : la vraie API Zabbix est POST sur\n# api_jsonrpc.php, la clé n'est pas \"hosts\" mais \"result\", etc.\nreponse = requests.get(f\"{url}/api/v2/hosts\", headers=entetes)\nfor hote in reponse.json()[\"hosts\"]:\n    if hote[\"maintenance\"]:\n        print(hote[\"hostname\"])"},
   {def:"**Slopsquatting** : les modèles inventent aussi des noms de paquets (import zabbix_helper ; pip install zabbix-helper). 2 cas : ① le paquet n'existe pas (1 min perdue), ② quelqu'un a enregistré ce nom halluciné sur PyPI en attendant qu'on l'installe. Le code s'exécute avec vos droits et vos jetons. Toute dépendance suggérée se vérifie avant installation."},
   {code:"# Le réflexe : un appel réel D'ABORD (10 lignes, 5 secondes)\nreponse = requests.get(url, headers=entetes, timeout=10)\nprint(reponse.status_code)\nprint(json.dumps(reponse.json(), indent=2, ensure_ascii=False)[:1000])\n# Vous savez si l'endpoint existe, si l'auth passe, le nom exact des champs.\n# Ensuite seulement vous demandez le script, avec cet extrait dans le prompt."}]}
 ]}
,{id:"02.5", t:"Batch, l'ancêtre", sub:"Le langage qu'on n'écrit plus, et qu'on trouve encore sur presque tous les parcs Windows", parts:[
  {h:"L'objectif", g:[
   {def:"On ne vous apprend pas à **écrire** du Batch. On vous apprend à **lire** le .bat que vous allez récupérer en arrivant en poste, à comprendre ce qu'il fait, et à décider quoi en faire."},
   {p:"Le vrai sujet, c'est PowerShell. Mais avant de le remplacer, il faut savoir lire ce qu'on remplace."}]},
  {h:"Un peu d'histoire", g:[
   {p:"1981, **MS-DOS**. Pas d'interface graphique, un interpréteur de commandes : COMMAND.COM. Un fichier **.bat** (pour batch, le traitement par lots) n'est rien d'autre qu'une liste de commandes que la machine exécute l'une après l'autre, sans vous."},
   {p:"Le plus célèbre : **AUTOEXEC.BAT**, exécuté à chaque démarrage du PC. C'est l'ancêtre direct de vos scripts de connexion."},
   {p:"Windows NT (1993) apporte **cmd.exe** et l'extension **.cmd**. Même langage, quelques différences de gestion du code retour. Aujourd'hui les deux tournent dans cmd.exe."}]},
  {h:"Pourquoi ça tourne encore en 2026", g:[
   {p:"Parce que personne n'ose y toucher. Vous en croiserez surtout ici :"},
   {kv:[
    ["Scripts de connexion","Distribués par GPO depuis le partage NETLOGON : mappage de lecteurs, imprimantes"],
    ["Tâches planifiées héritées","Une sauvegarde écrite en 2012 par un prestataire parti depuis"],
    ["Installeurs et outils métier","L'éditeur livre un install.bat, on le lance, on ne le lit pas"],
    ["Wrappers de lancement","Un raccourci qui pose deux variables puis démarre l'application"]]},
   {p:"Un script Batch en production, c'est du code sans auteur, sans doc et sans test. Il marche, donc il reste. Jusqu'au jour où il casse, et ce jour-là c'est vous."}]},
  {h:"Savoir le lire", g:[
   {p:"Voici le genre de fichier que vous trouverez vraiment dans C:\\scripts sur un serveur de fichiers :"},
   {code:"@echo off\nREM ============================================================\nREM sauvegarde-compta.bat\nREM Copie du partage Compta vers le NAS\nREM SI - 2012 - modifie par JM en 2019\nREM ============================================================\nset SOURCE=D:\\Partages\\Compta\nset LETTRE=S:\nset CIBLE=\\\\nas01\\sauvegardes\nset DOSSIER=%1\nif \"%DOSSIER%\"==\"\" set DOSSIER=quotidien\nif not exist \"%SOURCE%\" goto ERREUR_SOURCE"},
   {h:"L'en-tête et les variables", kv:[
    ["@echo off","N'affiche pas chaque commande avant de l'exécuter. Le @ masque la ligne elle-même"],
    ["REM","Un commentaire. La variante :: existe aussi, très répandue"],
    ["set NOM=valeur","Crée une variable. Pas d'espace autour du =, sinon l'espace fait partie du nom"],
    ["%SOURCE%","Lit la variable. Encadrée de % des deux côtés, contrairement au $VAR de Bash"],
    ["%1","Le premier argument passé au script. %2, %3… pour les suivants, %0 pour le nom du script"]]},
   {p:"La ligne **if \"%DOSSIER%\"==\"\" set DOSSIER=quotidien** est un grand classique : c'est une valeur par défaut. Si l'appelant n'a rien passé, on remplit soi-même."}]},
  {h:"Les tests et le flux", g:[
   {kv:[
    ["if not exist \"%SOURCE%\"","Teste la présence d'un fichier ou d'un dossier. C'est le seul garde-fou du script"],
    ["errorlevel","Le code retour de la commande précédente. 0 = succès, le reste = un problème"],
    ["if errorlevel 1","Se lit « si le code retour est supérieur ou égal à 1 », pas « égal à 1 »"],
    ["goto ERREUR_RESEAU","Saute à l'étiquette :ERREUR_RESEAU plus bas dans le fichier"],
    ["pause","Attend une touche. Présent parce que le script était lancé au double-clic, dans une fenêtre qui se referme"]]},
   {p:"Lu de haut en bas : je vérifie la source, je monte le lecteur réseau, je copie l'incrémental dans un log, je démonte. À chaque étape ratée, je saute au message d'erreur correspondant. Vous savez maintenant lire ce fichier : c'est la compétence visée, et elle suffit."}]},
  {h:"Les pièges quand on en hérite", g:[
   {steps:[
    ["Les espaces dans les chemins","C:\\Program Files\\ sans guillemets, et la commande reçoit deux arguments. D'où les \" partout"],
    ["%%i dans un fichier, %i en ligne de commande","La même boucle for s'écrit différemment selon l'endroit où on la tape. Un copier-coller depuis un forum casse ici"],
    ["Aucune gestion d'erreurs par défaut","Sans if errorlevel, un script continue joyeusement après un échec et se termine en annonçant « Sauvegarde terminee »"],
    ["L'encodage","cmd.exe travaille en page de codes OEM. Un fichier UTF-8 affiche « Sauvegarde termin├®e ». C'est pour ça que les vieux scripts sont écrits sans accents"],
    ["Le goto","Trois étiquettes, ça se suit. Quinze, et plus personne ne sait dans quel ordre le fichier s'exécute"]]}]},
  {h:"Le piège qui coûte le plus cher", g:[
   {code:"set COMPTEUR=0\nfor %%f in (*.log) do (\n    set /a COMPTEUR=%COMPTEUR% + 1\n    echo Fichier %%f, total %COMPTEUR%\n)"},
   {p:"Ce code affiche **total 0** à chaque tour, quel que soit le nombre de fichiers."},
   {def:"Dans un bloc entre parenthèses, tous les %VAR% sont remplacés **avant** que la boucle démarre. La variable change bien, l'affichage non. Il faut **setlocal enabledelayedexpansion** et écrire **!COMPTEUR!**."},
   {p:"Retenez surtout le symptôme : une variable modifiée dans une boucle Batch qui semble figée. Vous perdrez une heure dessus si vous ne l'avez jamais vu, deux minutes sinon."}]},
  {h:"Pourquoi on n'en écrit plus", g:[
   {table:{head:["","Batch","PowerShell"], rows:[
    ["Le pipeline transporte","Du texte","Des objets"],
    ["Récupérer une info","Découper une sortie d'écran","Lire une propriété"],
    ["Gestion d'erreurs","if errorlevel après chaque ligne","try / catch, -ErrorAction"],
    ["Active Directory, WMI","Via des outils externes","Cmdlets natives"],
    ["Réutilisation","Copier-coller","Fonctions, modules"]]}},
   {code:"sc query state= all | find \"STOPPED\"\nGet-Service | Where-Object Status -eq 'Stopped'"},
   {p:"La première ligne filtre un affichage et vous rend des lignes d'état sans le nom des services. La seconde vous rend de vrais objets service, qu'on peut trier, exporter ou redémarrer dans la foulée."},
   {p:"Rien de méprisant là-dedans : Batch a fait tourner des parcs entiers pendant vingt ans, avec zéro dépendance et sur toutes les versions de Windows. Il n'a simplement plus les outils du métier d'aujourd'hui."}]},
  {h:"Que faire quand on en hérite", g:[
   {steps:[
    ["Ne pas réécrire par principe","Un .bat de dix lignes qui mappe un lecteur depuis huit ans n'est pas une urgence. Réécrire, c'est réintroduire des bugs"],
    ["Le documenter d'abord","Trois lignes en tête du fichier : ce qu'il fait, qui l'appelle, ce qui casse s'il s'arrête. Souvent, personne ne le sait"],
    ["Réécrire en PowerShell dès qu'il faut y toucher sérieusement","Nouvelle fonctionnalité, changement de serveur, besoin de journalisation : c'est le moment, pas avant"],
    ["Traiter en priorité ce qui est dangereux","Un mot de passe en clair, un del /s /q sur une variable non testée, un script planifié en SYSTEM sans log"]]},
   {p:"Le mot de passe en clair dans un script de connexion distribué par GPO est un grand classique d'audit : le partage **NETLOGON** est lisible par tous les utilisateurs du domaine."},
   {p:"La suite : Batch décrit une suite de commandes, PowerShell manipule des objets. Vous savez désormais lire un .bat ; place à PowerShell."}]}
 ]}
