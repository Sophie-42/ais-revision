SA5:[
 {id:"02", t:"Un peu d'histoire", sub:"De Multics à Linux : Unix, BSD, GNU, philosophie Unix et POSIX", parts:[
  {h:"C'est quoi, Linux ?", g:[
   {def:"**Linux** = un noyau de système d'exploitation, créé au début des années 1990 par Linus Torvalds et encore en développement actif. Libre et open-source."},
   {p:"Pour avoir un système complet, on assemble ce noyau avec d'autres composants (essentiellement le projet GNU) : on parle alors de **GNU/Linux**."}]},
  {h:"Les précurseurs (années 50-60)", g:[
   {p:"Les premiers ordinateurs ne pouvaient être utilisés que par un opérateur à la fois (cartes perforées). Pas d'OS « moderne », pas d'interopérabilité entre machines."},
   {p:"**Multics** (MULTIplexed Information and Computing Service, 1964) : projet MIT + Bell Labs + General Electric. Apporte les concepts qui influenceront tous les OS modernes :"},
   {ul:["Système de fichiers hiérarchique","Temps partagé & multitâche préemptif","Multi-utilisateurs","Sécurité"]},
   {p:"Trop coûteux et complexe : Bell Labs quitte le projet en 1969. Honeywell le commercialise jusqu'en 1985, puis Bull jusqu'en 2000."}]},
  {h:"Unix & BSD", g:[
   {p:"Les anciens de Multics (Ken Thompson, Dennis Ritchie…) repartent en 1970 sur un projet plus modeste : Unics, vite renommé **Unix**. En 1972-73, Ritchie crée le langage C ; la v4 d'Unix est réécrite en C."},
   {table:{head:["Année","Étape"], rows:[
    ["1973","Unix v5 : première version commercialisée à des universités"],
    ["1975","Unix v6 : commercialisé aux entreprises. Ken Thompson l'installe à Berkeley"],
    ["1978","Première version de BSD (Berkeley Software Distribution)"]]}},
   {p:"Descendants encore utilisés : macOS (basé sur BSD), FreeBSD (pfSense), NetBSD/OpenBSD, Solaris, HP-UX, IBM AIX."}]},
  {h:"Philosophie Unix & POSIX", g:[
   {cols:[
    ["Philosophie Unix","","Un programme = une seule chose, bien faite · les programmes collaborent · tout passe par des flux de texte (interface universelle) · principe KISS : Keep It Simple, Stupid."],
    ["POSIX","","Famille de normes IEEE 1003 : standardise la ligne de commande, les utilitaires de base, les E/S, le réseau, les threads… C'est grâce à POSIX que les commandes diffèrent peu entre Unix, Linux, BSD et macOS."]]}]},
  {h:"Le projet GNU : GNU is Not Unix", g:[
   {p:"En 1980, Richard Stallman (rms) du MIT veut modifier le pilote d'une imprimante Xerox 9700 : refus de Xerox. Cette frustration le convainc de l'importance du logiciel libre."},
   {table:{head:["Année","Étape"], rows:[
    ["1983","Annonce du projet GNU : un OS compatible Unix mais libre"],
    ["1984","Première brique : GCC (GNU Compiler Collection)"],
    ["1985","Création de la Free Software Foundation (FSF)"],
    ["1989","Création de la licence GNU GPL (copyleft : les dérivés doivent rester libres)"]]}},
   {p:"Free = libre, pas gratuit : « free as in free speech, not free beer ». Briques GNU : GCC, glibc, coreutils, GDB, binutils, Bash. Il manquait juste un noyau (GNU Hurd, jamais terminé)."}]},
  {h:"Naissance de Linux (1991)", g:[
   {p:"Linus Torvalds, étudiant finlandais, achète un PC Intel 386 et trouve Minix (OS éducatif d'A. Tanenbaum) trop limité, et Unix trop cher. Il décide de créer son propre noyau : à l'inverse de Minix (micro-noyau), Linux est un **noyau monolithique**."},
   {table:{head:["Date","Étape"], rows:[
    ["25 août 1991","Linus annonce son projet sur le groupe Usenet comp.os.minix"],
    ["5 oct. 1991","Linux v0.02 : première version complète, embarque déjà bash et GCC"],
    ["1992","Linus publie Linux sous GPL → l'union GNU + Linux donne naissance à GNU/Linux"],
    ["1996","Tux (manchot dessiné par Larry Ewing) devient la mascotte officielle"]]}},
   {p:"Aujourd'hui : plus de 17 000 contributeurs, soutenu par Intel, IBM, Valve, Red Hat… Linus reste le « dictateur bienveillant » du projet."}]}
 ]},
 {id:"03", t:"Les distributions", sub:"Définition, grandes familles et ce qui les différencie", parts:[
  {h:"Qu'est-ce qu'une distribution ?", g:[
   {def:"**Distribution GNU/Linux** = un ensemble de logiciels (souvent libres) assemblés autour du noyau Linux pour former un OS pleinement opérationnel."},
   {p:"Linux seul n'est qu'un noyau : les distributions ajoutent les outils GNU, l'environnement de bureau, les applications, le gestionnaire de paquets… On distribue ces ensembles pré-sélectionnés pour éviter à l'utilisateur de tout choisir un par un."}]},
  {h:"Les grandes distributions historiques", g:[
   {kv:[["Juillet 1993","Slackware"],["Août 1993","Debian"],["1994","Red Hat"]]},
   {p:"Depuis, les licences libres permettant la redistribution avec modifications, on compte des centaines de distributions, souvent dérivées des précédentes."}]},
  {h:"Les grandes familles", g:[
   {p:"Ce qui différencie principalement les familles : le **gestionnaire de paquets**."},
   {cols:[
    ["Debian / Ubuntu","","apt / dpkg, format .deb. Dérivés : Mint, Kali, Pop!_OS…"],
    ["Red Hat / Fedora","","RPM, gestionnaire dnf (ex-yum). Dérivés : CentOS Stream, Rocky, AlmaLinux…"],
    ["Arch","","pacman. Dérivés : Manjaro, EndeavourOS…"]]},
   {p:"Les distributions se distinguent aussi par les programmes pré-installés (environnement de bureau, navigateur…) et par leur cycle de mise à jour."}]},
  {h:"La fragmentation, frein à l'adoption", g:[
   {p:"Selon Linus Torvalds, le grand nombre de distributions est le frein principal à l'adoption de Linux sur les ordinateurs de bureau (~3 % de parts de marché). En contrepartie, on peut installer presque n'importe quel logiciel sur presque n'importe quelle distribution : la différence majeure reste le gestionnaire de paquets."},
   {p:"Distributions « simples à prendre en main » : Ubuntu, Linux Mint. Plus exigeantes : Arch, Gentoo, Slackware."}]}
 ]},
 {id:"04", t:"Notions de base : la CLI", sub:"Survivre en ligne de commande : navigation, fichiers, redirections et éditeurs", parts:[
  {h:"CLI vs GUI", g:[
   {def:"**CLI** (Command Line Interface) = la ligne de commande. Sur un serveur Linux, vous n'aurez souvent pas le choix : pas de GUI installée."},
   {p:"La CLI est plus directe (deux caractères pour voir une IP : ip a), scriptable et documentée via man. Le prompt affiche déjà : qui vous êtes, où vous êtes connecté, dans quel dossier."}]},
  {h:"Se repérer & naviguer", g:[
   {code:"# Les 3 commandes de survie quand on arrive sur une machine\nwhoami        # qui suis-je ?\npwd           # où suis-je ?\nls            # qu'est-ce qu'il y a ici ?\n# Options utiles de ls\nls -a         # inclut les fichiers cachés (.*)\nls -l         # détails (taille, droits, propriétaire)\nls -h         # tailles lisibles (1.2M au lieu de 1234567)\nls -lah       # on combine tout\n# Naviguer\ncd /etc       # aller dans un dossier\ncd ..         # remonter d'un cran\ncd ~  ou  cd  # rentrer chez soi (/home/user)\ncd -          # revenir au dossier précédent"},
   {p:"Correction : ls -h seul ne sert à rien ; il modifie l'affichage des tailles, donc s'utilise avec -l (ls -lh)."}]},
  {h:"CRUD fichiers, lecture & recherche", g:[
   {code:"# Créer / copier / déplacer / supprimer\nmkdir dossier        # créer un dossier\ntouch fichier.txt    # créer un fichier vide\ncp src dest          # copier\nmv src dest          # déplacer ou renommer\nrm fichier           # supprimer (PAS de corbeille !)\nrm -r dossier        # récursivement\n# Lire un fichier\ncat fichier.txt      # tout d'un coup\nless fichier.txt     # page par page (q pour quitter)\nhead / tail fichier.txt   # 10 premières / dernières lignes\ntail -f /var/log/syslog   # suivre en temps réel\n# Trouver\nfind /etc -name \"*.conf\"   # par nom\ngrep \"erreur\" fichier.log  # dans un fichier\ngrep -r \"TODO\" .           # récursivement"},
   {p:"Attention : **rm** supprime définitivement et immédiatement. sudo rm -rf / efface tout le système : toujours vérifier deux fois."}]},
  {h:"Aide & raccourcis", g:[
   {h:"Trois réflexes pour s'aider", kv:[["ls --help","Mémo rapide"],["man ls","Manuel complet (q pour quitter)"],["tldr ls","Exemples concrets (à installer)"]]},
   {h:"Raccourcis qui sauvent", kv:[["!!","Relance la dernière commande"],["sudo !!","… en root (oubli classique)"],["Ctrl+R","Recherche dans l'historique"],["Tab","Autocomplétion"],["Ctrl+L","Nettoie l'écran"],["Ctrl+C","Interrompt"]]}]},
  {h:"Système de fichiers : tout est fichier", g:[
   {p:"Sous Linux, **tout est fichier** : disque (/dev/sda), clavier (/dev/input/event0), processus (/proc/[PID]), mémoire (/proc/meminfo). Conséquence : tous les outils texte fonctionnent partout."},
   {kv:[["Une configuration","/etc"],["Les logs","/var/log"],["Mon home","/home/<user>"],["Un exécutable","/usr/bin, /bin"],["Une clé USB montée","/media, /mnt"],["Un device","/dev"],["Infos système","/proc, /sys"],["Un fichier temporaire","/tmp"]]},
   {p:"Chemin **absolu** = commence par /. Chemin **relatif** = à partir du dossier courant (./, ../)."}]},
  {h:"Entrées / sorties & redirections", g:[
   {p:"Chaque programme a 3 flux : **stdin** (entrée), **stdout** (sortie), **stderr** (erreurs)."},
   {code:"ls /etc > liste.txt              # écrase liste.txt\nls /var >> liste.txt             # ajoute à la fin\nls /existe /nope 2> erreurs.log  # redirige stderr\nls /existe /nope &> tout.log     # stdout + stderr ensemble\n# Le pipe | : la sortie de l'un devient l'entrée de l'autre\nls | wc -l                                  # compter les fichiers\ncat /etc/passwd | grep \"/bin/bash\" | wc -l  # users en bash"},
   {p:"Le **pipe** est l'outil le plus important du shell : il met en pratique la philosophie Unix (programmes simples qui collaborent)."}]},
  {h:"Éditeurs de texte", g:[
   {cols:[
    ["vi / Vim","","Modal : les touches changent de sens selon le mode. Présent sur 99 % des systèmes."],
    ["Emacs","","Ultra-extensible (Emacs Lisp). « Très bon OS auquel manque un bon éditeur. »"],
    ["nano","","Simple, raccourcis affichés en bas. Choix conseillé au quotidien."]]},
   {h:"Survival kit Vim", kv:[["i","Passer en mode insertion"],["Esc","Revenir en mode normal"],[":w","Sauvegarder"],[":q","Quitter"],[":wq","Sauvegarder ET quitter"],[":q!","Quitter sans sauvegarder"]]},
   {p:"Coincé dans Vim ? Esc puis :q! + Entrée. Tuto officiel : vimtutor."}]}
 ]},
 {id:"05", t:"Composants d'un système GNU/Linux", sub:"Boot, systemd, paquets, pile graphique X11/Wayland, modules noyau et réseau", parts:[
  {h:"Chronologie du boot", g:[
   {steps:[["Bouton power",""],["BIOS / UEFI","Firmware de la carte mère"],["Chargeur d'amorçage","GRUB…"],["Noyau Linux","Kernel"],["init / systemd","PID 1, démarre tout le reste"],["Display Manager","Formulaire de login graphique"],["Session utilisateur",""]]},
   {p:"BIOS (1981, ≤ 2 To, MBR) vs UEFI (2005, GPT, Secure Boot) : en 2026, la quasi-totalité des PC modernes utilise UEFI. Bootloaders : GRUB 2 (le plus utilisé), systemd-boot, rEFInd."}]},
  {h:"init & systemd", g:[
   {def:"**init** = le 1er processus utilisateur lancé par le noyau (PID 1). C'est lui qui démarre tous les services (réseau, audio, SSH…). **systemd** (Lennart Poettering, 2010) est le standard de fait : il a remplacé SysV init sur Debian, Ubuntu, Fedora, Arch, openSUSE…"},
   {p:"Controverse : systemd « fait tout » (logs, montage, réseau, timers…), à l'opposé de la philosophie Unix. Forks par opposition : Devuan (Debian sans systemd), Artix."},
   {code:"systemctl status ssh             # état d'un service\nsystemctl start / stop ssh       # démarrer / arrêter\nsystemctl restart ssh            # redémarrer\nsystemctl enable / disable ssh   # auto-démarrage au boot\njournalctl -u ssh                # logs d'un service\njournalctl -b                    # logs du dernier boot"}]},
  {h:"Gestion des paquets", g:[
   {p:"Une **dépendance** = un composant logiciel nécessaire à un programme. Le gestionnaire de paquets installe et met à jour tout l'ensemble en une seule commande."},
   {table:{head:["Famille","Format","Gestionnaire haut niveau"], rows:[
    ["Debian / Ubuntu",".deb (dpkg)","apt"],["Red Hat / Fedora",".rpm (rpm)","dnf (ex-yum)"],["Arch",".pkg.tar.zst","pacman"],["Alpine",".apk","apk"]]}},
   {code:"sudo apt update                 # rafraîchir la liste\nsudo apt upgrade                # mettre à jour\nsudo apt install / remove nano  # installer / désinstaller\napt search nano                 # chercher\napt list --installed            # liste installée"},
   {p:"Formats universels (multi-distrib) : Flatpak (Flathub), Snap (Canonical, forcé sur Ubuntu), AppImage (portable, comme un .exe)."}]},
  {h:"La pile graphique", g:[
   {steps:[["Vous","Clavier / souris"],["Application","Firefox, GIMP, VS Code…"],["Bibliothèque GUI","GTK / Qt"],["Protocole d'affichage","X11 / Wayland"],["Serveur / Compositor","X.Org / Mutter / KWin"],["Pilote graphique & GPU",""],["Sortie",""]]},
   {table:{head:["","X11 (X.Org)","Wayland"], rows:[
    ["Date","1987 (X11), X.Org en 2004","2008"],
    ["Sécurité","Faible (apps voient tout)","Forte (apps isolées)"],
    ["Compositor","X.Org centralisé","Par DE : Mutter (GNOME), KWin (KDE), Sway"],
    ["Adoption 2026","Legacy","Défaut sur GNOME / KDE"]]}},
   {p:"Voir lequel j'utilise : **echo $XDG_SESSION_TYPE**. Display Manager (login graphique) : GDM, SDDM, LightDM, optionnel (pas sur un serveur)."}]},
  {h:"WM vs DE, GTK vs Qt", g:[
   {cols:[
    ["WM seul","Window Manager","Gère uniquement les fenêtres (placement, redimensionnement, focus). Pas de barre des tâches, pas de menu. Pour power-users : i3, Sway, dwm, Hyprland."],
    ["Desktop Environment (DE)","","Tout-en-un : WM + barre des tâches + explorateur + paramètres + apps de base + thème. GNOME, KDE Plasma, XFCE, Cinnamon, MATE."]]},
   {p:"Bibliothèques GUI : **GTK** (GNOME, XFCE, Cinnamon ; Firefox, LibreOffice, GIMP) vs **Qt** (KDE ; VLC, OBS, Krita). Une app GTK marche dans KDE et inversement, mais le thème détonne souvent."}]},
  {h:"Matériel, réseau, audio", g:[
   {h:"Pilotes = modules du noyau", code:"lsmod                       # modules chargés\nlspci / lsusb               # cartes PCI / périphériques USB\ndmesg | tail                # logs noyau récents\nsudo modprobe / rmmod foo   # charger / décharger un module"},
   {cols:[
    ["Réseau","","Desktop : NetworkManager (nmcli, nmtui). Serveur : netplan (Ubuntu), /etc/network/interfaces (Debian legacy), systemd-networkd."],
    ["Audio","","Pile en couches : ALSA (1998, bas niveau) → PulseAudio (années 2000) → PipeWire (2017, défaut en 2026, gère audio + vidéo, nécessaire au partage d'écran sous Wayland)."]]},
   {code:"nmcli device\nnmcli device wifi connect MonSSID password XXX\npactl info     # qui gère mon audio ?\nwpctl status   # vue PipeWire"}]},
  {h:"Récap : ce qui distingue les distributions", g:[
   {table:{head:["Composant","Ubuntu","Fedora","Arch"], rows:[
    ["Init","systemd","systemd","systemd"],
    ["Paquets","apt / .deb","dnf / .rpm","pacman"],
    ["Bootloader","GRUB","GRUB","GRUB (défaut)"],
    ["Serveur graphique","Wayland","Wayland","Au choix"],
    ["DE par défaut","GNOME","GNOME","Aucun (à toi de jouer)"],
    ["Audio","PipeWire","PipeWire","PipeWire"],
    ["Philosophie","Stable, user-friendly","Bleeding edge","DIY total"]]}},
   {p:"Mêmes ingrédients, recettes différentes : c'est le choix des composants et la config par défaut qui font la différence."}]}
 ]}
,{id:"06", t:"Utilisateurs, groupes & permissions", sub:"Comptes, /etc/passwd & shadow, chmod / chown et sudo", parts:[
  {h:"Un compte utilisateur", g:[
   {def:"Un **compte utilisateur** = une identité sur la machine, avec un UID (numéro), un GID primaire, un home, un shell et ses propres permissions. Le système raisonne toujours sur des UID/GID : le nom n'est qu'une étiquette."},
   {table:{head:["Fichier","Contenu","Lisible par"], rows:[
    ["/etc/passwd","Infos publiques des comptes","Tout le monde"],
    ["/etc/shadow","Mots de passe hachés","root seul"],
    ["/etc/group","Groupes et leurs membres","Tout le monde"]]}},
   {code:"# Anatomie d'une ligne /etc/passwd\nalice:x:1000:1000:Alice Martin:/home/alice:/bin/bash\n nom  x UID  GID   commentaire    home      shell\n# Les plages d'UID/GID\n0             # root (toujours)\n1 → 999       # comptes système (www-data, sshd, systemd-…)\n1000 → 60000  # humains\n65534         # nobody (sans droits)"},
   {p:"Les comptes système ont souvent /usr/sbin/nologin comme shell : ils ne sont pas faits pour se connecter."}]},
  {h:"Créer, modifier, supprimer un utilisateur", g:[
   {code:"# Créer avec home + shell + commentaire\nsudo useradd -m -s /bin/bash -c \"Alice Martin\" alice\nsudo passwd alice                    # définir le mot de passe\n# Modifier\nsudo usermod -s /bin/zsh alice       # changer le shell\nsudo usermod -aG sudo,projet-x alice # -aG : AJOUTE aux secondaires\nsudo usermod -L / -U alice           # verrouiller / déverrouiller\n# Supprimer\nsudo userdel alice                   # le compte seulement\nsudo userdel -r alice                # + home + boîte mail"},
   {p:"Bob quitte l'entreprise ? Toujours en 2 temps : (1) le matin du départ, **sudo usermod -L bob** (verrouiller). (2) Quelques semaines plus tard, une fois les fichiers archivés : **sudo userdel -r bob**. Jamais de suppression directe le jour J."},
   {p:"Piège **usermod -G** : sans -a, on écrase tous les groupes secondaires. Le -a est critique."}]},
  {h:"Groupes", g:[
   {p:"Un **groupe** = étiquette collée à plusieurs comptes. On donne les droits à un groupe, puis on ajoute/retire des users dans ce groupe."},
   {code:"sudo groupadd projet-x                  # créer\nsudo groupdel projet-x                  # supprimer\nsudo usermod -aG projet-x alice         # ajouter alice\nsudo gpasswd --delete alice projet-x    # retirer alice\ngroups alice                            # lister ses groupes\nid alice                                # UID/GID/groupes détaillés"},
   {p:"Piège classique : après ajout à un groupe, l'utilisateur doit se **déconnecter/reconnecter** pour que les droits prennent effet."}]},
  {h:"Permissions Unix", g:[
   {p:"Chaque fichier a un propriétaire et un groupe propriétaire. Trois catégories : **u** (user), **g** (group), **o** (others). Trois droits par catégorie : **r** (lecture), **w** (écriture), **x** (exécution)."},
   {code:"-rw-r--r-- 1 alice projet-x 4200 Jan 5 rapport.txt\n│└┬┘└┬┘└┬┘\n│ │  │  └── others : r-- (lecture seule)\n│ │  └───── group  : r-- (lecture seule)\n│ └──────── user   : rw- (lecture + écriture)\n└────────── type   : - fichier, d dossier, l lien"},
   {table:{head:["Bit","Sur un fichier","Sur un dossier"], rows:[
    ["r","Lire","Lister (ls)"],["w","Modifier","Créer / supprimer des entrées"],["x","Exécuter","Traverser (cd)"]]}},
   {p:"Sans x sur un dossier, même avec r, on ne peut ni entrer ni accéder au contenu."},
   {h:"Octal à connaître par cœur", table:{head:["Octal","Bits","Usage"], rows:[
    ["644","rw-r--r--","Fichier « normal »"],["755","rwxr-xr-x","Script / exécutable"],["700","rwx------","Perso strict (clé SSH privée)"],["600","rw-------","Secrets (.env)"],["770","rwxrwx---","Dossier partagé équipe"]]}},
   {p:"Mémo : r = 4, w = 2, x = 1 (on additionne)."},
   {code:"# chown : propriétaire et/ou groupe\nsudo chown alice:projet-x rapport.txt\nsudo chown -R www-data:www-data /var/www\n# chmod : symbolique ou octal\nchmod u+x script.sh             # ajouter x au user\nchmod a+r public.txt            # ajouter r à tous (a = all)\nchmod 770 /partages/projet-x    # équipe : rwx, others rien"}]},
  {h:"Élévation de privilèges : sudo", g:[
   {def:"**Principe du moindre privilège** : on est user normal au quotidien ; on « passe root » ponctuellement, de façon tracée, via sudo. Le groupe qui donne sudo : **sudo** (Debian/Ubuntu) ou **wheel** (Red Hat/Fedora)."},
   {code:"# Anatomie d'une règle sudoers\nbob  ALL = (root) /usr/bin/systemctl restart nginx\n│    │     │      └─ quelle commande (chemin absolu)\n│    │     └──────── en tant que qui\n│    └────────────── depuis quelle machine\n└─────────────────── qui (user ou %groupe)\n# NOPASSWD : sans mot de passe (à manier avec parcimonie)\nbob ALL=(root) NOPASSWD: /usr/bin/systemctl restart nginx"},
   {p:"Ne JAMAIS éditer /etc/sudoers directement. Toujours **sudo visudo** : pose un verrou, ouvre l'éditeur, vérifie la syntaxe avant sauvegarde. Une erreur de syntaxe + perte du sudo = récupération depuis un live USB."},
   {p:"Mieux : un fichier par règle dans **/etc/sudoers.d/** : modulaire, versionnable en Git."},
   {code:"sudo visudo -f /etc/sudoers.d/nginx-bob   # créer une règle isolée\nsudo -l                                   # voir ses propres droits sudo\nsudo journalctl -t sudo -f                # suivre les logs sudo"}]}
 ]},
 {id:"08", t:"Périphériques & hardware", sub:"Diagnostiquer un système : processus, mémoire, disques, matériel, modules noyau et /dev", parts:[
  {h:"Charge système : qui consomme ?", g:[
   {code:"# Vue d'ensemble en temps réel\ntop        # toujours dispo. P = trier par CPU · M = par mémoire\n           # k + PID = tuer · q = quitter\nhtop       # version moderne (à installer)\n# Mémoire\nfree -h    # regarder AVAILABLE (used inclut le cache !)\n# Espace disque\ndf -h              # par filesystem\ndu -sh /var/log/*  # descendre dans un dossier\nlsblk              # arbre des disques et partitions"},
   {p:"Piège du **free** : la colonne used inclut le cache (Linux se sert de toute la RAM disponible pour accélérer les accès disque). La vraie valeur à regarder : **available**."},
   {p:"Réflexe disque plein : df -h → identifier le filesystem plein → sudo du -sh /chemin/* → descendre."}]},
  {h:"Processus & signaux", g:[
   {code:"# Lister\nps aux          # tous les processus (format BSD)\nps -u alice     # ceux d'un utilisateur\npgrep nginx     # juste les PIDs\npgrep -a nginx  # PIDs + commande complète\n# Tuer\nkill 1234       # TERM (poli, cleanup possible)\nkill -9 1234    # KILL (dernier recours, pas de cleanup)\nkill -HUP 1234  # rechargement de config\npkill nginx     # par nom\nkillall firefox # par nom, tous les processus\n# Priorité (-20 = max, 0 défaut, +19 = min)\nnice -n 10 ./script     # lancer avec priorité basse\nrenice -n 5 -p 1234     # changer une priorité en cours"},
   {table:{head:["Signal","Numéro","Effet"], rows:[
    ["TERM","15","Arrêt poli : cleanup possible"],["KILL","9","Force brute : pas de cleanup, dernier recours"],["HUP","1","Rechargement de config (souvent)"],["INT","2","Interruption (équivalent Ctrl+C)"],["STOP / CONT","19 / 18","Pause / reprise du processus"]]}},
   {p:"Réflexe pro : toujours **kill** (TERM) avant **kill -9**. Sinon des fichiers temporaires peuvent rester pendus."}]},
  {h:"Inventaire du matériel", g:[
   {code:"# dmesg : les logs du noyau (device messages), LA source de vérité\ndmesg | tail -30   # derniers messages\ndmesg -w           # suivre en direct (utile en branchant une USB)\n# Périphériques PCI internes (réseau, GPU, SATA/NVMe, son…)\nlspci              # vue compacte\nlspci -k           # quel pilote (module) utilise quel périph\nlspci -nn          # avec IDs vendor/produit\n# Périphériques USB\nlsusb              # vue compacte\nlsusb -t           # arbre + vitesse par port (USB 2/3)\n# Disques & partitions\nlsblk              # arbre disques ↔ partitions ↔ points de montage\nsudo fdisk -l      # tables de partitions\nblkid              # UUIDs et types de filesystem"},
   {p:"Cas « Le Wi-Fi ne marche pas » : **lspci -k | grep -A 3 -i network** → identifier la carte et le pilote (ou son absence)."}]},
  {h:"Modules noyau", g:[
   {p:"Depuis 1995, les pilotes sont chargés dynamiquement sous forme de **modules** (.ko), stockés dans /lib/modules/$(uname -r)/. Chaque sous-dossier = une famille : net/, usb/, gpu/…"},
   {code:"lsmod                 # modules chargés (Size, Used by)\nmodinfo virtio_net    # licence, deps, params d'un module\nsudo modprobe loop    # charger + résoudre les deps\nsudo modprobe -r loop # décharger"},
   {table:{head:["","modprobe","insmod"], rows:[
    ["Cherche dans /lib/modules/","Oui","Non"],["Gère les dépendances","Oui","Non"],["Prend","Un nom court (loop)","Le chemin complet du .ko"],["Quand l'utiliser","Tout le temps","Dev kernel, modules custom"]]}}]},
  {h:"/dev : tout est fichier", g:[
   {p:"**/dev** n'est pas un vrai dossier : c'est un filesystem virtuel peuplé dynamiquement par devtmpfs (au boot) et udev (à chaque branchement/débranchement)."},
   {kv:[
    ["/dev/null","Trou noir : tout ce qu'on écrit disparaît. Jeter une sortie"],
    ["/dev/zero","Source infinie de zéros. Créer un fichier vide"],
    ["/dev/random","Aléatoire cryptographique (bloquant si entropie faible)"],
    ["/dev/urandom","Aléatoire non bloquant, plus rapide"],
    ["/dev/full","Disque plein simulé (pour tester un script)"]]},
   {p:"Correction : /dev/random ne bloque plus en pratique depuis le noyau 5.6 (2020) : il ne bloque qu'au tout début du démarrage."},
   {p:"Types dans ls -l /dev : **b** block (disque/partition), **c** character (terminal, /dev/null), **-** classique."},
   {code:"# Créer un disque à partir d'un simple fichier (« tout est fichier »)\nsudo dd if=/dev/zero of=/tmp/disk.img bs=1M count=10  # fichier 10 Mo\nsudo losetup -fP /tmp/disk.img     # attacher\nls /dev/loop*                      # apparaît\nsudo mkfs.ext4 /dev/loop0          # formater\nsudo mount /dev/loop0 /mnt/loop    # monter"}]},
  {h:"Récap : la trousse de diagnostic", g:[
   {kv:[
    ["La machine est lente","top/htop, free -h, df -h"],
    ["Un processus zombie","ps, pgrep, kill, kill -9"],
    ["Un périphérique branché ne marche pas","dmesg -w, lspci, lsusb"],
    ["Un disque n'apparaît pas","lsblk, dmesg, blkid"],
    ["Un module manque","modprobe, modinfo, lsmod"]]},
   {p:"Correction : un processus zombie est déjà terminé : kill -9 n'a aucun effet sur lui. Il disparaît quand son parent le récupère, ou quand on arrête ce parent."}]}
 ]}
,{id:"09", t:"Gestionnaires de paquets", sub:"apt au quotidien : install, dépannage, comparaison dnf / pacman", parts:[
  {h:"Qu'est-ce qu'un paquet ?", g:[
   {def:"Un **paquet** (.deb, .rpm…) est une archive compressée contenant : les binaires, la configuration, la documentation, les métadonnées (nom, version, dépendances) et des scripts d'installation (preinst, postinst…). L'installation, c'est copier les fichiers aux bons endroits + jouer les scripts."},
   {code:"# Disséquer un .deb sans l'installer\napt download nano                  # télécharge le .deb\ndpkg-deb -c nano_*.deb             # lister le contenu\ndpkg-deb -I nano_*.deb             # voir les métadonnées\ndpkg-deb -x nano_*.deb nano-ext/   # extraire sans installer"}]},
  {h:"Dépôts & signatures GPG", g:[
   {p:"Les paquets viennent de **dépôts** (serveurs qui hébergent des milliers de paquets signés)."},
   {kv:[
    ["Debian / Ubuntu","/etc/apt/sources.list, /etc/apt/sources.list.d/*.list"],
    ["Red Hat / Fedora","/etc/yum.repos.d/*.repo"],
    ["Arch","/etc/pacman.conf, /etc/pacman.d/mirrorlist"]]},
   {p:"Chaque dépôt est signé avec une **clé GPG**. apt update vérifie la signature avant de faire confiance à la liste. Dépôt non signé → refus (protection contre les paquets vérolés). Clés dans /etc/apt/trusted.gpg.d/ (officiels) et /etc/apt/keyrings/ (tiers)."}]},
  {h:"Le quotidien apt (Debian/Ubuntu)", g:[
   {code:"# État des lieux à l'arrivée sur une machine\nsudo apt update                  # rafraîchir la liste\napt list --upgradable            # quoi est en retard ?\napt list --installed | wc -l     # nb de paquets installés\n# Maintenance\nsudo apt upgrade                 # mise à jour standard\nsudo apt full-upgrade            # upgrade de version (24.04 → 26.04)\nsudo apt autoremove              # retire les dépendances orphelines\nsudo apt clean                   # vide /var/cache/apt/archives\n# Recherche et inspection\napt search docker                # chercher\napt show openssh-server          # détails complets\napt-cache depends nginx          # dépendances\napt-cache rdepends openssh-server  # qui dépend de X ?\n# Historique (qui a installé quoi, quand)\nless /var/log/apt/history.log\napt-mark showmanual              # installés à la main (pas en dep)"},
   {h:"Quel paquet possède ce fichier ?", code:"which htop                 # → /usr/bin/htop\ndpkg -S /usr/bin/htop      # → htop: /usr/bin/htop\ndpkg -L htop               # tous les fichiers du paquet\n# Le paquet n'est pas installé, mais je connais un fichier :\nsudo apt install apt-file\nsudo apt-file update\napt-file search nginx.conf # quel paquet fournit ce fichier ?"}]},
  {h:"Dépannage & verrouillage de version", g:[
   {code:"# « Could not get lock /var/lib/dpkg/lock-frontend »\nps aux | grep -E 'apt|dpkg'            # qui tourne ?\nsudo lsof /var/lib/dpkg/lock-frontend  # qui a le verrou ?\n# NE PAS supprimer le fichier de verrou à la main.\n# Dépendances cassées / install interrompue\nsudo apt --fix-broken install   # réparation auto\nsudo dpkg --configure -a        # finalise les installs en attente\nsudo apt update && sudo apt upgrade\n# Geler / dégeler la version d'un paquet\nsudo apt-mark hold nginx    # bloquer les mises à jour\napt-mark showhold           # voir les paquets gelés\nsudo apt-mark unhold nginx  # débloquer"}]},
  {h:"Comparaison apt / dnf / pacman", g:[
   {table:{head:["Action","apt (Debian)","dnf (Fedora)","pacman (Arch)"], rows:[
    ["Rafraîchir","apt update","dnf check-update","pacman -Sy"],
    ["Tout mettre à jour","apt upgrade","dnf upgrade","pacman -Syu"],
    ["Installer","apt install X","dnf install X","pacman -S X"],
    ["Désinstaller","apt remove X","dnf remove X","pacman -R X"],
    ["Chercher","apt search X","dnf search X","pacman -Ss X"],
    ["Infos paquet","apt show X","dnf info X","pacman -Si X"],
    ["Fichiers d'un paquet","dpkg -L X","rpm -ql X","pacman -Ql X"],
    ["Propriétaire d'un fichier","dpkg -S /path","rpm -qf /path","pacman -Qo /path"]]}},
   {p:"**Arch** : toujours pacman -Syu (jamais -Sy sans u) : sur une rolling release, faire l'un sans l'autre casse le système."},
   {p:"**Fedora** : dnf groupinstall \"Development Tools\" installe un ensemble en une commande."},
   {p:"Dépôts non officiels à manier avec prudence : PPA (Ubuntu), EPEL (Fedora/RHEL), AUR (Arch, via un helper comme yay)."}]}
 ]},
 {id:"10", t:"Compiler des programmes", sub:"Pipeline de compilation, ./configure && make && make install et checkinstall", parts:[
  {h:"Pourquoi (et pourquoi pas) compiler", g:[
   {cols:[
    ["Compiler a du sens quand…","","Le paquet n'existe pas dans les dépôts · la version en dépôt est trop ancienne · vous voulez activer une option non compilée par défaut · vous patchez le code pour corriger un bug · vous portez sur une architecture exotique (ARM, RISC-V…)."],
    ["…mais vous perdez","","La résolution automatique des dépendances · les mises à jour auto (apt upgrade ne touchera pas) · la désinstallation propre · le suivi de sécurité par la distribution."]]},
   {def:"**Règle d'or** : toujours préférer le paquet officiel s'il existe. Compiler est un dernier recours (ou un choix conscient justifié)."}]},
  {h:"Le pipeline de compilation", g:[
   {steps:[["Code source (.c)",""],["Préprocesseur","#include, #define…"],["Compilateur (gcc)",".c → .o (code objet)"],["Linker (ld)",".o + bibliothèques → binaire exécutable"]]},
   {p:"Sur un gros projet : des milliers de .c passent par ce pipeline → on orchestre avec **make**."}]},
  {h:"Installer les outils de build", g:[
   {kv:[
    ["Debian / Ubuntu","sudo apt install build-essential"],
    ["Red Hat / Fedora","sudo dnf groupinstall \"Development Tools\""],
    ["Arch","sudo pacman -S base-devel"]]},
   {p:"build-essential installe gcc (C), g++ (C++), make et libc6-dev (headers de la libc)."},
   {p:"**Le piège des headers** : sur Linux, un paquet est souvent scindé en deux : libssl3 (la bibliothèque compilée .so) et libssl-dev (les headers .h pour compiler contre). Pour compiler nginx : sudo apt install libssl-dev libpcre3-dev zlib1g-dev."}]},
  {h:"Le workflow classique en 4 étapes", g:[
   {code:"# 1) Récupérer les sources\nwget https://.../htop-3.3.0.tar.xz\ntar xf htop-3.3.0.tar.xz && cd htop-3.3.0\n# ou : git clone https://github.com/htop-dev/htop.git\n# 2) Préparer le build (détection système + génération du Makefile)\n./configure --prefix=/usr/local\n# 3) Compiler (parallèle sur tous les cœurs)\nmake -j$(nproc)\n# 4) Installer (au lieu de make install : voir plus bas)\nsudo make install"},
   {p:"**--prefix=/usr/local** : c'est le standard ; on n'écrase pas les paquets système installés dans /usr/."},
   {code:"# Quand ./configure se plaint d'un header manquant\nchecking for ncurses... not found\nconfigure: error: missing ncurses headers\n# → chercher quel paquet fournit le header, puis retry\napt-file search ncurses.h\nsudo apt install libncursesw5-dev\n./configure --prefix=/usr/local\nmake -j$(nproc)"},
   {p:"Options ./configure utiles : --help (liste tout), --enable-feature, --disable-feature."}]},
  {h:"Désinstaller proprement : checkinstall", g:[
   {p:"Le point faible de la compilation manuelle : **make install** ne laisse aucune trace exploitable pour désinstaller. Trois options :"},
   {table:{head:["Méthode","Avantages","Inconvénients"], rows:[
    ["sudo make uninstall","Si fourni par le projet","Pas toujours dispo"],
    ["Suppression manuelle","Marche toujours","Fastidieux, risque d'oubli"],
    ["checkinstall","Crée un vrai .deb, géré par apt","Pas toujours fiable"]]}},
   {code:"sudo apt install checkinstall\n# À la place de « sudo make install » :\nsudo checkinstall\n# Résultat : un vrai .deb, listé et désinstallable comme un paquet\napt list --installed | grep htop\nsudo apt remove htop"}]},
  {h:"Bonnes pratiques", g:[
   {cols:[
    ["À faire","","Snapshot (Proxmox, VM…) avant une grosse compilation · noter ses options ./configure (utile lors d'une recompilation) · make clean entre deux tentatives · préférer checkinstall à make install brut."],
    ["À éviter","","Compiler en root direct (sudo juste pour l'install) · installer dans /usr/ (réservé aux paquets de la distribution) · oublier de documenter ses manipulations."]]}]}
 ]},
 {id:"11", t:"Journaux du système", sub:"journald & rsyslog, journalctl, /var/log/, rotation logrotate et persistance", parts:[
  {h:"Deux systèmes de journalisation", g:[
   {code:"Services & processus (nginx, ssh, votre app…)\n            ↓\n┌──────────────────────┐\n│ systemd-journald     │ ← binaire, structuré, indexé\n│ /var/log/journal/    │\n└──────────────────────┘\n            ↓ (forward optionnel)\n┌──────────────────────┐\n│ rsyslog              │ ← historique, texte plat\n│ /var/log/*.log       │\n└──────────────────────┘"},
   {table:{head:["","journald","rsyslog (texte)"], rows:[
    ["Format","Binaire structuré","Texte plat"],
    ["Filtrage","Riche (par champ : _UID, _PID, unité)","grep à la main"],
    ["Perf","Indexé, rapide","Lent sur gros fichiers"],
    ["Lecture directe","Non (journalctl)","Oui (cat, less)"]]}},
   {p:"En pratique : journald pour les services modernes ; /var/log/*.log pour la compatibilité et certaines apps (Apache, nginx) qui écrivent en direct."}]},
  {h:"La tournée de /var/log/", g:[
   {kv:[
    ["syslog (Debian) / messages (RHEL)","Logs généraux du système"],
    ["auth.log (Debian) / secure (RHEL)","Authentifications (SSH, sudo…)"],
    ["kern.log","Logs noyau (Debian)"],
    ["dmesg","Logs du démarrage"],
    ["apt/history.log","Historique des installs/upgrades"],
    ["nginx/, apache2/","Logs des services web"],
    ["fail2ban.log","Tentatives bloquées"]]},
   {p:"La plupart appartiennent à root (logique : infos sensibles) → nécessitent sudo."}]},
  {h:"journalctl : le couteau suisse", g:[
   {code:"sudo journalctl -xe            # PREMIER RÉFLEXE (fin + explications)\n# Filtrer par service (unité systemd)\nsudo journalctl -u ssh         # tout l'historique\nsudo journalctl -u ssh -n 50   # 50 dernières lignes\nsudo journalctl -u ssh -f      # SUIVRE en temps réel\nsudo journalctl -u ssh --since today\n# Filtrer par temps\njournalctl --since \"10 min ago\"\njournalctl --since \"2026-06-10 14:00\" --until \"today 09:00\"\n# Par gravité (0=emerg, 3=err, 4=warning, 6=info, 7=debug)\njournalctl -p err              # erreurs et pire\njournalctl -p warning..err     # une fourchette\n# Logs du boot\njournalctl -b                  # boot courant\njournalctl -b -1               # boot précédent\njournalctl --list-boots\n# Logs noyau (équivalent moderne de dmesg)\njournalctl -k\n# Filtres par champ structuré\njournalctl _UID=1000\njournalctl _COMM=nginx\njournalctl _SYSTEMD_UNIT=ssh.service"},
   {kv:[
    ["« Que se passe-t-il maintenant ? »","journalctl -xe"],
    ["« Ce service plante »","journalctl -u <service> -n 100"],
    ["« Je veux voir en direct »","journalctl -fu <service>"],
    ["« Erreurs seulement »","journalctl -p err"],
    ["« La machine a redémarré »","journalctl -b -1 -p err"]]}]},
  {h:"Fichiers texte : tail, grep, less", g:[
   {code:"sudo tail -f /var/log/nginx/access.log  # suivre en direct\nsudo tail -F /var/log/auth.log          # -F gère la rotation\nsudo grep \"Failed password\" /var/log/auth.log\nsudo grep -i \"error\" /var/log/syslog | tail -20\nsudo less /var/log/syslog   # / cherche, n/N suivant/précédent"},
   {p:"**less** est sous-estimé : il navigue, cherche, défile. Bien plus pratique que cat sur un gros fichier."}]},
  {h:"Rotation des logs texte : logrotate", g:[
   {p:"**logrotate** tourne tous les jours (timer systemd) : il renomme (syslog → syslog.1…), compresse (.gz), supprime les plus anciens selon la rétention. Config globale dans /etc/logrotate.conf, config par service dans /etc/logrotate.d/."},
   {code:"# Exemple : /etc/logrotate.d/nginx\n/var/log/nginx/*.log {\n    daily           # rotation quotidienne\n    rotate 14       # garder 14 archives\n    compress        # gzip les anciens\n    delaycompress   # pas de gzip sur le plus récent\n    missingok       # OK si le fichier n'existe pas\n    notifempty      # pas de rotation si vide\n    create 0640 www-data adm   # droits du nouveau fichier\n    postrotate\n        systemctl reload nginx > /dev/null 2>&1 || true\n    endscript\n}"}]},
  {h:"Limites & persistance de journald", g:[
   {code:"# Ce qu'occupe le journal\nsudo journalctl --disk-usage\n# Configurer les limites : /etc/systemd/journald.conf\n[Journal]\nSystemMaxUse=500M     # disque persistant max\nSystemKeepFree=2G     # toujours garder 2G libres sur /var\nRuntimeMaxUse=100M    # /run (RAM) max\nMaxFileSec=1month\nMaxRetentionSec=3month\nsudo systemctl restart systemd-journald\n# Purge manuelle (immédiate, sans confirmation)\nsudo journalctl --vacuum-size=200M  # garder max 200 Mo\nsudo journalctl --vacuum-time=7d    # garder 7 derniers jours\nsudo journalctl --vacuum-files=10   # garder 10 fichiers"},
   {cols:[
    ["Volatile","/run/log/journal/ (RAM)","Tout perdu au reboot. OK pour live USB / container."],
    ["Persistent","/var/log/journal/ (disque)","Préservé au reboot. Toujours sur serveur : créer le dossier + redémarrer journald."]]},
   {p:"Réflexe surveillance : **df -h /var/log** doit faire partie du check de routine. Souvent un service qui râle = /var/log plein."}]}
 ]}

SB1:[
 {id:"01", t:"Découverte de la virtualisation", sub:"Principes, hyperviseurs T1/T2, avantages/inconvénients et types de virtualisation", parts:[
  {h:"Qu'est-ce que la virtualisation ?", g:[
   {def:"**Virtualisation** = créer des versions virtuelles de ressources informatiques (serveurs, postes, OS, applications) sur un seul matériel physique. Chaque instance croit disposer de son propre matériel dédié."},
   {p:"Résultat : meilleure utilisation du matériel, réduction des coûts, flexibilité accrue : pilier de l'ère cloud."},
   {p:"Historique : racines dès les années 1960 (partage de temps). 1972 : IBM VM/370 fait tourner plusieurs OS sur une machine. Années 1990 : VMware Workstation, Microsoft Virtual PC. Années 2000 : essor massif, puis le cloud computing dans la foulée."}]},
  {h:"Le principe : l'hyperviseur", g:[
   {def:"L'**hyperviseur** (ou moniteur de machine virtuelle) est le logiciel qui crée la couche d'abstraction. Il isole les OS virtuels entre eux, alloue les ressources (CPU, RAM, stockage) et gère la communication avec le matériel."},
   {cols:[
    ["Type 1","bare-metal","S'exécute directement sur le matériel. Meilleures performances et sécurité. Environnements de production."],
    ["Type 2","hébergé","Application au-dessus d'un OS hôte. Idéal pour poste de travail, tests, développement."]]}]},
  {h:"Les hyperviseurs populaires", g:[
   {table:{head:["Produit","Type","Positionnement"], rows:[
    ["VMware vSphere / ESXi","1","Standard du marché en entreprise ; HA, DRS, PRA"],
    ["Microsoft Hyper-V","1","Intégré à Windows Server, forte intégration Microsoft"],
    ["Citrix XenServer","1","Performance et évolutivité, environnements exigeants"],
    ["Proxmox VE","1 (et 2)","Open-source, basé Debian, combine VM (KVM) et conteneurs (LXC)"],
    ["Oracle VirtualBox","2","Open-source, simple, dev / tests / bureau"],
    ["VMware Workstation","2","Version pro de VirtualBox ; passerelle vers ESXi/vSphere"]]}}]},
  {h:"Avantages & inconvénients", g:[
   {cols:[
    ["Avantages","","**Réduction des coûts** : consolidation → moins de matériel, moins d'énergie · **Flexibilité & rapidité** : provisionnement instantané · **Sécurité** : isolation entre VM · **Disponibilité** : HA, restauration rapide."],
    ["Inconvénients","","**Complexité** : compétences et outils spécifiques · **Overhead** : dimensionnement à surveiller · **Licences** : certaines solutions sont coûteuses · **Sécurité** : nouveaux risques (accès, cloisonnement des données)."]]}]},
  {h:"Les types de virtualisation", g:[
   {kv:[
    ["Serveur","Plusieurs OS virtuels sur un serveur physique : consolidation matérielle"],
    ["Poste de travail (VDI)","Bureau virtuel accessible depuis n'importe quel appareil : mobilité + gestion centralisée"],
    ["Applications","Empaqueter une appli et ses dépendances dans une image (idée des conteneurs)"],
    ["Stockage","Pool de stockage partagé entre serveurs"],
    ["Réseau (SDN)","Réseaux virtuels programmables sur infra physique : sépare plan de contrôle et plan de données"]]},
   {cols:[
    ["SAN","Storage Area Network","Serveurs reliés à des baies via un réseau dédié. Stockage bloc, centralisé, adapté aux VM et applis."],
    ["NAS","Network Attached Storage","Accès aux données via le LAN classique. Partage de fichiers simple et centralisé."]]},
   {p:"Résumé : SAN = infrastructure de stockage dédiée ; NAS = partage de fichiers sur le réseau existant."}]}
 ]},
 {id:"02", t:"VMware Workstation & Proxmox VE", sub:"Nos deux outils de la saison : T2 (Workstation) et T1 (Proxmox : KVM + LXC)", parts:[
  {h:"Deux outils complémentaires", g:[
   {cols:[
    ["VMware Workstation","hyperviseur de type 2","Logiciel qui s'installe sur un OS existant (Windows, Linux). Équivalent professionnel de VirtualBox, standard de l'industrie IT."],
    ["Proxmox VE","hyperviseur de type 1","S'installe directement sur le matériel, sans OS intermédiaire. Plateforme open-source basée sur Debian."]]},
   {code:"Type 2 (au-dessus d'un OS hôte)     Type 1 (bare-metal)\n┌──────┬──────┬──────┐            ┌──────┬───────────┬──────┐\n│ VM 1 │ VM 2 │ VM 3 │            │ VM 1 │ Container │ VM 2 │\n├──────┴──────┴──────┤            ├──────┴───────────┴──────┤\n│ VMware Workstation │            │       Proxmox VE        │\n├────────────────────┤            ├─────────────────────────┤\n│ Windows/Linux hôte │            │    Matériel physique    │\n├────────────────────┤            └─────────────────────────┘\n│      Matériel      │\n└────────────────────┘"}]},
  {h:"VMware Workstation : fonctionnalités", g:[
   {h:"Gestion des VM", ul:["**Snapshots** : état complet à un instant T, retour arrière","**Clones** : complet (indépendant) ou lié (économie disque)","Support de nombreux OS invités","Partage de dossiers hôte ↔ VM, copier-coller, USB avancé"]},
   {h:"Réseaux virtuels", kv:[["NAT","La VM partage l'IP de l'hôte pour sortir"],["Bridge","La VM apparaît comme un vrai PC sur le LAN"],["Host-Only","Réseau isolé hôte ↔ VM"],["Custom","Réseaux personnalisés"]]},
   {p:"Intégration VMware : connexion à des serveurs ESXi distants, gestion vCenter (licence Pro), import/export OVF/OVA (standard industrie)."},
   {p:"Cas d'usage : formation/certifications (CCNA, MCSA…), labs sans matériel physique, dev/tests multi-OS, analyse de malwares en environnement isolé, tests de mises à jour avant prod."}]},
  {h:"Proxmox VE : la double technologie", g:[
   {cols:[
    ["KVM","Kernel-based Virtual Machine","Virtualisation complète. N'importe quel OS (Windows, Linux, BSD…). Chaque VM a son propre kernel : isolation totale."],
    ["LXC","Linux Containers","Conteneurisation légère. Uniquement Linux : partage le kernel de l'hôte. Démarrage en secondes, consommation minimale."]]},
   {kv:[
    ["Interface web","Accès via navigateur sur le port 8006 : VM, conteneurs, stockage, réseau, console VNC/SPICE, monitoring temps réel"],
    ["Stockage","Local (LVM, ZFS, Directory), réseau (NFS, iSCSI, Ceph), cloud (S3)"],
    ["Réseau","VLANs, bridges, bonds (agrégation), firewall intégré"],
    ["Backups","Planifiés, snapshots avant backup, compression + déduplication, restauration rapide"],
    ["Haute disponibilité","Clustering multi-nœuds, réplication de VM, migration auto en cas de panne, gestion du quorum"]]}]},
  {h:"Proxmox VE vs VMware ESXi", g:[
   {table:{head:["Critère","Proxmox VE","VMware ESXi"], rows:[
    ["Licence","Gratuit (AGPL)","Payant"],
    ["Support","Communauté ou payant","Souscription"],
    ["Conteneurs","LXC natif","Non (ajouts requis)"],
    ["Interface","Web complète","Web basique"],
    ["Clustering","Intégré, gratuit","vCenter requis (payant)"],
    ["API","REST complète","Limitée sans vCenter"],
    ["Écosystème","Open-source","Propriétaire"]]}},
   {p:"Marché du travail : VMware présent dans ~90 % des grandes entreprises (certifications VCP/VCAP). Proxmox en adoption croissante en PME/startups et homelab : compétence différenciante."}]},
  {h:"Cas d'usage Proxmox", g:[
   {kv:[
    ["Serveur PME","Héberger fichiers, AD, web, BDD sur une seule machine : ratio prix/perf excellent"],
    ["Homelab","Cloud maison (NextCloud, Plex, Pi-hole…), apprentissage"],
    ["Infra de dev","Environnements dev/test/staging, CI/CD avec conteneurs légers"],
    ["Hébergement","VPS multi-clients avec isolation, gestion via API"],
    ["Formation & labs","Snapshots pour repartir d'un état propre"]]}]},
  {h:"Licences VMware", g:[
   {p:"VMware Workstation est présenté comme un produit commercial (500 $ à 3 500 $ selon les versions). Pour la formation, on utilise des licences pédagogiques gratuites fournies par un utilisateur certifié VMware. Elles ouvrent l'accès aux fonctions avancées (HA, vMotion, vCenter/vSphere, réplication). Usage strictement pédagogique : ne jamais utiliser en production professionnelle."},
   {p:"Correction : depuis le rachat par Broadcom, Workstation Pro est gratuit pour un usage personnel (mai 2024), puis pour tous, y compris en entreprise (novembre 2024). Les licences pédagogiques restent utiles pour les produits serveur (vSphere, vCenter, HA, vMotion), toujours payants."}]}
 ]}
],
SB2:[
 {id:"01", t:"Sauvegarde & stockage : introduction", sub:"PDMA / DMIA, règle 3-2-1, sauvegarde vs snapshot vs réplication, DAS/NAS/SAN, RAID, ZFS / TrueNAS", parts:[
  {h:"Pourquoi sauvegarder ?", g:[
   {p:"La sécurité absolue n'existe pas : aucun système n'est sûr à 100 %. Il faut se préparer à l'échec. Face à un ransomware : soit on paie (mauvaise idée, aucune garantie), soit on restaure depuis des sauvegardes."},
   {def:"**PRA** (Plan de Reprise d'Activité) et **PCA** (Plan de Continuité d'Activité) = documents indiquant comment remettre un service en état après un incident. Les sauvegardes en sont le pilier. En anglais : Disaster Recovery Plan. Guide de référence : Guide ANSSI « Sauvegarde des systèmes d'information »."},
   {p:"**Règle** : avoir des sauvegardes c'est bien, tester leur restauration c'est mieux. Une sauvegarde qu'on ne peut pas restaurer est caduque."}]},
  {h:"Indicateurs : PDMA / DMIA", g:[
   {cols:[
    ["PDMA (RPO)","Perte de Données Maximale Admissible","Durée que l'on est prêt à perdre en cas d'incident. Détermine la fréquence des sauvegardes (PDMA 24 h → 1×/j, 6 h → 4×/j, quelques min → réplication)."],
    ["DMIA (RTO)","Durée Max d'Interruption Admissible","Temps d'interruption toléré avant retour au service. Défini par SLA entre la DSI et la Direction."]]}]},
  {h:"Règle 3-2-1 & rétention", g:[
   {steps:[["3 copies","Au moins 3 copies d'un fichier (production + 2 sauvegardes)"],["2 supports","Sur au moins 2 supports de stockage différents"],["1 hors-site","Dont 1 support hors-site / hors-ligne"]]},
   {p:"**Rétention** : durée (jours/mois/années) pendant laquelle on conserve une sauvegarde, définie par SLA, peut varier selon le type de sauvegarde."}]},
  {h:"Types de sauvegarde", g:[
   {table:{head:["Type","Ce qu'on sauvegarde","Restauration"], rows:[
    ["Complète","La totalité du dossier / système","Simple : la dernière complète"],
    ["Incrémentielle","Uniquement les fichiers modifiés depuis la dernière sauvegarde (complète ou incrémentielle)","Complexe : dernière complète + toutes les incrémentielles suivantes"],
    ["Différentielle","Fichiers modifiés depuis la dernière complète (peu importe les autres différentielles)","Simple : dernière complète + la dernière différentielle"]]}}]},
  {h:"Sauvegarde vs snapshot vs réplication", g:[
   {cols:[
    ["Sauvegarde","","Copie complète des données sur un autre support. Restaurable seule."],
    ["Snapshot","","« Photo » du système de fichiers à un instant T. Rapide et léger ; permet de revenir en arrière. N'est pas une sauvegarde : les données ne sont pas copiées, elles restent sur la même baie."],
    ["Réplication","","Synchrone (miroir, I/O sur 2 supports en même temps) ou asynchrone (copie décalée). Pour une PDMA proche de 0."]]},
   {p:"Bonne pratique combinée : 1 sauvegarde complète/semaine + 1 différentielle ou incrémentielle/jour + 1 snapshot/heure."}]},
  {h:"Stockage : température & médias", g:[
   {kv:[
    ["Online / hot","Directement accessible en production (SSD, disque interne)"],
    ["Nearline / tiède","Facilement accessible mais pas en direct (disque externe, NAS d'archives)"],
    ["Offline / cold","Plus lent / hors-ligne (bandes sur site distant), parfois sans alimentation"]]},
   {p:"Médias : bande magnétique (LTO), disque dur mécanique, optique (CD/DVD/Blu-ray + M-Disc), mémoire flash (SSD, SD, USB). Aucun média parfait : chacun ses compromis."}]},
  {h:"Architectures : DAS / NAS / SAN", g:[
   {table:{head:["Type","Principe","Accès"], rows:[
    ["DAS","Directly Attached Storage : le média est branché directement à une machine","Très rapide, non partagé"],
    ["NAS","Network Attached Storage : serveur dédié au stockage, partagé sur le LAN","Par fichiers via SMB/CIFS, NFS"],
    ["SAN","Storage Area Network : baies de stockage sur un réseau dédié","Par blocs (comme un disque DAS partagé)"]]}}]},
  {h:"RAID", g:[
   {def:"**RAID** (Redundant Array of Independent Disks) = techniques pour répartir les données sur plusieurs disques et améliorer performances, sécurité, ou tolérance de panne."},
   {table:{head:["Niveau","Principe","Tolérance"], rows:[
    ["RAID 0","Répartition (striping) sur 2+ disques. Perf max","Aucune"],
    ["RAID 1","Miroir sur 2+ disques","Panne de 1 disque"],
    ["RAID 5","Bit de parité, 3 disques mini","Panne de 1 disque"],
    ["RAID 10 (1+0)","Combinaison miroir + striping","Panne d'1 disque par miroir"]]}},
   {p:"Matériel (carte PCI dédiée, parfois avec batterie) vs logiciel (assuré par l'OS)."}]},
  {h:"Solutions du marché", g:[
   {kv:[
    ["NAS grand public / PME","Synology, QNAP"],
    ["SAN entreprise","Dell, HP Entreprise, IBM"],
    ["NAS DIY (logiciels)","TrueNAS, OpenMediaVault, Unraid (payant), Rockstor"],
    ["Sauvegarde entreprise","Veeam, UrBackup, Proxmox Backup Server"]]}]},
  {h:"Zoom TrueNAS & ZFS", g:[
   {p:"**ZFS** est le système de fichiers avancé utilisé par TrueNAS côté serveur. Avantages : intégrité des données (détection d'erreurs), snapshots natifs, RAID logiciel intégré (RAIDZ)."},
   {h:"Deux éditions de TrueNAS", kv:[["SCALE","Basé sur Debian. Plus de fonctionnalités, permet la virtualisation"],["CORE","Basé sur FreeBSD. Moins d'applications, plus classique"]]},
   {p:"Correction : depuis 2025, l'édition basée sur Debian (ex-SCALE) est devenue l'édition principale de TrueNAS ; CORE (FreeBSD) est en simple maintenance."},
   {h:"Hiérarchie ZFS", kv:[
    ["Storage / Pool","Espace global regroupant les disques (ex. : pool nommé tank)"],
    ["vDev (Virtual Device)","Groupe de disques formant une brique du pool"],
    ["Dataset","Sous-espace logique dans le pool : quotas, permissions, snapshots"]]},
   {p:"Correction : un dataset appartient au pool entier, pas à un vDev en particulier (ZFS répartit lui-même les données sur tous les vDevs). Un vDev n'est pas une partition : c'est un groupe de disques."},
   {h:"Types de vDevs (équivalents RAID)", table:{head:["Type","Équivalent","Disques mini","Tolérance"], rows:[
    ["Stripe","RAID 0","1+","Aucune (scratch/cache uniquement)"],
    ["Mirror","RAID 1","2","Panne d'1 disque"],
    ["RAIDZ1","RAID 5","3","Panne d'1 disque"],
    ["RAIDZ2","RAID 6","4","Panne de 2 disques"],
    ["RAIDZ3","—","5","Panne de 3 disques"]]}},
   {p:"**Disque de spare** : disque de secours non utilisé en fonctionnement normal. Si un disque tombe en panne dans un vDev, ZFS le remplace automatiquement par le spare et démarre le **resilvering** : le pool sort de l'état « dégradé » sans intervention."},
   {p:"Piège avec 3 disques : mettre 1 disque en spare = il reste 2 disques pour le vDev principal → seul un mirror simple est possible (RAIDZ1 impossible car 3 disques minimum)."},
   {p:"**Dataset** : c'est l'unité d'organisation. On y définit des quotas (ex. : limiter un dossier à 100 Go), des permissions (lecture, lecture/écriture), et on prend des snapshots ZFS : copies instantanées utiles pour restaurer un fichier supprimé."}]},
  {h:"Protocoles d'accès : SMB, NFS, iSCSI", g:[
   {p:"Ces protocoles sont utilisés côté client pour accéder au stockage exposé par TrueNAS. Ils sont indépendants de ZFS (qui est côté serveur)."},
   {cols:[
    ["SMB","Server Message Block","Partage de fichiers pour clients Windows. Accès type \\\\ip-truenas\\partage. Aussi utilisé sur macOS et Linux (Samba)."],
    ["NFS","Network File System","Partage de fichiers historique du monde Unix/Linux. Permissions UID/GID/rwx. Ex. : mount -t nfs IP:/mnt/tank/x /mnt."],
    ["iSCSI","Internet Small Computer System Interface","Partage un disque brut (mode bloc) sur le réseau. Le client voit un disque local vierge à formater."]]},
   {h:"iSCSI en pratique", steps:["Sur TrueNAS : créer un volume iSCSI (zvol) de taille définie (ex. : 50 Go)","TrueNAS l'expose comme un target iSCSI sur le réseau","Sur le client (Windows/Linux/ESXi), un initiateur iSCSI s'y connecte","Le disque apparaît côté client comme un disque local vierge → formatage (NTFS, ext4, VMFS…)"]},
   {p:"**LUN** = Logical Unit Number = un disque virtuel en mode bloc exposé via iSCSI."},
   {table:{head:["","SMB / NFS","iSCSI"], rows:[
    ["Type d'accès","Fichiers","Bloc (disque brut)"],
    ["Système de fichiers géré par","Le serveur (TrueNAS)","Le client (Windows/ESXi/Linux)"],
    ["Vu par le client comme","Un dossier réseau","Un disque dur local"],
    ["Usage typique","Partages documents, médias","Datastores de VM (ESXi), bases de données"]]}},
   {p:"Cas ESXi + TrueNAS : iSCSI est une excellente option pour héberger les VMs (souvent plus performant que NFS pour ce cas d'usage)."}]}
 ]}
],
SB3:[
 {id:"01", t:"Supervision & monitoring : introduction", sub:"Définitions, couches, indicateurs, modèles et collecte des données", parts:[
  {h:"Supervision vs monitoring", g:[
   {def:"**Supervision** = surveiller en continu l'état des systèmes, applications et infrastructures, pour détecter les anomalies et assurer un fonctionnement optimal."},
   {cols:[
    ["Monitoring","","Collecte de données en temps réel pour suivre l'état des composants IT."],
    ["Supervision","","Analyse ces données pour décider, déclencher des alertes et automatiser des actions correctives."]]},
   {p:"Enjeux : sécurité, performance, disponibilité. « L'utilisateur ne s'attend pas à ce que ça fonctionne parfaitement, il s'attend à ce que ce soit disponible. »"}]},
  {h:"Couches supervisées & horizon", g:[
   {h:"Couches à couvrir", ul:["Matériel : CPU, RAM, disques","OS et services système","Applications métier","Infrastructure réseau"]},
   {kv:[["Temps réel","Réagir immédiatement (alerte instantanée sur un événement)"],["Différé","Analyser tendances et causes racines sur historique"]]}]},
  {h:"Indicateurs & alertes", g:[
   {p:"Les **KPI** (indicateurs clés de performance) comme CPU, mémoire dispo, temps de réponse évaluent l'état du système. Les **SLA** définissent les seuils acceptables."},
   {kv:[["Informative","Simple notification pour suivi"],["Warning","Problème potentiel, à surveiller"],["Critique","Incident majeur, intervention immédiate"]]},
   {p:"Métriques essentielles : temps de réponse, connexions simultanées, utilisation des ressources."}]},
  {h:"Stratégies & modèles", g:[
   {kv:[
    ["Proactif vs réactif","Proactif : anticiper avant impact. Réactif : intervenir après la panne"],
    ["Logs vs métriques","Logs : événements enregistrés (comportements anormaux). Métriques : indicateurs chiffrés (variations)"],
    ["Centralisé vs décentralisé","Centralisé : 1 outil, vue globale. Décentralisé : analyse distribuée, meilleure résilience"],
    ["Corrélation d'événements","Identifier motifs récurrents et impact d'un problème sur l'ensemble du SI"],
    ["Cloud & hybride","Superviser des infras distribuées (ex. : Azure Monitor)"]]}]},
  {h:"Collecte & traitement des données", g:[
   {cols:[
    ["Polling (pull)","","Le manager interroge périodiquement les équipements."],
    ["Push","","Les équipements envoient spontanément leurs infos en cas de changement."]]},
   {kv:[["SNMP","Supervision réseau (voir fiche 02)"],["Syslog","Gestion centralisée des logs"],["API REST","Récupération de données temps réel côté applicatif"]]},
   {p:"Traitement : **agrégation** (consolider les sources) + **normalisation** (interprétation homogène). Stockage dans des **TSDB** (Time Series Databases) optimisées pour les métriques. Restitution : tableaux de bord et rapports."}]},
  {h:"Gestion des incidents & bonnes pratiques", g:[
   {ul:["Classifier chaque incident selon son impact pour prioriser","Définir des seuils pertinents : éviter les fausses alertes tout en restant réactif","Automatiser : redémarrage d'un service défaillant, notifications, escalade","Sécuriser la supervision elle-même (chiffrement, contrôle d'accès)","IA / ML : anticipation d'incidents et actions correctives proposées"]}]}
 ]},
 {id:"02", t:"SNMP", sub:"Architecture Manager / Agent / MIB, opérations, versions v1/v2c/v3 et sécurité", parts:[
  {h:"Qu'est-ce que SNMP ?", g:[
   {def:"**SNMP** (Simple Network Management Protocol) = protocole standardisé pour superviser et gérer à distance des équipements réseau (routeurs, switchs, serveurs, imprimantes…). Il permet une supervision centralisée et automatisée, sans devoir se connecter individuellement sur chaque équipement."},
   {kv:[["1988","SNMPv1 (RFC 1157)"],["1993","SNMPv2c : performances améliorées"],["1998","SNMPv3 : ajout de la sécurité"]]},
   {p:"SNMPv2c reste le plus utilisé aujourd'hui malgré ses faiblesses de sécurité."},
   {p:"Correction : en 1993 est sorti SNMPv2 « party-based », jugé trop complexe ; la version v2c (« community-based », RFC 1901) date de 1996. Elle reprend GET-BULK avec le modèle de sécurité de v1."}]},
  {h:"Architecture : Manager, Agent, MIB", g:[
   {cols:[
    ["Manager SNMP","","Serveur de supervision : interroge les équipements (polling), reçoit les alertes (traps), affiche et génère des rapports. Ex. : Zabbix, Nagios, PRTG, Centreon."],
    ["Agent SNMP","","Logiciel sur chaque équipement supervisé : répond au manager, envoie des traps en cas de problème, peut modifier la config si autorisé."],
    ["MIB","Management Information Base","Base de données hiérarchique définissant quelles infos sont disponibles. Chaque info a un OID (Object Identifier) unique."]]},
   {code:"# Exemples d'OID (structure arborescente ISO)\n1.3.6.1.2.1.1.1.0     # sysDescr : description du système\n1.3.6.1.2.1.1.5.0     # sysName : nom du système\n1.3.6.1.2.1.2.2.1.2   # ifDescr : description des interfaces"}]},
  {h:"Opérations SNMP", g:[
   {kv:[["GET","Récupérer une valeur"],["GET-NEXT","Récupérer la valeur suivante dans l'arborescence"],["GET-BULK","Récupérer plusieurs valeurs d'un coup (v2c/v3)"],["SET","Modifier une valeur (config)"],["TRAP","Alerte envoyée par l'agent spontanément"]]},
   {code:"# GET (polling, synchrone)\nManager → Agent : \"Donne-moi sysName (1.3.6.1.2.1.1.5.0)\"\nAgent → Manager : \"Router-Paris-01\"\n# TRAP (alerting, asynchrone)\nAgent → Manager : \"ALERTE ! GigabitEthernet0/1 est DOWN !\""},
   {table:{head:["","GET (polling)","TRAP (alerting)"], rows:[
    ["Fréquence","Régulière","Immédiate à l'événement"],
    ["Bande passante","Consomme","Économe"],
    ["Événements courts","Peuvent être ratés","Capturés"],
    ["Contrôle","Manager","Agent décide"]]}},
   {p:"Ports : **161/UDP** (Manager → Agent, GET/SET) et **162/UDP** (Agent → Manager, TRAP). UDP choisi pour la performance : livraison non garantie."}]},
  {h:"Comparaison des versions", g:[
   {table:{head:["Critère","SNMPv1","SNMPv2c","SNMPv3"], rows:[
    ["Sécurité","Aucune","Aucune","Auth + chiffrement"],
    ["Perfs","Basiques","+ GET-BULK","Idem v2c"],
    ["Complexité","Simple","Simple","Complexe"],
    ["Usage 2026","Rare (obsolète)","Courant","Croissant (prod)"]]}}]},
  {h:"Sécurité SNMP", g:[
   {def:"**Community string** (v1/v2c) = « mot de passe partagé » : public (lecture seule : GET) et private (lecture/écriture : GET + SET). Transmis en clair sur le réseau."},
   {p:"Risques v1/v2c : community capturable via sniffer, aucune authentification forte, possibilité de modifier la config si community RW volée, énumération du réseau. Un attaquant peut espionner et modifier."},
   {h:"Bonnes pratiques", ul:["Changer les communities par défaut (public/private)","Limiter les accès par ACL (Access Control List)","Communities complexes (comme des mots de passe)","Séparer les communities lecture seule et lecture/écriture","Privilégier SNMPv3 quand c'est possible","Utiliser un VLAN dédié à la supervision"]},
   {h:"SNMPv3 : 3 niveaux de sécurité", kv:[["noAuthNoPriv","Aucune sécurité (équivalent v2c)"],["authNoPriv","Authentification uniquement"],["authPriv","Authentification + chiffrement : à utiliser en production"]]}]},
  {h:"SNMP dans la supervision", g:[
   {p:"Les outils (Zabbix, Nagios, PRTG…) utilisent SNMP pour découvrir automatiquement les équipements, collecter les métriques, générer alertes et graphiques."},
   {h:"Métriques courantes", kv:[["Système","CPU, RAM, disque, température"],["Réseau","Trafic in/out, erreurs, paquets perdus"],["Interfaces","État up/down, bande passante"],["Environnement","Alimentation, ventilateurs"]]},
   {cols:[
    ["+ Avantages","","Standardisé, léger, universel, temps réel, sans agent supplémentaire."],
    ["− Limites","","Sécurité faible en v1/v2c, UDP (pertes possibles), MIB/OID complexes, traps non garantis, peu adapté aux applis métier."]]},
   {p:"Alternatives complémentaires : NetFlow/sFlow (analyse fine du trafic), API REST (applications), agents dédiés (système : CPU/RAM/services), logs (analyse comportementale). Une stratégie efficace combine plusieurs approches."}]}
 ]}
],
SB4:[
 {id:"01", t:"Bases de la programmation", sub:"Pourquoi automatiser : concepts, langages, idempotence et exemples Bash / PowerShell / Python", parts:[
  {h:"Pourquoi scripter ?", g:[
   {def:"Un **script** = un fichier texte contenant une suite de commandes, exécuté par un interpréteur. Il transforme une tâche répétitive de plusieurs heures en une commande à lancer."},
   {h:"Les 5 pain points qu'un script résout", steps:[["Répétitif","150 users, 300 VMs, 1 000 machines à patcher…"],["Consistance","Même résultat à chaque fois"],["Planification","Peut tourner à 3 h du matin sans vous"],["Audit","« Qui a fait quoi ? » → le script + son log"],["Fiabilité","Idempotent = relançable sans casser"]]},
   {p:"**Règle d'or du sysadmin** : si tu fais une tâche plus de 2 fois, tu la scriptes."}]},
  {h:"Anatomie d'un script", g:[
   {code:"#!/bin/bash                            # 1. Shebang : quel interpréteur utiliser\n# Un script Bash minimal\necho \"Bonjour $USER, il est $(date)\"   # 2. Commandes shell"},
   {p:"Un script contient 3 éléments : le **shebang** (#!/bin/bash), les **commandes** (ce que vous auriez tapé au terminal) et les **structures de contrôle** (conditions, boucles)."}]},
  {h:"Quel langage pour l'admin sys ?", g:[
   {table:{head:["Langage","Terrain","Force"], rows:[
    ["Bash","Linux, macOS, WSL","Colle des commandes shell"],
    ["PowerShell","Windows (Linux depuis 2018)","Objets, .NET, Active Directory"],
    ["Python","Partout","Complexité, API, parsing"],
    ["Batch","Windows (legacy)","Encore présent pour compatibilité"]]}},
   {p:"Règle simple : Linux → Bash. Windows → PowerShell. Ça se complique → Python."}]},
  {h:"Les concepts fondamentaux", g:[
   {kv:[
    ["Variables","Un conteneur avec un nom et une valeur (nom d'user, chemin, IP…)"],
    ["Conditions","SI l'user existe déjà → ne pas le recréer. SINON → le créer"],
    ["Boucles","POUR chaque user du CSV → créer compte, boîte mail, groupes"],
    ["for","Nombre d'itérations connu (CSV, liste, dossier)"],
    ["while","Tant qu'une condition est vraie (attendre qu'un service démarre…)"],
    ["Fonctions","Regrouper une suite d'actions réutilisable : creer_user(\"alice\",\"compta\"). Évite le copier-coller"],
    ["Arguments & code retour","./create_user.sh alice compta. Code 0 = succès, > 0 = erreur"]]}]},
  {h:"L'idempotence", g:[
   {def:"Un script est **idempotent** si on peut le relancer plusieurs fois sans casser le système. C'est la règle de survie : vos scripts d'admin DOIVENT l'être."},
   {code:"# Sans idempotence\nLancement 1 : ✅ alice créée\nLancement 2 : ❌ erreur \"alice existe déjà\"\n# Avec idempotence : \"Si alice n'existe pas → créer alice ; sinon rien\"\nLancement 1 : ✅ alice créée\nLancement 2 : ✅ rien à faire (déjà OK)"}]},
  {h:"Le même défi en 3 langages", g:[
   {p:"Créer /tmp/audit, y écrire un fichier avec date + hostname, et logger l'action."},
   {code:"### BASH\n#!/bin/bash\nDEST=\"/tmp/audit\"\nif [ ! -d \"$DEST\" ]; then mkdir -p \"$DEST\"; fi   # idempotence\nFILE=\"$DEST/audit-$(date +%Y-%m-%d).txt\"\necho \"Audit du $(date) sur $(hostname)\" > \"$FILE\"\nlogger \"Audit créé : $FILE\"\n\n### POWERSHELL\n$Dest = \"C:\\audit\"\nif (-not (Test-Path $Dest)) { New-Item -ItemType Directory -Path $Dest | Out-Null }\n$File = Join-Path $Dest \"audit-$(Get-Date -Format 'yyyy-MM-dd').txt\"\n\"Audit du $(Get-Date) sur $env:COMPUTERNAME\" | Out-File $File\n\n### PYTHON\nimport os, socket, datetime, logging\nDEST = \"/tmp/audit\"\nos.makedirs(DEST, exist_ok=True)   # idempotence\ndate = datetime.date.today().isoformat()\npath = os.path.join(DEST, f\"audit-{date}.txt\")"},
   {table:{head:["","Bash","PowerShell","Python"], rows:[
    ["Portabilité","Linux/macOS","Windows (+ Linux)","Partout"],
    ["Objets","Non (texte)","Oui","Oui"],
    ["Bibliothèque std","Petite","Énorme (.NET)","Énorme"],
    ["Apprentissage","Douce","Moyenne","Douce"]]}}]}
 ]},
 {id:"01.2", t:"IA & scripting", sub:"L'IA au poste de travail : ce qu'elle fait bien / mal, hallucinations et 5 règles d'or", parts:[
  {h:"Le deal : script → IA → IaC", g:[
   {p:"L'IA générative (ChatGPT, Claude, Copilot…) fait partie du poste d'un admin sys en 2026. Ce n'est ni magique, ni interdit : c'est un outil. La vraie question n'est pas « est-ce que je peux l'utiliser ? » mais **« est-ce que je peux juger le résultat ? »**"},
   {p:"Fil rouge du module : scripting (SB4-01) → IA & scripting (ici) → Infrastructure as Code (SB4-02). L'IA accélère le passage à l'IaC."},
   {p:"Correction : la fiche annonce l'IaC en « SB4-02 », mais SB4-02 est la fiche Python : vérifie la numérotation avec ton formateur."}]},
  {h:"Ce que l'IA fait très bien / très mal", g:[
   {cols:[
    ["Ce qu'elle fait bien","","Boilerplate (shebang, gestion d'args, logs) · rappel de syntaxe exacte (options, flags) · traduction d'un langage à l'autre (Bash → PowerShell) · explication de code existant · doc, données de test, refactoring."],
    ["Ce qu'elle fait mal","","Ne connaît pas votre infra (nommage, versions, ACL) · oublie l'idempotence · peut proposer sudo partout ou chmod 777 · utilise parfois des versions obsolètes (ex. PowerShell 5.1) · hallucine des commandes ou des options."]]}]},
  {h:"L'hallucination : le vrai danger", g:[
   {def:"**Hallucination** = l'IA produit une commande, un flag ou un module qui a l'air correct mais qui n'existe pas, ou qui fait autre chose que ce qui est décrit."},
   {code:"# Ça a l'air vrai... ça n'existe pas.\nnetsh interface security set profile=strict        # INVENTÉ\nGet-ADUserSecure -Filter \"SecurityLevel=High\"     # N'EXISTE PAS"},
   {p:"Le vrai danger n'est pas le code faux qui plante. C'est **le code faux qui tourne** : un script qui s'exécute sans erreur mais fait autre chose que ce que vous croyez (mauvais dossier supprimé, mauvaise règle firewall, mauvais users désactivés)."},
   {p:"Cas concret : l'IA propose Remove-Item -Path \"C:\\Users\\*\\Downloads\" pour « nettoyer les téléchargements ». Le script tourne. Il supprime les Downloads de tous les utilisateurs, sans confirmation, sans corbeille. Pas d'erreur. Juste un désastre."}]},
  {h:"Ce que le prompt ne dit pas", g:[
   {p:"Un prompt du type « écris-moi un script pour désactiver les vieux comptes AD » semble clair. En vrai, l'IA doit deviner :"},
   {ul:["Qu'est-ce qu'un compte « vieux » ? (30 j ? 90 j ? 1 an ?)","Sur quel attribut ? lastLogonTimestamp, pwdLastSet, whenCreated ?","Désactiver = disable ou delete ? Déplacer dans une OU quarantaine ?","Comptes de service exclus ? Comptes admins ? VIP ?","Un log ? Une notification ? Un dry-run d'abord ?"]},
   {p:"L'IA fait des hypothèses plausibles mais génériques. C'est à vous de contextualiser le prompt et de relire le résultat."}]},
  {h:"Les 5 règles d'or", g:[
   {steps:[
    ["Plausible ≠ correct","Si ça ressemble à du code valide, ça peut quand même être faux"],
    ["Vous ne relisez que ce que vous comprenez","Si vous ne pouvez pas expliquer une ligne, ne la lancez pas"],
    ["La responsabilité reste à vous","« C'est l'IA qui l'a écrit » n'est pas une excuse post-incident"],
    ["Toujours tester sur une VM jetable","Snapshot avant, restore après. Jamais en prod du premier coup"],
    ["Script généré non testé = incident en attente","Le test est votre travail, pas celui de l'IA"]]}]},
  {h:"Ce qu'on ne colle JAMAIS dans un chat IA", g:[
   {def:"**Règle absolue** : tout ce que vous collez dans un prompt public sort de votre SI. Considérez-le publié."},
   {h:"Interdit absolu", ul:["Mots de passe, hash, clés SSH, tokens API, secrets d'app","Noms de clients, projets internes, données RH","IPs / URLs internes, schémas AD, noms de serveurs","Exports de BDD, dumps, données personnelles (RGPD)","Certificats, clés privées, config de coffre-fort"]},
   {h:"Anonymiser plutôt qu'interdire", code:"# À la place de :          # Vous collez :\nsrv-prod-paris.acme.local   srv01.example.local\n10.42.7.15                  192.168.1.10\nalice.dupont@acme.fr        user@example.com"},
   {p:"Généraliser le contexte protège l'infra et donne souvent un meilleur résultat (l'IA n'est pas distraite par vos noms)."},
   {p:"Réflexe équipe : si votre boîte fournit un tenant privé (Copilot Enterprise, Claude Enterprise…), passez par là pour les données sensibles. Les chats grand public sont pour du code générique, pas pour votre prod."}]}
 ]},
 {id:"01.5", t:"Git & GitHub", sub:"Gestion de versions : dépôt, 3 zones, commits, push/pull, .gitignore et sécurité des secrets", parts:[
  {h:"Pourquoi Git, même pour un admin sys", g:[
   {def:"**Git** = logiciel de gestion de versions. Il enregistre l'historique complet d'un dossier : chaque version, son auteur, sa date, sa raison. Créé en 2005 par Linus Torvalds pour le noyau Linux. Libre, standard mondial."},
   {h:"Les 3 questions auxquelles Git répond", steps:["Qu'est-ce qui a changé dans ce script depuis la dernière fois ?","Qui l'a changé, quand, et pourquoi ?","Comment je reviens à la version d'avant ?"]},
   {p:"Ce que Git n'est PAS : un langage, une sauvegarde (rien ne part tout seul), un service Internet (tourne en local), un truc de dev. Fini les backup_final_OK_NE_PAS_TOUCHER.ps1 : un fichier, tout l'historique dans .git."}]},
  {h:"Dépôt, config & les 3 zones", g:[
   {p:"Un **dépôt** (repo) = dossier suivi par Git, grâce au sous-dossier caché .git. Toute l'histoire vit là. On n'y touche pas."},
   {code:"# Se présenter à Git (une fois par machine)\ngit config --global user.name \"Prenom Nom\"\ngit config --global user.email \"prenom.nom@exemple.fr\"\ngit config --global init.defaultBranch main   # comme GitHub"},
   {code:"Working directory ── git add ──► Staging ── git commit ──► .git (dépôt)\n   je modifie                 je sélectionne          j'enregistre"},
   {kv:[["Modifier","Écrire la lettre"],["git add","La mettre dans l'enveloppe"],["git commit","Poster l'enveloppe (dans l'historique)"]]}]},
  {h:"Le cycle local : init → add → commit → log", g:[
   {code:"mkdir mes-scripts && cd mes-scripts && git init\necho '#!/bin/bash' > purge-logs.sh\ngit status                 # votre meilleure amie, TOUJOURS\ngit add purge-logs.sh      # préférer au \"git add .\" risqué\ngit commit -m \"feat: script de purge des logs de plus de 30 jours\"\ngit log --oneline\na1b2c3d feat: script de purge des logs de plus de 30 jours"},
   {p:"Un **commit** = photo du projet à un instant T (id unique, auteur, date, message). Unité de base = une modification cohérente. En cas de doute : **git status**, elle vous dit quoi taper ensuite."}]},
  {h:"Messages de commit : Conventional Commits", g:[
   {p:"Le message n'explique pas ce que Git voit, il explique le **pourquoi**. Test : doit finir « Ce commit va… »."},
   {table:{head:["Préfixe","Usage","Exemple admin sys"], rows:[
    ["feat:","Nouvelle fonctionnalité","feat: ajout rotation sauvegardes sur 7 jours"],
    ["fix:","Correction bug","fix: correction du chemin UNC du partage"],
    ["docs:","Doc, README","docs: README avec prérequis d'exécution"],
    ["config:","Configuration","config: seuil disque 80 → 90 %"],
    ["chore:","Ménage, renommage","chore: renommage backup2.ps1 → backup-ad.ps1"]]}},
   {p:"À bannir : modif, update, ça marche, « . » : dans 6 mois, devant 40 commits « modif », vous relirez tout ligne par ligne comme si Git n'existait pas."}]},
  {h:"Git vs GitHub : local vs distant", g:[
   {table:{head:["","Git","GitHub"], rows:[
    ["Nature","Logiciel installé sur la machine","Site web (héberge le dépôt)"],
    ["Réseau","Fonctionne hors ligne","Nécessite Internet"],
    ["Historique","Local","Hébergé, partagé, relu"],
    ["Coût","Gratuit et libre","Service (gratuit ou payant)"]]}},
   {p:"Git = Word. GitHub = Google Docs. Git s'utilise sans GitHub, l'inverse n'existe pas. Alternatives : GitLab (souvent auto-hébergé en entreprise), Bitbucket, Gitea. **origin** = nom par défaut du dépôt distant."},
   {p:"**Clé SSH** : paire de fichiers. Publique → GitHub. Privée reste sur le poste. Carte d'identité crypto, pas un mot de passe. Jamais la commiter, la coller dans un chat, ou l'envoyer par mail."}]},
  {h:"La règle d'or en équipe : pull → commit → pull → push", g:[
   {code:"git clone git@github.com:org/scripts-infra.git   # une seule fois\n# Cycle quotidien\ngit pull                  # 1. TOUJOURS avant de commencer\n# … modifications …\ngit add purge-logs.sh     # 2. préparer\ngit commit -m \"fix: exclusion /var/log/audit\"   # 3. valider\ngit pull                  # 4. re-sync avant d'envoyer\ngit push                  # 5. envoyer"},
   {p:"Pull avant de travailler, pull avant de pousser. 90 % des conflits Git viennent d'un pull oublié à l'étape 1. **push** n'envoie que ce qui est commité : un fichier modifié mais pas commité ne part pas."},
   {cols:[
    ["Branche","","Ligne de travail parallèle : on modifie sans toucher à main, puis on réunifie. Le mécanisme central du travail en équipe."],
    ["Pull Request (PR)","","Demande de relecture : diff (vert / rouge), commentaires ligne par ligne, bouton Fusionner. Contrôle à 4 yeux appliqué au code, souvent une exigence d'audit."]]}]},
  {h:".gitignore & sécurité", g:[
   {p:"Le fichier **.gitignore** (racine, lui, se commite) liste ce que Git doit ignorer : .env, *.key, *.pem, credentials.json, *.log, exports/, .DS_Store…"},
   {p:"Interdit absolu de commiter : mots de passe / hash / clés privées, clés d'API / tokens / chaînes de connexion, .env, conf de prod, exports de BDD, données réelles (RGPD), fichiers lourds ou générés."},
   {def:"**Un secret poussé est un secret à révoquer.** Le supprimer au commit suivant ne protège rien : il reste dans l'historique, cloné, indexé, scanné en permanence. Délai push → première exploitation : très court."},
   {steps:["Révoquer la clé côté service","En générer une nouvelle","Prévenir qui de droit","Ensuite seulement, nettoyer le dépôt"]},
   {p:"Réflexe : les scripts lisent leurs secrets depuis une variable d'environnement ou un fichier ignoré, jamais depuis une valeur en dur."}]},
  {h:"Markdown & README : documenter ses scripts", g:[
   {p:"**Markdown** = langage des README, issues GitHub, wikis. Syntaxe utile : # H1, ## H2, **gras** (deux astérisques), _italique_, `code`, listes à puces / numérotées, ```bash pour blocs de code, tableaux | col | col |, liens [texte](url). Une ligne vide sépare les blocs."},
   {p:"Un README répond à 3 questions, dans cet ordre : (1) À quoi ça sert ? (1-2 phrases, sans jargon). (2) Comment on le lance ? (ligne de commande exacte + exemple réel). (3) Prérequis (droits, système, modules, réseau). Écrivez-le pour le collègue d'astreinte à 3 h du matin, ou vous dans 6 mois."},
   {p:"IA + README : parfait cas d'usage, mais elle invente des options (--dry-run qui n'existe pas), des prérequis, des exemples faux. Un README faux est pire qu'un README absent. En-tête de script (ce que Git ne remplace pas) : # Objet / Auteur / Usage / Prérequis."}]},
  {h:"Pièges courants & secours", g:[
   {kv:[
    ["Git refuse le commit, identité inconnue","git config --global user.name / user.email"],
    ["Mauvais message (dernier commit)","git commit --amend -m \"nouveau message\""],
    ["Fichier oublié dans le dernier commit","git add fichier puis git commit --amend --no-edit"],
    ["Annuler ses modifs locales","git restore fichier.sh"],
    ["Sortir un fichier du staging","git restore --staged fichier.sh"],
    ["push refusé","git pull d'abord, puis git push"]]},
   {p:"Limite de **--amend** : réécrit le dernier commit. Sans danger avant push. Interdit après : une fois poussé, le commit appartient à tout le monde, le réécrire casse l'historique des collègues."},
   {p:"Réflexe pro : quand vous êtes perdu, relisez git status. Ne supprimez jamais .git pour « repartir propre » : c'est jeter l'historique pour éviter de lire un message d'erreur."}]}
 ]}
,{id:"03", t:"Bash", sub:"Anatomie, variables, quoting, tests, boucles, arguments & codes retour, fonctions, redirections, shellcheck", parts:[
