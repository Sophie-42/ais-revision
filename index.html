SC3:[
 {id:"01", t:"Intro & cadrage", sub:"Programme de la saison, objectifs, acronymes clés et outils", parts:[
  {h:"Pourquoi ce module : « ça marche » → « c'est sécurisé »", g:[
   {p:"Analogie : votre infra = une maison. On a construit les murs et posé les portes, mais : a-t-on mis des serrures ? Sait-on qui a les clés ? Que faire si quelqu'un entre par la fenêtre ? C'est ce que SC3 va enseigner."},
   {h:"À la fin de la saison, vous saurez", ul:["Sécuriser un réseau et une infra simple","Déployer des briques de défense : pare-feu, VPN, IDS/IPS, SIEM","Durcir un serveur Linux","Diagnostiquer une faille « terrain » et la corriger","Justifier vos choix de sécurité"]}]},
  {h:"Programme : les 10 épisodes", g:[
   {kv:[
    ["E1","Intro, gouvernance, SOC/SIEM, attaques L2"],["E2","ACL, 802.1X, RADIUS, sécurité WiFi"],["E3","DMZ, pare-feu, VPN : les 3 piliers du réseau sécurisé"],
    ["E4","Atelier IDS/IPS + SIEM : Suricata & Wazuh"],["E5","Correction atelier IDS/IPS + SIEM (suite)"],["E6","Sécurité Linux : pare-feu, SSH hardening"],
    ["E7","Sécurité Linux : PAM, fail2ban, port-knocking"],["E8","Sécu applicative : reverse-proxy, HTTPS, load-balancing"],["E9","SSO/IAM, WAF, CDN"],["E10","ECF + bilan"]]},
   {p:"On pose les concepts avant la technique, puis on met les mains dans les outils."}]},
  {h:"Les acronymes qu'on va croiser", g:[
   {kv:[
    ["Fondamentaux","CIA (Confidentialité, Intégrité, Disponibilité), PDR (Plan de Reprise)"],
    ["Équipes de réponse","CSIRT, CERT"],
    ["Surveillance","SOC, SIEM, CTI, EDR, XDR"],
    ["Normes","ISO 27001/27002, PCI DSS, HIPAA, RGPD"],
    ["Outils de défense","IDS, IPS, WAF, CDN"]]},
   {h:"Outils & environnement de travail", kv:[
    ["Packet Tracer / Proxmox","Simulation et virtualisation"],["pfSense","Pare-feu / routeur"],["Suricata","IDS/IPS"],["Wazuh","SIEM + EDR open-source"],["HAProxy, Nginx","Reverse-proxy / load balancer"]]},
   {p:"Beaucoup de Linux en ligne de commande. Ne paniquez pas devant les acronymes : chacun sera contextualisé au moment où on l'utilise vraiment."}]}
 ]},
 {id:"02", t:"Gouvernance & normes", sub:"Triade CIA, PDR, CSIRT/CERT, MITRE ATT&CK, ISO 27001, PCI DSS, HIPAA, RGPD", parts:[
  {h:"Pourquoi la gouvernance avant la technique ?", g:[
   {def:"Sans cadre, on sécurise au hasard, sans savoir jusqu'où aller, sans pouvoir justifier ses choix. La **gouvernance** donne la direction : qui décide, quoi protéger en priorité, comment on vérifie. Bref : un cadre pour que la technique ait du sens."}]},
  {h:"La triade CIA : le socle", g:[
   {cols:[
    ["Confidentialité","","Seules les personnes autorisées accèdent à l'information. Moyens : chiffrement, contrôle d'accès (mots de passe, MFA), classification. Analogie : une lettre dans une enveloppe scellée."],
    ["Intégrité","","L'information n'est pas modifiée sans autorisation. Moyens : hachage, signatures numériques, contrôle de version. Analogie : un sceau de cire sur un document officiel."],
    ["Disponibilité","","L'information est accessible quand on en a besoin. Moyens : redondance, HA, sauvegardes, plan de reprise. Analogie : un hôpital qui ne peut jamais fermer."]]},
   {p:"**Ransomware : quel pilier touche-t-il ?** Confidentialité (possible exfiltration), intégrité (données chiffrées/altérées), disponibilité (plus d'accès aux données). Souvent les 3 en même temps : c'est pour ça qu'il est si redouté."}]},
  {h:"PDR & les questions à se poser", g:[
   {def:"**Plan de Reprise** : on ne vise pas le zéro incident. On vise repartir vite, repartir propre, limiter la casse."},
   {steps:["Que fait-on si tout tombe ?","Qui décide quoi ?","En combien de temps on repart ?"]},
   {p:"Si vous ne pouvez pas répondre à ces questions aujourd'hui, vous avez besoin d'un PRA/PCA (voir SC1-12)."}]},
  {h:"CSIRT / CERT & MITRE ATT&CK", g:[
   {table:{head:["Sigle","Rôle","Exemple"], rows:[
    ["CERT","Veille + réponse aux incidents (souvent national)","CERT-FR de l'ANSSI"],
    ["CSIRT","Équipe interne ou dédiée à la gestion d'incidents","CSIRT de votre entreprise"]]}},
   {p:"Dans la vraie vie : on veut des procédures, pas juste des outils."},
   {def:"**MITRE ATT&CK** = grille de lecture des attaques. **Tactiques** (le pourquoi : accès initial, persistance…), **Techniques** (le comment : phishing, brute-force…), **Procédures** (le qui l'a fait : groupes d'attaquants connus)."},
   {p:"À quoi ça sert ? Analyser un incident, couvrir ses angles morts, parler un langage commun entre équipes. Lien : attack.mitre.org"}]},
  {h:"Normes et standards", g:[
   {table:{head:["Norme","Portée","Contenu clé"], rows:[
    ["ISO 27001","SMSI (management de la sécurité de l'information)","Exigences pour organiser la sécurité dans la durée"],
    ["ISO 27002","Complément de 27001","Catalogue de mesures et bonnes pratiques"],
    ["PCI DSS","Cartes bancaires (obligation pour tout commerçant qui traite des paiements CB)","Segmentation réseau, chiffrement, contrôle d'accès, journalisation"],
    ["HIPAA","Cadre US pour la donnée de santé","Confidentialité des dossiers patients, traçabilité, contrôle d'accès strict"],
    ["RGPD","Cadre européen : données personnelles","Minimisation, transparence, sécurité des traitements, droits des personnes (accès, suppression)"]]}},
   {p:"**RGPD**, amendes en cas de non-respect : jusqu'à 20 M€ ou 4 % du CA mondial. Exemples : Google 150 M€ (cookies, 2022, CNIL) · Amazon 746 M€ (ciblage pub, 2021) · Meta 1,2 Md€ (transferts de données, 2023). La conformité, ce n'est pas juste de la paperasse."}]},
  {h:"Gouvernance = décisions + preuves", g:[
   {cols:[
    ["Ce qu'on doit être capable de dire","","« Voici nos risques » · « Voici nos priorités » · « Voici nos mesures » · « Voici comment on vérifie »."],
    ["Ce que ça change côté terrain","","On justifie une règle de pare-feu · on priorise les patchs · on structure un plan d'action. La technique a un sens : chaque contrôle répond à un risque documenté."]]}]}
 ]},
 {id:"03", t:"SOC, SIEM, CTI, EDR, XDR", sub:"La chaîne de surveillance et de réponse : qui fait quoi", parts:[
  {h:"Le scénario 3 h du matin", g:[
   {p:"Il est 3 h du matin. Une alerte se déclenche dans le SOC : connexion suspecte depuis la Russie vers un serveur interne. Le **SIEM** a corrélé cette alerte avec des tentatives de connexion échouées, puis une réussie. L'analyste vérifie dans la **CTI** : l'IP est connue comme malveillante. L'**EDR** a détecté un processus suspect sur le poste compromis → il l'isole automatiquement. Le **SOC** lance la remédiation."},
   {p:"La morale : sans SOC → personne ne regarde à 3 h. Sans SIEM → pas de corrélation. Sans EDR → le malware continue tranquillement. Chaque brique a son rôle : la question n'est pas « si », mais « quand »."}]},
  {h:"SOC : le centre de pilotage", g:[
   {def:"**SOC** (Security Operations Center) = équipe + process. Analogie : les pompiers du SI. Mot-clé : routine + méthode."},
   {p:"Les 4 missions : collecte des logs · détection d'alertes · réponse aux incidents · amélioration continue."},
   {kv:[["N1","Tri et qualification : le « premier regard »"],["N2","Investigation approfondie"],["N3","Expertise, forensique, remédiation complexe"]]},
   {p:"Volume réel : un SOC moyen reçoit **10 000 à 50 000 alertes/jour** → d'où l'importance de bien filtrer et prioriser. Ennemi n°1 du SOC : l'**alert fatigue** (trop d'alertes = on ne regarde plus rien). Pas besoin d'être 20 : un petit SOC bien cadré = gros impact."}]},
  {h:"SIEM : le cerveau des logs", g:[
   {def:"**SIEM** (Security Information and Event Management) = le cerveau qui connecte toutes les informations."},
   {cols:[
    ["Ce qu'il sait faire","","Centraliser les logs de toutes les sources · corréler les événements entre eux · déclencher des alertes selon des règles · aider à l'enquête (recherche dans les logs)."],
    ["Ce qu'il ne sait PAS faire","","Décider à votre place · corriger automatiquement (sauf intégration SOAR)."]]},
   {p:"Sans SIEM : on a des logs partout, mais aucune vision globale. Outil puissant, mais il a besoin d'humains pour l'exploiter."}]},
  {h:"CTI & SIEM + CTI", g:[
   {def:"**CTI** (Cyber Threat Intelligence) = connaître son ennemi avant qu'il attaque. Suivre les menaces actuelles, comprendre les campagnes d'attaque, enrichir la détection du SIEM."},
   {kv:[["IOCs (Indicators of Compromise)","Hash de malwares, IPs malveillantes, domaines suspects"],["Tactiques MITRE","Comment les groupes d'attaquants opèrent (cf. fiche 02)"],["Flux de renseignement","Feeds automatisés (STIX/TAXII)"]]},
   {p:"SIEM sans CTI : on détecte des patterns génériques. SIEM + CTI : on sait qui attaquerait, comment ils procèdent, avec quels indicateurs les repérer."}]},
  {h:"EDR & XDR", g:[
   {cols:[
    ["EDR","Endpoint Detection & Response","Antivirus intelligent, orienté comportements, pas signatures. Surveille le poste en continu, détecte des comportements suspects, peut isoler un poste ou couper un processus, enregistre une timeline pour l'investigation. Ex. : CrowdStrike Falcon, Microsoft Defender for Endpoint, SentinelOne, Wazuh (open-source)."],
    ["XDR","eXtended Detection & Response","EDR++ avec corrélation multi-sources. Regroupe plusieurs couches (poste, réseau, cloud, mail…), corrèle les alertes entre les couches, donne une vision globale de la sécurité."]]},
   {p:"**EDR** = ce qui se passe sur un poste. **XDR** = ce qui se passe sur tout le SI. Antivirus classique : signatures connues. EDR : observe les comportements → détecte l'inconnu."}]},
  {h:"Récap : qui fait quoi", g:[
   {table:{head:["Sigle","Nom complet","Rôle"], rows:[
    ["SOC","Security Operations Center","Équipe + process (les pompiers)"],
    ["SIEM","Security Information & Event Management","Logs + corrélation (le cerveau)"],
    ["CTI","Cyber Threat Intelligence","Renseignement sur les menaces"],
    ["EDR","Endpoint Detection & Response","Défense endpoint (l'antivirus intelligent)"],
    ["XDR","eXtended Detection & Response","Corrélation multi-défenses"]]}},
   {steps:["SIEM détecte une connexion anormale","CTI confirme que l'IP est malveillante","EDR bloque le processus suspect sur le poste","SOC prend la décision et lance la remédiation"]},
   {p:"Chaque brique enrichit les autres : c'est la force de l'écosystème."}]}
 ]}
,{id:"04", t:"Pare-feu Linux", sub:"Netfilter, iptables/nftables/ufw : chaînes, deny by default, terrain", parts:[
  {h:"Pourquoi le pare-feu Linux compte", g:[
   {p:"Sur un serveur Linux, le pare-feu est le **dernier garde-fou** : il protège les services exposés, limite l'impact d'une erreur de config, et applique concrètement la politique de sécurité. Même avec un bon réseau amont, un serveur mal protégé reste vulnérable."}]},
  {h:"Netfilter : le moteur dans le noyau", g:[
   {def:"**Netfilter** = le pare-feu intégré au noyau Linux. Il intercepte les paquets réseau et applique des règles. iptables, nftables et ufw ne sont que des interfaces qui parlent à netfilter."},
   {kv:[["ACCEPT","Laisser passer"],["DROP","Jeter silencieusement (l'attaquant ne sait pas si le port existe)"],["REJECT","Refuser avec réponse (ICMP unreachable ou TCP RST)"],["LOG","Journaliser (dans /var/log/kern.log ou syslog)"]]},
   {p:"**DROP vs REJECT** : DROP est plus discret face à un scan (le port paraît fermé/filtré), REJECT est plus « correct » sur un réseau interne où on préfère un refus explicite."}]},
  {h:"Les 3 chaînes : l'analogie de l'aéroport", g:[
   {cols:[
    ["INPUT","les arrivées","Trafic qui arrive sur la machine. C'est là qu'on filtre ce que les autres envoient vers nous."],
    ["OUTPUT","les départs","Trafic qui part de la machine. Utile pour contrôler ce qu'un serveur peut aller chercher dehors."],
    ["FORWARD","le transit","Trafic qui traverse la machine (routeur, passerelle, pfSense). Cœur du travail d'un firewall en coupure."]]},
   {p:"Analogie du videur : netfilter est à la porte, il a la liste des règles, chaque paquet est vérifié → soit il entre, soit il dégage. Retenez ces 3 chaînes, vous savez déjà 80 %."}]},
  {h:"Politique par défaut : la règle d'or", g:[
   {def:"**Deny by default** : tout est interdit sauf ce qui est explicitement autorisé. On met la policy à DROP, puis on ouvre uniquement ce qui est nécessaire → principe du moindre privilège."},
   {p:"Piège classique : si on met DROP par défaut sans ajouter aucune règle… plus rien ne passe. Même pas SSH. Vous venez de vous couper l'accès à votre propre serveur. Ça arrive à tout le monde au moins une fois."},
   {p:"Correction (précision) : en DROP par défaut, ajouter aussi ct state established,related accept (conntrack), sinon les réponses aux connexions sortantes sont bloquées (plus de mises à jour, plus de DNS)."}]},
  {h:"iptables, nftables, ufw : les 3 outils", g:[
   {kv:[
    ["iptables","Le vétéran : verbeux mais incontournable, encore très présent en prod, encore demandé en entretien"],
    ["nftables","Le futur : unifie IPv4/IPv6, syntaxe plus lisible, meilleures performances, pas encore partout"],
    ["ufw","Le simplifié : surcouche d'iptables, idéal VPS/poste simple, pas adapté aux configs complexes"]]},
   {h:"Même objectif, 3 syntaxes : sécuriser un serveur web", code:"# ===== iptables =====\niptables -A INPUT -s 192.168.1.100 -p tcp --dport 22 -j ACCEPT  # SSH admin\niptables -A INPUT -p tcp --dport 80 -j ACCEPT                    # HTTP\niptables -A INPUT -p tcp --dport 443 -j ACCEPT                   # HTTPS\niptables -P INPUT DROP                                           # deny by default\n\n# ===== nftables =====\nnft add table inet filter\nnft add chain inet filter input { type filter hook input priority 0 \\; policy drop \\; }\nnft add rule inet filter input tcp dport 22 accept\nnft add rule inet filter input tcp dport { 80, 443 } accept\n\n# ===== ufw =====\nufw default deny incoming\nufw allow from 192.168.1.100 to any port 22\nufw allow 80/tcp\nufw allow 443/tcp\nufw enable"},
   {p:"Objectif atteint : SSH depuis l'IP d'admin uniquement, HTTP/HTTPS pour tout le monde, tout le reste bloqué. Avec ufw, 5 lignes suffisent."}]},
  {h:"Bonnes pratiques terrain", g:[
   {h:"Les réflexes à avoir", ul:["Tester en console locale avant d'appliquer en remote","Ne jamais oublier SSH avant de passer en DROP","Documenter chaque règle (pourquoi elle existe)","Sauvegarder la config avant de modifier"]},
   {def:"**La parade anti-lockout** : toujours garder une session console ouverte pendant qu'on modifie les règles (Proxmox, IPMI, KVM). Ou mieux : un cron qui restaure la config précédente au bout de 5 minutes. Si vous ne réussissez pas à couper le cron, c'est que vous avez perdu l'accès → la config revient toute seule."},
   {p:"À retenir : netfilter = le moteur (dans le noyau) · iptables = la base à connaître · nftables = le moderne · ufw = le simplifié. Le pare-feu ne remplace pas les autres briques (SSH durci, fail2ban, segmentation) : il les complète."}]}
 ]},
 {id:"05", t:"DMZ & pare-feu", sub:"Isoler pour mieux protéger : architecture, règles de flux, pfSense", parts:[
  {h:"Pourquoi la DMZ existe : l'analogie du château fort", g:[
   {def:"On a toujours des services exposés à Internet : site web, VPN, serveur mail, API publique… La **DMZ** (DeMilitarized Zone) sert à contenir le risque : on accepte qu'elle soit plus exposée pour que le LAN reste protégé même en cas de compromission."},
   {cols:[
    ["Le donjon = votre LAN","","Les données critiques, les utilisateurs internes."],
    ["La cour extérieure = la DMZ","","Les marchands, les visiteurs… sous surveillance."],
    ["L'extérieur = Internet","","Tout le monde, y compris les assaillants."]]},
   {p:"Le principe clé : même si un attaquant compromet la DMZ, le donjon (LAN) reste protégé."}]},
  {h:"Architecture & règles de flux", g:[
   {code:"Internet ↔ Pare-feu ↔ DMZ ↔ Pare-feu ↔ LAN"},
   {def:"**Règle absolue** : pas de route directe Internet → LAN. Un serveur web dans le LAN ? Jamais : si le serveur est compromis, l'attaquant a un accès direct au réseau interne. C'est exactement pour ça que la DMZ existe."},
   {kv:[
    ["Internet → DMZ","Autorisé sur services précis (ex : HTTP 80, HTTPS 443). Tout le reste bloqué"],
    ["DMZ → LAN","Très limité ! Ex : accès BDD sur un port précis. Jamais d'accès libre : la règle la plus importante de toute l'architecture"],
    ["LAN → DMZ","Autorisé selon les besoins (SSH admin, monitoring)"],
    ["LAN → Internet","Généralement autorisé (navigation, MAJ), peut être filtré (proxy, inspection SSL)"]]},
   {p:"Erreurs fréquentes : DMZ trop ouverte vers le LAN · services critiques mal isolés · règles floues ou non documentées · pas de journalisation des flux inter-zones. Un pare-feu mal configuré donne une fausse sensation de sécurité."}]},
  {h:"pfSense : le couteau suisse du pare-feu", g:[
   {cols:[
    ["Pourquoi pfSense","","Open-source et gratuit · interface web intuitive · parfait pour créer une DMZ · logs, monitoring, alertes intégrés."],
    ["Ce qu'on peut faire avec","","Créer l'interface DMZ · isoler par règles de firewall · créer des alias (groupes d'IPs, de ports) · tracer et auditer les flux."]]},
   {p:"**NAT & redirections** : pour exposer un service DMZ, faire un DNAT (Internet → IP publique:443 → DMZ:443) + une règle firewall associée. Toujours : « autoriser ce qui est nécessaire, rien de plus »."}]},
  {h:"Exemple concret : service web en DMZ, règles pas à pas", g:[
   {code:"# Étape 1 : Internet → DMZ (le web est accessible)\nSource: Internet (any)   Destination: DMZ_WEB_SERVER\nPorts: 80, 443           Action: ALLOW\n# Étape 2 : DMZ → LAN (accès BDD strictement contrôlé)\nSource: DMZ_WEB_SERVER   Destination: LAN_DB_SERVER\nPort: 3306 (MySQL)       Action: ALLOW\n# → uniquement ce port, uniquement depuis ce serveur !\n# Étape 3 : LAN → DMZ (administration)\nSource: LAN_ADMIN        Destination: DMZ_WEB_SERVER\nPort: 22 (SSH)           Action: ALLOW\n# Étape 4 : Tout le reste : deny by default, TOUJOURS\nSource: any              Destination: any       Action: DENY"},
   {p:"Objectif final : un service exposé mais contrôlé, un LAN protégé, des règles lisibles et justifiées. La segmentation réseau, c'est la base de toute architecture sécurisée."}]}
 ]},
 {id:"06", t:"Sécurité WiFi", sub:"WEP, WPA1, WPA2, WPA3 : Personal vs Enterprise, RADIUS et bons choix", parts:[
  {h:"Pourquoi le WiFi mérite un module entier", g:[
   {def:"Contrairement à l'Ethernet où il faut se brancher physiquement, le WiFi **diffuse partout autour** : parking, immeuble voisin, rue. Le signal traverse les murs. N'importe qui à portée peut essayer de s'y connecter, écouter les échanges, ou attaquer. D'où l'importance de bien choisir son mécanisme d'authentification et de chiffrement."}]},
  {h:"Historique des protocoles : du pire au meilleur", g:[
   {table:{head:["Norme","Année","Verdict"], rows:[
    ["WEP","1999","À bannir : cassé en quelques minutes. Ne jamais utiliser, même « temporairement »"],
    ["WPA1","2003","Patch de transition. Obsolète : à éviter"],
    ["WPA2","2004","Base solide : chiffrement AES, deux modes (Personal / Enterprise). Encore majoritaire aujourd'hui"],
    ["WPA3","2018","Renforcement : résistant au brute-force, chiffre même les réseaux publics ouverts. À privilégier quand le matériel le permet"]]}},
   {p:"La vraie question aujourd'hui : WPA2 ou WPA3, en Personal ou en Enterprise ?"}]},
  {h:"Personal vs Enterprise : la vraie différence", g:[
   {cols:[
    ["WPA2/3 Personal (PSK)","un seul mot de passe partagé","Simple à mettre en place, adapté à la maison et aux très petites structures. Limites : tout le monde a le même mot de passe, départ d'un salarié → tout changer, pas de traçabilité par utilisateur."],
    ["WPA2/3 Enterprise","identifiants individuels","Chaque utilisateur a son login/mot de passe ou certificat. S'appuie sur un serveur RADIUS (802.1X). Authentification individuelle et traçable, départ d'un salarié → on désactive son compte, gérable à l'échelle, peut isoler par VLAN selon le rôle."]]},
   {p:"**RADIUS en 30 secondes** : l'utilisateur tente de se connecter au WiFi → le point d'accès demande à RADIUS « ce login/mot de passe est-il valide ? » → RADIUS répond OUI/NON → accès accordé ou refusé. Même principe que 802.1X en filaire."}]},
  {h:"WPA3 : ce qu'il apporte concrètement", g:[
   {cols:[
    ["WPA3 Personal (SAE)","","Résistance au brute-force hors ligne (le point faible historique de WPA2 PSK). Meilleure protection même si le mot de passe est faible."],
    ["WPA3 Enterprise + réseaux publics","","Chiffrement renforcé (192 bits en mode « top secret »). OWE (Opportunistic Wireless Encryption) : chiffre même les WiFi ouverts (aéroport, café)."]]},
   {p:"Attention compatibilité : tous les équipements ne supportent pas WPA3. Beaucoup de réseaux tournent en WPA2/WPA3 mixte le temps que le parc se renouvelle."}]},
  {h:"Comment choisir en pratique", g:[
   {kv:[
    ["Maison","WPA2 ou WPA3 Personal : mot de passe long et unique"],
    ["Très petite entreprise","WPA2 Personal acceptable si < 10 personnes stables · changer le mot de passe en cas de départ"],
    ["PME","WPA2 Enterprise + RADIUS · comptes individuels · VLAN par service"],
    ["Environnement sensible","WPA3 Enterprise : chiffrement 192 bits, certificats"],
    ["Réseau invité","SSID séparé, VLAN isolé du LAN interne, débit limité, portail captif si besoin"]]},
   {p:"Erreurs terrain : mots de passe faibles ou partagés sur post-it · anciens équipements coincés en WPA1/WEP « parce qu'il faut bien qu'ils fonctionnent » · réseau invité mélangé au réseau interne (le pire) · SSID d'entreprise identique au SSID maison de quelqu'un (attaque evil twin facilitée)."},
   {p:"Bonnes pratiques : SSID clair (pas « linksys »), mot de passe long (20+ caractères) si Personal, **désactiver WPS**, séparer SSID invité et SSID interne, mettre à jour le firmware des AP, surveiller les tentatives de connexion."}]}
 ]}
,{id:"07", t:"Authentification forte & SSH hardening", sub:"Clés SSH, sshd_config durci, procédure pas à pas", parts:[
  {h:"Pourquoi SSH est la cible n°1", g:[
   {def:"**SSH** = la porte d'entrée de tous les serveurs Linux : administration à distance, automatisation (scripts, CI/CD), transferts (SCP/SFTP), tunnels. Un port 22 ouvert sur Internet, c'est une pancarte « essayez d'entrer ! » : bots (Shodan, Masscan), brute-force 24/7, dictionnaires de mots de passe."},
   {p:"En moyenne : un serveur exposé reçoit ses premières tentatives SSH en **moins de 10 minutes**. Comptes les plus ciblés : root, admin, test, user, ubuntu, postgres, oracle. D'où l'intérêt de désactiver root en premier."}]},
  {h:"Mot de passe vs clé SSH", g:[
   {cols:[
    ["Mot de passe","le maillon faible","Réutilisé sur plusieurs services (un leak = tout tombe) · devinable (prénom+année, nom du chat) · brute-forçable par les bots · phishable (ingénierie sociale)."],
    ["Clé SSH","cryptographie asymétrique","Couple clé privée (chez vous) + clé publique (sur le serveur) · le mot de passe ne transite jamais sur le réseau · défi chiffré : le client prouve qu'il a la clé privée · une clé = une personne → révocable individuellement."]]},
   {p:"Analogie : la clé publique est un cadenas ouvert que vous donnez au serveur. Seule votre clé privée peut l'ouvrir. La **passphrase** protège la clé privée en cas de vol : du 2FA du pauvre (ce qu'on a + ce qu'on sait)."}]},
  {h:"Générer, copier, tester une clé", g:[
   {code:"# Génération (ed25519 = moderne et sûr ; sinon rsa 4096 min.)\nssh-keygen -t ed25519 -C \"admin@monserveur\"\n# Fichiers produits\n~/.ssh/id_ed25519        # clé privée : NE JAMAIS PARTAGER\n~/.ssh/id_ed25519.pub    # clé publique : à copier sur le serveur\n# Copier la clé sur le serveur (méthode simple)\nssh-copy-id -i ~/.ssh/id_ed25519.pub user@serveur\n# Permissions critiques : sinon SSH refuse la connexion\nchmod 700 ~/.ssh\nchmod 600 ~/.ssh/authorized_keys\nchmod 600 ~/.ssh/id_ed25519\n# Tester\nssh -i ~/.ssh/id_ed25519 user@serveur"},
   {p:"Impact : élimine ~90 % des attaques automatiques · plus de mot de passe à retenir · révocation propre : un collaborateur part → on supprime sa clé publique. C'est tout."}]},
  {h:"Hardening sshd_config", g:[
   {p:"Toute la config serveur est dans **/etc/ssh/sshd_config**. Attention : sshd_config = serveur (d = daemon) · ssh_config = client."},
   {code:"# === Authentification ===\nPermitRootLogin no               # plus de root en SSH\nPasswordAuthentication no        # coupe le brute-force\nPubkeyAuthentication yes         # explicite\nChallengeResponseAuthentication no\n# === Accès ===\nAllowUsers admin deployer        # liste blanche\nMaxAuthTries 3\nLoginGraceTime 30\n# === Sécurité réseau ===\nPort 2222                        # obscurité (bonus, pas sécurité)\nClientAliveInterval 300          # timeout inactivité\nClientAliveCountMax 2\nX11Forwarding no\nAllowTcpForwarding no"},
   {p:"Options PermitRootLogin : **no** (recommandé) · **prohibit-password** (root seulement par clé, ok pour Ansible) · **yes** (à éviter)."},
   {p:"Correction : ChallengeResponseAuthentication est devenu KbdInteractiveAuthentication (OpenSSH 8.7), et UsePAM no est déconseillé sur Debian."}]},
  {h:"Appliquer sans se faire enfermer dehors", g:[
   {code:"# TOUJOURS vérifier la syntaxe AVANT de redémarrer\nsudo sshd -t\n# Puis appliquer\nsudo systemctl restart sshd"},
   {def:"**Règle d'or** : gardez toujours une deuxième session SSH ouverte pendant le test. Ayez aussi un accès console de secours (Proxmox, IPMI, KVM). Si la config est cassée et que vous fermez votre session… vous êtes enfermé dehors."},
   {steps:["2 sessions ouvertes + accès console","Générer + copier la clé, tester la connexion par clé","Éditer sshd_config (root=no, PubkeyAuth=yes)","sshd -t","Restart","Tester la clé sur la 2e session avant de couper PasswordAuthentication"]}]}
 ]},
 {id:"08", t:"PAM sur Linux", sub:"auth / account / password / session : qui s'authentifie et comment", parts:[
  {h:"Pourquoi PAM existe", g:[
   {p:"Sur Linux, beaucoup de services doivent authentifier un utilisateur : SSH, sudo, login local, su, cron… Sans PAM, chaque service aurait sa propre logique, ses propres règles, ses propres bugs."},
   {def:"**PAM** (Pluggable Authentication Modules) = un système unique et cohérent pour brancher des modules d'authentification sur tout le système."},
   {p:"Analogie : PAM = un standard de prise électrique. Tous les services (SSH, sudo, login…) utilisent le même « branchement » pour authentifier."}]},
  {h:"Les 4 types de modules", g:[
   {kv:[
    ["auth","Qui es-tu ? Vérifier l'identité (mot de passe, clé, MFA…)"],
    ["account","As-tu le droit d'entrer ? Compte expiré, groupe, horaires"],
    ["password","Ton nouveau mot de passe est-il assez fort ? Règles de complexité"],
    ["session","Que fait-on à l'ouverture/fermeture ? Logs, quotas, variables"]]},
   {h:"Exemple terrain : connexion SSH", steps:[["auth","PAM vérifie l'identité (mot de passe / clé)"],["account","Compte autorisé, non expiré"],["session","Applique les limites et journalise"]]},
   {p:"Même logique pour sudo ou login console : c'est la force de PAM."}]},
  {h:"Modules courants & emplacement de la config", g:[
   {kv:[
    ["pam_unix","Auth locale (passwd/shadow)"],["pam_ldap / pam_sss","Annuaire (LDAP, AD)"],["pam_faillock","Verrouillage après échecs"],["pam_pwquality","Complexité mot de passe"],
    ["pam_limits","Quotas / limites ressources"],["pam_wheel","Restreindre su à un groupe"],["pam_time","Restriction horaire"]]},
   {code:"/etc/pam.d/\n├── sshd        # SSH\n├── login       # login console\n├── sudo        # sudo\n├── su          # su\n└── common-*    # règles Debian"},
   {p:"Un module = une seule tâche. On les chaîne pour construire une politique."}]},
  {h:"Anatomie d'une ligne PAM", g:[
   {code:"type   control    module        [arguments]\n# Exemple :\nauth   required   pam_unix.so   # auth obligatoire via pam_unix"},
   {kv:[
    ["required","Obligatoire, mais continue la chaîne même si échec (l'utilisateur ne saura pas quelle règle a échoué)"],
    ["requisite","Obligatoire, stop immédiat si échec"],
    ["sufficient","Suffit si succès (court-circuite la suite)"],
    ["optional","Pris en compte seulement si aucun autre n'a tranché"]]},
   {p:"Piège classique : confondre **required** et **requisite** : comportement très différent."}]},
  {h:"Cas pratique : mot de passe & verrouillage", g:[
   {code:"# /etc/pam.d/common-password (Debian) : complexité\npassword required pam_pwquality.so minlen=12 ucredit=-1 lcredit=-1 dcredit=-1 ocredit=-1\npassword required pam_unix.so use_authtok sha512\n\n# /etc/pam.d/sshd : verrouillage après 5 échecs, déverrouille au bout de 5 min\nauth    required          pam_faillock.so preauth silent deny=5 unlock_time=300\nauth    required          pam_unix.so\nauth    [default=die]     pam_faillock.so authfail deny=5 unlock_time=300\naccount required          pam_unix.so\nsession required          pam_limits.so\n\n# Gestion du verrouillage\nfaillock --user admin           # voir l'état\nfaillock --user admin --reset   # déverrouiller"},
   {p:"Traduction pwquality : minlen=12 · ucredit=-1 ≥ 1 majuscule · lcredit=-1 ≥ 1 minuscule · dcredit=-1 ≥ 1 chiffre · ocredit=-1 ≥ 1 caractère spécial."},
   {p:"**pam_wheel**, classique du hardening : seuls les membres du groupe wheel peuvent utiliser su."},
   {p:"Erreurs à éviter : modifier /etc/pam.d/sshd sans garder une session ouverte · empiler les modules sans comprendre l'ordre · oublier l'accès console de secours · tester en prod sans validation locale. Toujours un accès de secours quand on touche à PAM."}]}
 ]},
 {id:"09", t:"Logs, fail2ban & port-knocking", sub:"Voir, bloquer, masquer : last/lastb, jails, knockd, SPA", parts:[
  {h:"Voir, bloquer, masquer : 3 couches complémentaires", g:[
   {steps:[["Voir","Ce qui se passe (logs)"],["Réagir","Aux abus (fail2ban)"],["Réduire","Les points d'entrée visibles (port-knocking)"]]},
   {p:"Aucun ne remplace les deux autres : ils se complètent."}]},
  {h:"Logs de connexion : last et lastb", g:[
   {kv:[
    ["/var/log/wtmp · last","Connexions réussies (qui, d'où, quand, combien de temps)"],
    ["/var/log/btmp · lastb","Connexions échouées : les tentatives d'intrusion"],
    ["/var/log/auth.log","Détail des authentifications (Debian/Ubuntu)"],
    ["/var/log/secure","Idem, sur RHEL/CentOS"]]},
   {code:"last                     # dernières connexions\nlast -n 10               # 10 dernières connexions\nlast admin               # connexions d'un utilisateur\nlast -a                  # IPs complètes, pas tronquées\nsudo lastb               # échecs (root ssh:notty, IPs suspectes)\nsudo tail -f /var/log/auth.log | grep \"Failed password\""},
   {p:"Signaux d'attaque : rafales d'échecs sur root/admin, mêmes IPs qui reviennent en boucle, tentatives à 3 h du matin depuis des pays lointains. Lire les logs, c'est déjà se défendre."}]},
  {h:"fail2ban : le garde-barrière automatique", g:[
   {def:"**fail2ban** surveille les logs. Quand un comportement suspect dépasse un seuil, il ajoute une règle firewall (iptables/nftables) pour bannir l'IP."},
   {kv:[["Filter","Une regex qui matche les lignes suspectes (<HOST> = IP à bannir)"],["Jail","Filter + seuil + durée de ban + action"],["Action","Ce qui se passe (ban firewall, mail, script)"]]},
   {p:"À NE JAMAIS modifier : **jail.conf** (écrasé à la mise à jour). Toujours travailler dans **/etc/fail2ban/jail.local** ou jail.d/."},
   {code:"# /etc/fail2ban/jail.local\n[DEFAULT]\nbantime  = 10m\nfindtime = 10m\nmaxretry = 5\nbanaction = iptables-multiport\nignoreip = 127.0.0.1/8 ::1 192.168.1.0/24   # ne jamais se bannir soi-même !\n\n[sshd]\nenabled  = true\nport     = ssh\nfilter   = sshd\nlogpath  = /var/log/auth.log\nmaxretry = 3\nbantime  = 1h\nfindtime = 10m\n\n# Ban progressif : récidivistes\n[recidive]\nenabled  = true\nlogpath  = /var/log/fail2ban.log\nfilter   = recidive\nbantime  = 1w\nfindtime = 1d\nmaxretry = 3\n\n# Gestion\nsudo fail2ban-client status              # statut général\nsudo fail2ban-client status sshd         # statut d'un jail\nsudo fail2ban-client set sshd banip <IP>\nsudo fail2ban-client set sshd unbanip <IP>"},
   {p:"fail2ban n'est PAS : un pare-feu complet · un correctif pour une config SSH fragile · une protection contre le DDoS distribué (1 000 IPs différentes). C'est une couche, pas la défense."}]},
  {h:"Port-knocking : rendre un service invisible", g:[
   {def:"Le **port-knocking** = ouvrir un port uniquement après une séquence précise de connexions sur d'autres ports. Tant que la séquence n'est pas faite, le port n'existe pas pour l'extérieur."},
   {p:"Analogie : un mot de passe secret pour entrer dans un speakeasy. Toc… toc-toc… toc. Sans le rythme, on ne sait même pas qu'il y a un bar derrière la porte."},
   {code:"# /etc/knockd.conf\n[options]\n    UseSyslog\n[openSSH]\n    sequence    = 7000,8000,9000\n    seq_timeout = 5\n    command     = /sbin/iptables -A INPUT -s %IP% -p tcp --dport 22 -j ACCEPT\n    tcpflags    = syn\n[closeSSH]\n    sequence    = 9000,8000,7000\n    seq_timeout = 5\n    command     = /sbin/iptables -D INPUT -s %IP% -p tcp --dport 22 -j ACCEPT\n    tcpflags    = syn\n\n# SSH doit être fermé par défaut (garder une console de secours !)\nsudo iptables -A INPUT -p tcp --dport 22 -j DROP\n# Côté client\nknock serveur 7000 8000 9000 && ssh admin@serveur\nknock serveur 9000 8000 7000     # refermer après usage"},
   {p:"Correction : la règle ACCEPT ajoutée avec -A après un DROP n'est jamais atteinte (iptables lit les règles dans l'ordre). Il faut l'insérer en tête avec -I : /sbin/iptables -I INPUT -s %IP% …"},
   {cols:[
    ["Avantages","","Élimine le bruit des scans automatiques · SSH n'apparaît pas dans les scans · simple, compatible avec fail2ban et les clés."],
    ["Inconvénients","","Séquence en clair sur le réseau (interceptable) · client knock pas toujours dispo (WiFi hôtel, mobile) · vulnérable au rejeu de séquence capturée · complexité opérationnelle → risque de s'enfermer dehors."]]},
   {p:"Alternative plus solide : **SPA** (Single Packet Authorization) avec **fwknop** : un seul paquet chiffré, protection contre le rejeu (nonce + timestamp)."}]},
  {h:"Le trio gagnant en production", g:[
   {kv:[
    ["Clés SSH (fiche 07)","Empêche le brute-force à la source"],
    ["fail2ban","Bannit les IPs abusives automatiquement"],
    ["Port-knocking","Masque le service (option, sur environnement sensible)"],
    ["Logs (last/lastb)","Vérifient que tout tient"]]},
   {p:"À retenir : les trois se complètent, aucun ne se remplace. Une bonne défense = plusieurs couches simples plutôt qu'une seule complexe."}]}
 ]}
,{id:"10", t:"IDS / IPS : Suricata & Wazuh", sub:"Détecter, alerter, bloquer : NIDS/HIDS, règles, EVE JSON, FIM, Active Response", parts:[
  {h:"IDS vs IPS : la nuance qui change tout", g:[
   {cols:[
    ["IDS","Intrusion Detection System","Passif : observe le trafic, alerte mais ne bloque pas. Analogie : la caméra de surveillance. Elle voit, elle enregistre, elle sonne, mais ne ferme pas la porte."],
    ["IPS","Intrusion Prevention System","Inline : le trafic passe par lui. Détecte et bloque en temps réel. Analogie : le vigile à l'entrée. Il voit, il alerte, et il bloque physiquement."]]},
   {table:{head:["","Réseau","Host"], rows:[
    ["Détection","NIDS : surveille le trafic (souvent sur port miroir d'un switch)","HIDS : agent installé sur la machine (logs, intégrité fichiers)"],
    ["Prévention","NIPS : en coupure sur le lien","HIPS : bloque au niveau du système"]]}},
   {p:"Méthodes de détection : **signatures** (motifs connus, ex : hash malware) · **anomalies** (écart par rapport au comportement normal) · **politiques** (règles métier)."}]},
  {h:"Suricata : NIDS/NIPS open-source", g:[
   {def:"**Suricata** = moteur NIDS/NIPS open-source (GPL), développé par l'OISF, souvent présenté comme le successeur moderne de Snort. Multi-thread (performant sur gros trafic), inspection protocolaire (HTTP, TLS, DNS, SMB, SSH), logs en EVE JSON. Recommandé par l'ANSSI."},
   {kv:[["IDS (af-packet passif)","Écoute sur port miroir : alerte seulement"],["IPS (nfqueue / af-packet inline)","En coupure : peut drop les paquets"],["Offline (pcap)","Analyse à froid d'une capture réseau"]]},
   {h:"Anatomie d'une règle Suricata", code:"alert http $HOME_NET any -> $EXTERNAL_NET any (msg:\"Possible webshell\"; \\\n    content:\"cmd.exe\"; http_uri; sid:1000001; rev:1;)\n# action proto source direction destination (options)"},
   {kv:[["alert","Log une alerte, ne bloque pas"],["drop","Bloque silencieusement (mode IPS)"],["reject","Bloque et envoie un RST/ICMP"],["pass","Laisse passer explicitement"]]},
   {p:"Sources de règles : ET Open (gratuit), ET Pro (payant), règles maison, gestion via suricata-update. Logs : **eve.json**, facile à ingérer dans un SIEM."}]},
  {h:"Wazuh : HIDS + SIEM open-source", g:[
   {def:"**Wazuh** = plateforme HIDS + SIEM open-source, fork moderne d'OSSEC. Trois composants : **Manager** (le cerveau), **Agent** (sur chaque host), **Dashboard** (basé sur OpenSearch)."},
   {h:"Ce que Wazuh fait sur chaque host", kv:[
    ["FIM (File Integrity Monitoring)","Alerte si /etc/passwd, /etc/shadow, /etc/ssh/sshd_config ou /var/www/ sont modifiés"],
    ["Log collection","Syslog, journald, logs applicatifs"],
    ["System inventory","Paquets installés, ports ouverts, utilisateurs"],
    ["Vulnerability detection","Croise l'inventaire avec les CVE"],
    ["SCA (Security Configuration Assessment)","Audit CIS Benchmark"]]},
   {p:"**Active Response** : réactions automatisées (ex. : bloquer une IP dans iptables/firewalld, désactiver un compte compromis). Règles au format XML, décodeurs par source, corrélation multi-hosts côté Manager."},
   {p:"Le côté HIDS voit ce qui se passe **sur la machine** (fichiers, processus, comptes), là où Suricata voit ce qui passe **sur le fil**."}]},
  {h:"Suricata + Wazuh : la vision 360°", g:[
   {p:"Suricata voit le trafic réseau · Wazuh voit ce qui se passe sur les machines. Combinés, on couvre le fil et l'host. Wazuh peut ingérer les logs eve.json de Suricata comme n'importe quelle autre source."},
   {table:{head:["Étape","Ce qui se passe","Ce qui détecte / réagit"], rows:[
    ["1","Scan de ports depuis l'extérieur","Suricata : alerte « port scan »"],
    ["2","Exploit d'une faille web","Suricata : signature « SQLi / RCE » → alerte (ou drop en IPS)"],
    ["3","Dépôt d'un webshell dans /var/www/","Wazuh FIM : nouveau fichier suspect → alerte"],
    ["4","L'attaquant tente d'exécuter des commandes","Wazuh Active Response : bloque l'IP source, désactive le compte"],
    ["5","Analyse post-mortem","Tout est dans le Dashboard Wazuh (eve.json + logs host corrélés)"]]}}]},
  {h:"Bonnes pratiques & acronymes", g:[
   {def:"**Démarrer en mode IDS** : on écoute, on calibre les règles, on chasse les faux positifs. On ne passe en IPS (drop) qu'une fois les règles fiables, sinon on coupe du trafic légitime. Ennemi n°1 : l'alert fatigue."},
   {p:"**Placement** : NIDS/NIPS derrière le pare-feu de périmètre + agents HIDS sur tous les serveurs critiques."},
   {kv:[["IDS / IPS","Intrusion Detection / Prevention System"],["NIDS / HIDS","Network IDS · Host IDS"],["FIM","File Integrity Monitoring"],["SCA","Security Configuration Assessment"],["EVE","Extensible Event format (JSON) : format de log Suricata"],["OISF","Open Information Security Foundation (édite Suricata)"]]}]}
 ]},
 {id:"11", t:"Reverse-proxy, load-balancer & HTTPS", sub:"TLS, Nginx/Apache reverse-proxy, HAProxy : point d'entrée unique et résilient", parts:[
  {h:"HTTPS / TLS : pourquoi le cadenas compte", g:[
   {p:"**HTTP** (port 80) : tout transite en clair (identifiants, mots de passe, données perso : MITM facile). **HTTPS** (port 443) = HTTP + TLS (successeur de SSL)."},
   {h:"Handshake TLS en 30 s", steps:["Client → port 443","Le serveur envoie son certificat (clé publique)","Le client vérifie qu'il est signé par une CA de confiance","Négociation d'une clé de session (chiffrement symétrique)","Échanges chiffrés"]},
   {kv:[["Auto-signé","Lab, dev · avertissement navigateur"],["Let's Encrypt","Gratuit, automatisé, reconnu · renouvellement 90 j"],["Commercial","Entreprises, e-commerce · reconnu + garantie"]]},
   {code:"# Let's Encrypt + Certbot : HTTPS automatique\nsudo apt install certbot python3-certbot-nginx\nsudo certbot --nginx -d monsite.example.com\nsudo certbot renew\n# Certificat auto-signé (lab)\nopenssl req -x509 -nodes -days 365 -newkey rsa:2048 \\\n    -keyout web.key -out web.crt \\\n    -subj \"/C=FR/O=Lab/CN=web.lab.local\""}]},
  {h:"Reverse-proxy : point d'entrée unique", g:[
   {p:"Sans : chaque serveur exposé, un certificat par serveur, aucun contrôle central. Avec : un seul point d'entrée, un seul certificat, back-ends cachés. Analogie : la réceptionniste d'un hôtel. Le client parle à la réception, qui transmet au bon service ; il n'accède jamais aux coulisses."},
   {table:{head:["","Forward proxy","Reverse proxy"], rows:[["Côté","Client","Serveur"],["Protège","Les clients","Les serveurs"],["Exemple","Squid en entreprise","Nginx devant Apache"]]}},
   {def:"**Terminaison TLS** : HTTPS client ↔ proxy · HTTP proxy ↔ back-ends. Un seul cert, back-ends simples, moins de CPU dessus. Autres bénéfices : cache, compression gzip/brotli, logs centralisés."},
   {code:"# Nginx : reverse-proxy avec terminaison TLS\nserver { listen 80; return 301 https://$host$request_uri; }   # HTTP -> HTTPS\nserver {\n    listen 443 ssl;\n    ssl_certificate     /etc/nginx/ssl/proxy.crt;\n    ssl_certificate_key /etc/nginx/ssl/proxy.key;\n    ssl_protocols       TLSv1.2 TLSv1.3;\n    location / {\n        proxy_pass http://10.0.0.20;                 # HTTP vers back-end\n        proxy_set_header Host              $host;\n        proxy_set_header X-Real-IP         $remote_addr;   # IP réelle du client\n        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n    }\n}\n# Apache équivalent : a2enmod proxy proxy_http ssl ; ProxyPass / http://10.0.0.20/"},
   {p:"Sans X-Real-IP / X-Forwarded-For : le back-end croit que tout vient du proxy (logs faussés, rate-limit cassé, géo-IP inutile). En pratique : Nginx est préféré à Apache comme reverse-proxy (plus léger, plus performant)."}]},
  {h:"Load-balancer : charge répartie, HA", g:[
   {p:"Un seul serveur = capacité limitée → il rame ou tombe. Le **load-balancer** distribue les requêtes entre plusieurs back-ends. Un serveur tombe ? Les autres prennent le relais : haute disponibilité."},
   {table:{head:["Algorithme","Fonctionnement","Usage"], rows:[
    ["Round Robin","Chaque serveur à tour de rôle","Serveurs identiques"],
    ["Least Connections","Vers le moins chargé","Requêtes de durée variable"],
    ["Source (IP Hash)","Même IP → même serveur","Sessions persistantes"],
    ["Weighted RR","Round Robin pondéré","Capacités différentes"]]}},
   {p:"Load-balancer = reverse-proxy + répartition, health checks, haute disponibilité."}]},
  {h:"HAProxy : le standard open-source", g:[
   {p:"Load-balancer + reverse-proxy, très performant. Utilisé par GitHub, Stack Overflow, Reddit. Supporte HTTP, HTTPS, TCP. Config en 4 sections : **global, defaults, frontend** (entrée), **backend** (serveurs)."},
   {code:"global\n    log /dev/log local0\n    maxconn 2000\ndefaults\n    mode    http\n    option  httplog\n    option  forwardfor\n    timeout connect 5s\n    timeout client  50s\n    timeout server  50s\nfrontend https_front\n    bind *:443 ssl crt /etc/haproxy/ssl/proxy.pem\n    default_backend web_servers\n    stats enable\n    stats uri /stats\n    stats auth admin:password\nbackend web_servers\n    balance roundrobin\n    option httpchk GET /\n    http-check expect status 200\n    server web1 10.0.0.20:80 check inter 5s fall 3 rise 2\n    server web2 10.0.0.21:80 check inter 5s fall 3 rise 2\n    server web3 10.0.0.22:80 check inter 5s fall 3 rise 2\n# .pem HAProxy = crt + key concaténés\ncat proxy.crt proxy.key > /etc/haproxy/ssl/proxy.pem && chmod 600 /etc/haproxy/ssl/proxy.pem"},
   {kv:[["option httpchk GET /","Health check : envoie un GET au back-end"],["check inter 5s","Vérifie toutes les 5 s"],["fall 3 / rise 2","3 échecs = DOWN · 2 succès = UP"]]},
   {p:"Page **/stats** : état vert/rouge de chaque serveur, requêtes/temps de réponse, connexions actives : indispensable pour monitoring & debug. Un serveur tombe → exclu automatiquement · revient → réintégré automatiquement."}]},
  {h:"Récap : les 3 briques et leurs outils", g:[
   {table:{head:["Brique","Rôle","Outil de référence"], rows:[
    ["HTTPS / TLS","Chiffre client ↔ serveur","Certbot / Let's Encrypt"],
    ["Reverse-proxy","Point d'entrée unique, terminaison TLS, masque back-ends","Nginx (ou Apache)"],
    ["Load-balancer","Répartition + health checks + HA","HAProxy"]]}},
   {p:"Les 3 briques se combinent : HAProxy termine le TLS, répartit vers plusieurs Nginx, qui parlent aux back-ends applicatifs. Vue de l'extérieur : une seule IP, un seul certificat."}]}
 ]}
,{id:"12", t:"SSO & IAM", sub:"Keycloak, SAML / OAuth 2.0 / OIDC, JWT : centraliser identités et accès", parts:[
  {h:"Pourquoi SSO + IAM : l'identité fragmentée", g:[
   {p:"10 applications, 10 comptes : Soleil2024! ici, Admin123 là, le même mot de passe recyclé pour la 3e app, le Post-it sous le clavier pour la 4e… Et quand un collaborateur part : pense-t-on à désactiver tous ses comptes ?"},
   {kv:[["Sécurité","Mots de passe réutilisés, partagés, faibles"],["Opérationnel","Onboarding/offboarding × N applis"],["Audit","Impossible de savoir qui a accédé à quoi"],["Conformité","RGPD, ISO 27001 exigent la traçabilité"]]},
   {p:"RADIUS (vu avec le WiFi) centralise l'auth réseau (Wi-Fi, VPN, 802.1X), mais pas les applis web / API / SaaS. D'où SSO + IAM."}]},
  {h:"SSO vs IAM : le mécanisme et la gouvernance", g:[
   {cols:[
    ["SSO","Single Sign-On","Une seule authentification pour accéder à toutes les applis. Analogie : le badge qui ouvre toutes les portes du bâtiment."],
    ["IAM","Identity & Access Management","Qui accède à quoi · comment (MFA) · quand (expiration) · d'où (IP) · audit complet."]]},
   {p:"**SSO = mécanisme de connexion · IAM = gouvernance des accès.**"},
   {h:"Les 3 rôles du SSO", steps:[["Utilisateur","Veut accéder à une application (Service Provider)"],["Application","Redirige vers l'IdP (Identity Provider, ex. Keycloak)"],["IdP","Authentifie (login + MFA), émet un token ; l'app le valide → connexion. L'app ne voit jamais le mot de passe"]]},
   {p:"**Fédération d'identités** : un seul IdP → N applis. Ajouter un user dans Keycloak → accès partout. Désactiver → accès révoqué partout, immédiatement."}]},
  {h:"Les protocoles : SAML, OAuth 2.0, OIDC", g:[
   {def:"Confusion fréquente : « OAuth 2.0, c'est pour l'authentification » → **NON**. OAuth = **autorisation** (« que peut faire cette app ? »). OpenID Connect = **authentification** (« qui est cet utilisateur ? »)."},
   {table:{head:["Protocole","Usage","Format","Terrain"], rows:[
    ["SAML 2.0","Auth + fédération (2005)","XML signé","Applis d'entreprise historiques"],
    ["OAuth 2.0","Autorisation API (2012)","Access Token (JWT)","APIs, apps mobiles"],
    ["OpenID Connect","Authentification moderne (2014)","JWT obligatoire","Apps web modernes"]]}},
   {p:"**OIDC = OAuth 2.0 + identité + standardisation** : ajoute un ID Token (JWT), les endpoints /userinfo, /.well-known/openid-configuration. Standard de fait aujourd'hui."},
   {code:"# JWT = Header.Payload.Signature (base64)\neyJhbGciOiJSUzI1NiJ9.eyJzdWIiOiJhbGljZSIsInJvbGVzIjpbImFkbWluIl19.signature\n#   Header (algo)       Payload (claims)                         Signature RSA\n\n# Payload décodé (ID Token OIDC)\n{ \"sub\": \"alice-123\", \"email\": \"alice@entreprise.com\",\n  \"roles\": [\"admin\", \"user\"],\n  \"iss\": \"https://keycloak.exemple.com/realms/monrealm\",\n  \"exp\": 1740000000 }"},
   {p:"L'app vérifie la signature avec la clé publique de l'IdP → pas besoin d'appeler l'IdP à chaque requête."}]},
  {h:"Les IdP du marché", g:[
   {kv:[
    ["Keycloak","Red Hat, open-source, référence. SAML + OAuth + OIDC + LDAP/AD, MFA (TOTP, WebAuthn), rôles/groupes/policies fines"],
    ["Authentik","Open-source Python/Django, plus simple à déployer (Docker natif). Autorisation moins avancée que Keycloak"],
    ["Okta / Auth0","SaaS, riche en intégrations : grandes entreprises · devs/APIs"],
    ["Azure AD / Entra ID","Écosystème Microsoft"]]},
   {p:"Cloud : simplicité + scalabilité, mais dépendance externe et coût. Keycloak : contrôle total, auto-hébergé."}]},
  {h:"Keycloak en pratique", g:[
   {code:"# Déploiement rapide : Docker (tests)\nservices:\n  keycloak:\n    image: quay.io/keycloak/keycloak:26.5.4\n    environment:\n      KC_BOOTSTRAP_ADMIN_USERNAME: admin\n      KC_BOOTSTRAP_ADMIN_PASSWORD: admin\n    command: start-dev\n    ports: [\"8080:8080\"]\n\n# Production : HTTPS obligatoire\n/opt/keycloak/bin/kc.sh start \\\n    --hostname=keycloak.exemple.com \\\n    --https-certificate-file=/etc/ssl/cert.pem \\\n    --https-certificate-key-file=/etc/ssl/key.pem"},
   {kv:[
    ["Realm","Espace isolé (tenant). master réservé à l'admin · 1 realm par organisation/environnement"],
    ["Client","Une application qui délègue l'auth (nextcloud, jenkins, glpi…)"],
    ["User / Group / Role","Compte · ensemble d'utilisateurs · permission ou niveau d'accès"]]},
   {table:{head:["Type de client OIDC","Usage","Secret ?"], rows:[
    ["Public","Mobile, SPA (sans backend)","Non : PKCE obligatoire"],
    ["Confidential","Apps backend (web, API)","Oui (client_secret)"],
    ["Bearer-only","APIs pures (vérifient les tokens)","Non"]]}},
   {p:"Bonnes pratiques : **start-dev** uniquement en tests (pas d'HTTPS, pas de cache distribué) · affecter les rôles aux **groupes**, pas directement aux utilisateurs · activer la MFA (TOTP) dans Authentication → Flows → Browser · un realm par organisation."}]}
 ]},
 {id:"14", t:"DDoS, SynFlood & rate-limiting", sub:"Absorber plutôt que bloquer : SYN cookies, iptables, Nginx limit_req, HAProxy stick-tables", parts:[
  {h:"Le scénario 14 h : on sature un serveur", g:[
   {p:"14h00 → 50 req/s (normal) · 14h01 → 200 req/s · 14h02 → 800 req/s (saturation) · 14h03 → le site ne répond plus. Côté serveur : chaque requête = un thread = ~10 Mo RAM. À 800 threads, les 8 Go sont pris : les requêtes suivantes sont refusées, les vrais utilisateurs timeout. Capacité finie, exploitée par l'attaquant."}]},
  {h:"Anatomie d'une DDoS", g:[
   {kv:[["DoS","Une seule source → facile à bannir (une IP)"],["DDoS","Botnet : 1 000+ sources × 10 Mbps = 10 Gbps. Bots = IoT mal sécurisés (caméras IP, NAS, smartphones…)"]]},
   {table:{head:["Couche","Catégorie","Exemples"], rows:[
    ["L3/L4","Volumétrique","UDP Flood, ICMP Flood : sature la bande passante (Tbps)"],
    ["L4","Protocole","SynFlood, ACK Flood : épuise les tables de connexion (Mpps)"],
    ["L7","Applicatif","HTTP Flood, Slowloris : les plus sournoises, trafic HTTP d'apparence légitime"]]}},
   {p:"Records : GitHub 2018 → 1,35 Tbps (Memcached) · OVHcloud 2020 → 1,1 Tbps (caméras IP) · Cloudflare 2023 → 71 M req/s."},
   {def:"**Mitigation ≠ protection** : protection = empêcher l'attaque d'arriver (CDN, scrubbing) · mitigation = réduire l'impact (rate-limiting, ban IP). **On ne supprime jamais une DDoS : on l'absorbe.** Le pare-feu L3/L4 ne voit pas le contenu HTTP : il ne distingue pas 1 000 requêtes légitimes de 1 000 requêtes d'attaque."}]},
  {h:"Les 4 couches de défense", g:[
   {steps:[["CDN / Scrubbing (Cloudflare…)","Absorbe le volume (L3/L4)"],["Firewall L3/L4 + iptables/nftables","Bloque IPs, SynFlood"],["Reverse-proxy (Nginx / HAProxy)","Rate-limiting par IP (L7)"],["Application","Validation métier"]]},
   {p:"Chaque couche arrête ce qu'elle peut voir : ensemble, elles couvrent tout le spectre."}]},
  {h:"Couche OS : contrer le SynFlood", g:[
   {p:"Rappel 3-way handshake : client → SYN → serveur (table LISTEN) → SYN-ACK → client → ACK → ESTABLISHED. La table a une taille limitée. **SynFlood** : l'attaquant envoie des SYN avec des IPs forgées → les SYN-ACK partent dans le vide, la table reste pleine, les vrais clients sont rejetés."},
   {code:"# Contre-mesure 1 : SYN cookies (pas de table = pas de saturation)\nsudo sysctl -w net.ipv4.tcp_syncookies=1\nsudo sysctl -w net.ipv4.tcp_max_syn_backlog=4096\nsudo sysctl -w net.ipv4.tcp_synack_retries=2\n# Rendre permanent dans /etc/sysctl.conf\n\n# Contre-mesure 2 : limiter les SYN par IP (iptables hashlimit)\niptables -A INPUT -p tcp --syn \\\n    -m hashlimit --hashlimit-name syn_limit \\\n    --hashlimit 10/sec --hashlimit-burst 20 --hashlimit-mode srcip \\\n    -j ACCEPT\niptables -A INPUT -p tcp --syn -j DROP\n\n# Contre-mesure 3 : nftables (moderne)\ntable inet filter {\n    chain input {\n        type filter hook input priority 0; policy drop;\n        tcp flags syn limit rate over 10/second drop\n        ct state established,related accept\n        tcp dport { 22, 80, 443 } accept\n    }\n}"}]},
  {h:"Couche L7 : rate-limiting Nginx & HAProxy", g:[
   {p:"Le rate-limiting ne stoppe pas l'attaque, il la rend inoffensive pour les autres : l'attaquant est quota-limité, les vrais utilisateurs passent."},
   {code:"# ===== Nginx : limit_req_zone =====\nhttp {\n    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;\n    limit_req_zone $binary_remote_addr zone=login:1m rate=1r/s;\n}\nserver {\n    location / {\n        limit_req zone=general burst=20 nodelay;   # burst = pic absorbé\n        limit_req_status 429;                      # 429 Too Many Requests\n        proxy_pass http://backend;\n    }\n    location /login {\n        limit_req zone=login burst=5;              # zone stricte\n        proxy_pass http://backend;\n    }\n}\n# ===== HAProxy : stick-tables =====\nfrontend http-in\n    bind *:80\n    stick-table type ip size 100k expire 60s \\\n        store http_req_rate(60s),conn_cur\n    http-request track-sc0 src\n    http-request deny if { sc_http_req_rate(0) gt 100 }       # > 100 req/min → deny\n    tcp-request connection reject if { sc_conn_cur(0) gt 20 } # anti-SynFlood L4"},
   {p:"**burst / nodelay** : burst=20 absorbe un pic (un user charge une page avec 20 ressources) · nodelay traite le burst immédiatement sans mise en file. maxconn global HAProxy protège les ressources système (ex. 10 000)."}]},
  {h:"Tester sa protection & outils", g:[
   {code:"# ApacheBench : 1000 requêtes, 50 simultanées\nab -n 1000 -c 50 http://localhost/\n# On veut voir : \"Failed requests: 312\" (= rate-limit fonctionne)\n# Siege : 100 users pendant 30 s\nsiege -c 100 -t 30s http://localhost/\n# Observation en temps réel\ntail -f /var/log/nginx/access.log | grep \" 429 \"\nss -s     # nombre de connexions actives"},
   {def:"À retenir : **une DDoS ne se bloque pas, elle s'absorbe.** Défense multi-couches obligatoire : CDN/scrubbing pour le volume, SYN cookies + rate-limit L4 au noyau, limit_req / stick-tables L7 au reverse-proxy, et des tests de charge pour vérifier que ça tient."}]}
 ]},
 {id:"15", t:"WAF : Web Application Firewall", sub:"ModSecurity + OWASP CRS, Cloudflare : filtrer le HTTP malveillant", parts:[
  {h:"Pourquoi un WAF : là où le firewall est aveugle", g:[
   {def:"Un pare-feu L3/L4 filtre sur IP, port, protocole, mais le port 443 est ouvert partout, et injection SQL, XSS, path traversal transitent toutes en HTTP. Le **WAF** inspecte le contenu applicatif (URL, headers, body, cookies)."},
   {p:"Analogie : le WAF, c'est le videur à l'entrée du club. Il inspecte chaque client avant de le laisser entrer : pas juste sa carte d'identité (port/IP), mais ce qu'il porte sur lui (contenu HTTP)."},
   {table:{head:["OWASP","Catégorie","Exemple"], rows:[

    ["A03","Injection","' OR 1=1 -- dans un formulaire"],

    ["A07","Authentification défaillante","Brute force, session fixation"],
    ["A09","Journalisation insuffisante","Attaque non détectée"]]}},
   {p:"Toutes ces attaques transitent par HTTP/HTTPS : elles passent le firewall et atteignent le backend sans WAF."},
   {p:"Correction (mise à jour) : ce classement est l'OWASP Top 10 2021. L'édition 2025 place A01 Contrôle d'accès, A02 Mauvaise configuration, A03 Chaîne d'approvisionnement logicielle, A04 Cryptographie, A05 Injection… et ajoute A10 Gestion des conditions exceptionnelles."}]},
  {h:"Place dans l'architecture & types", g:[
   {code:"Internet → [Firewall L3/L4] → [WAF L7] → [Reverse-proxy] → [App] → [BDD]\n             filtre IP/port    contenu HTTP   Nginx/HAProxy"},
   {table:{head:["Type de WAF","Exemples","Avantage / limite"], rows:[
    ["Réseau (appliance)","F5 BIG-IP, FortiWeb","Performances, dédié · coût élevé"],
    ["Hôte (logiciel)","ModSecurity, NAXSI","Gratuit, contrôle total · charge sur le serveur"],

  {h:"ModSecurity + OWASP CRS : le combo open-source", g:[
   {p:"**ModSecurity v3** (OWASP, 2002) : module WAF pour Nginx (libnginx-mod-http-modsecurity) et Apache (libapache2-mod-security2). Compatible avec l'**OWASP Core Rule Set (CRS)** : ~200 règles couvrant l'OWASP Top 10."},
   {code:"# Installation Nginx + ModSecurity\nsudo apt install -y nginx libnginx-mod-http-modsecurity\nsudo cp /etc/modsecurity/modsecurity.conf-recommended \\\n        /etc/modsecurity/modsecurity.conf\n# modsecurity.conf : paramètres clés\nSecRuleEngine DetectionOnly          # ← commencer ici !\nSecRequestBodyLimit 13107200\nSecAuditLog /var/log/modsecurity/audit.log\nSecAuditLogParts ABCIJDEFHKZ\n# Activer dans un vhost Nginx\nserver {\n    listen 80;\n    modsecurity on;\n    modsecurity_rules_file /etc/nginx/modsecurity/main.conf;\n    location / { proxy_pass http://localhost:8080; }\n}\n# Installer l'OWASP CRS\ncd /tmp && wget https://github.com/coreruleset/coreruleset/archive/v4.0.0.tar.gz\ntar -xzf v4.0.0.tar.gz\nsudo mv coreruleset-4.0.0 /etc/modsecurity/crs\nsudo cp /etc/modsecurity/crs/crs-setup.conf.example \\\n        /etc/modsecurity/crs/crs-setup.conf"},
   {h:"Structure du CRS", kv:[["REQUEST-920","Anomalies protocole HTTP"],["REQUEST-930 / 931","LFI (Local File Inclusion) / RFI"],["REQUEST-932 / 933","Injection commandes OS / PHP"],["REQUEST-941 / 942","XSS / SQLi"],["RESPONSE-950","Fuites de données en sortie"]]},
   {def:"**Score d'anomalie** : chaque règle matchée ajoute des points. Seuil par défaut : **5 points** → requête bloquée. Avantage : une seule signature incertaine ne bloque pas, il faut plusieurs indices (anti faux-positif)."},
   {code:"# Tester (SQLi, XSS) : attendu 403 Forbidden en mode On\ncurl \"http://localhost/?id=1' OR '1'='1\"\ncurl \"http://localhost/?q=<script>alert(1)<\/script>\"\nsudo tail -f /var/log/modsecurity/audit.log\n# Gérer un faux positif : désactiver une règle pour un chemin\nSecRule REQUEST_URI \"@beginsWith /api/upload\" \\\n    \"id:1001,phase:1,pass,nolog,ctl:ruleRemoveById=942100\""}]},
  {h:"Cloudflare : WAF cloud + CDN + anti-DDoS", g:[

   {code:"Visiteur (Paris) → [Cloudflare PoP Paris]   ← le trafic s'arrête ici\n                    • Anti-DDoS  • WAF\n                    • CDN cache  • Bot Mgmt\n                         ↓ seulement si OK\n                  [Serveur d'origine]"},
   {p:"Activation : on change les nameservers du domaine chez le registrar vers ceux de Cloudflare → tout le trafic passe par Cloudflare → l'IP réelle est masquée."},
   {kv:[["CDN","Cache statique sur les PoP · latence Tokyo→serveur Paris passe de 200 ms à 5 ms · gratuit, illimité"],["WAF","Règles managées + custom · activable en 1 clic"],["DDoS","Protection volumétrique auto (jusqu'à plusieurs Tbps)"]]},
   {def:"**WAF vs firewall réseau** : ne pas confondre. Le WAF ne remplace pas le firewall L3/L4 ; ils sont complémentaires. Le firewall protège le périmètre réseau, le WAF protège la couche applicative. On ne protège pas une app web avec juste iptables."}]}
 ]}

]

SEASONS.sort((x,y) => x.id.localeCompare(y.id));
const epNum = id => parseFloat(String(id).replace(/^E/, ""));
SEASONS.forEach(s => { s.syn = (SYN[s.id] || []).slice().sort((a,b) => epNum(a.id) - epNum(b.id)); });
const $app = document.getElementById("app");
const byId = Object.fromEntries(SEASONS.map(s => [s.id, s]));

const store = {
  get(k, d){ try{ const v = localStorage.getItem("aisrev:" + k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("aisrev:" + k, JSON.stringify(v)); }catch(e){} }
};
let best = store.get("best", {});

const state = { view:"home", sid:null, tab:"cards", query:"", flash:null, quiz:null, syn:null };

function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }
function esc(s){ return String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch])); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

function notionCount(s){
  let n = 0;
  s.sections.forEach(sec => sec.g.forEach(g => {
    if(g.kv) n += g.kv.length;
    if(g.table) n += g.table.rows.length;
    if(g.steps) n += g.steps.length;
  }));
  return n;
}
function flashDeck(s){
  const d = [];
  s.sections.forEach(sec => sec.g.forEach(g => {
    if(g.kv) g.kv.forEach(([k,v]) => d.push({ctx: g.h || sec.t, k, v}));
  }));
  return d;
}
const TOTAL_NOTIONS = SEASONS.reduce((a,s) => a + notionCount(s), 0);

function ring(pct, size){
  const r = size === "lg" ? 42 : 18, c = 2*Math.PI*r, box = size === "lg" ? 96 : 44;
  const has = typeof pct === "number";
  const off = has ? c*(1 - pct/100) : c;
  return `<div class="ring${has ? " has" : ""}"><svg viewBox="0 0 ${box} ${box}" aria-hidden="true">
    <circle class="tr" cx="${box/2}" cy="${box/2}" r="${r}"/>
    <circle class="vl" cx="${box/2}" cy="${box/2}" r="${r}" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"/>
  </svg><i>${has ? pct + "%" : "--"}</i></div>`;
}

/* ---------- Sommaire ---------- */
function renderHome(){
  const validated = SEASONS.filter(s => best[s.id] && best[s.id].pct >= 70).length;
  $app.innerHTML = `<div class="wrap">
    <div class="hero">
      <div class="prompt"><span class="u">ais@revision</span>:<span class="p">~</span>$ ls ./saisons <span class="caret"></span></div>
      <h1>AIS<span>//</span>Révision</h1>
      <p>Fiches de révision pour le titre Administrateur.trice d'infrastructures sécurisées, saison par saison, avec flashcards et QCM corrigés.</p>
    </div>
    <div class="stats">
      <div class="stat"><b>${SEASONS.length}</b><span>Saisons</span></div>
      <div class="stat"><b>${TOTAL_NOTIONS}</b><span>Notions</span></div>
      <div class="stat"><b>${validated}<small style="font-size:14px;color:var(--muted)">/${SEASONS.length}</small></b><span>QCM ≥ 70 %</span></div>
    </div>
    <div class="search"><input id="q" type="search" autocomplete="off" placeholder="grep une notion : DHCP, RAID 5, chmod…" value="${esc(state.query)}" aria-label="Rechercher une notion"></div>
    <div id="results"></div>
    <div id="blocs"></div>
    <p class="foot">// Ta progression (meilleurs scores) est gardée sur cet appareil.<br>// Sur smartphone : menu du navigateur → « Ajouter à l'écran d'accueil » pour l'ouvrir comme une appli.</p>
  </div>`;
  renderBlocs();
  renderResults();
  const q = document.getElementById("q");
  q.addEventListener("input", () => { state.query = q.value; renderResults(); });
}
function renderBlocs(){
  const el = document.getElementById("blocs");
  el.hidden = !!state.query.trim();
  el.innerHTML = BLOCS.map(b => {
    const list = SEASONS.filter(s => s.bloc === b.id).sort((x,y) => x.id.localeCompare(y.id));
    return `<section class="bloc">
      <div class="bloc-h"><h2>${b.label}</h2><span class="ln"></span><small>${list.length} saisons</small></div>
      <div class="tiles">${list.map(s => {
        const sc = best[s.id];
        return `<button class="tile" style="--c:${s.c}" data-act="open" data-id="${s.id}">
          <span class="code-badge">${s.id}</span>
          <span class="tile-t"><b>${esc(s.title)}</b><span>${notionCount(s)} notions${s.syn.length ? ` · ${s.syn.length} synthèses` : ""} · QCM ${s.quiz.length} q</span></span>
          ${ring(sc ? sc.pct : null)}
        </button>`;
      }).join("")}</div>
    </section>`;
  }).join("");
}
function hl(text, q){
  const t = esc(text);
  if(!q) return t;
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0) return t;
  return esc(text.slice(0,i)) + "<mark>" + esc(text.slice(i, i+q.length)) + "</mark>" + esc(text.slice(i+q.length));
}
function renderResults(){
  const el = document.getElementById("results");
  const blocs = document.getElementById("blocs");
  const q = state.query.trim();
  blocs.hidden = !!q;
  if(!q){ el.innerHTML = ""; return; }
  const out = [];
  const ql = q.toLowerCase();
  SEASONS.forEach(s => s.sections.forEach((sec, si) => sec.g.forEach(g => {
    const rows = g.kv || (g.table ? g.table.rows.map(r => [r[0], r.slice(1).join(" · ")]) : []);
    rows.forEach(([k,v]) => {
      if((k + " " + v).toLowerCase().includes(ql)) out.push({s, si, ctx: g.h || sec.t, k, v});
    });
  })));
  const strip = t => String(t).replace(/\*\*/g, "");
  SEASONS.forEach(s => s.syn.forEach((f, fi) => f.parts.forEach(p => p.g.forEach(g => {
    const add = (k, v) => { if((k + " " + v).toLowerCase().includes(ql)) out.push({s, fi, ctx: "Synthèse " + f.id + " › " + p.h, k, v}); };
    if(g.kv) g.kv.forEach(([k,v]) => add(k, v));
    if(g.table) g.table.rows.forEach(r => add(r[0], r.slice(1).join(" · ")));
    if(g.steps) g.steps.forEach(x => Array.isArray(x) ? add(x[0], x[1]) : add(g.h || p.h, x));
    if(g.cols) g.cols.forEach(([t,sub,txt]) => add(t, strip(txt)));
    if(g.def) add(g.h || p.h, strip(g.def));
    if(g.p) add(g.h || p.h, strip(g.p));
    if(g.ul) g.ul.forEach(x => add(g.h || p.h, strip(x)));
  }))));
  el.innerHTML = out.length
    ? `<div class="results">${out.slice(0,40).map(r => `<button class="res" style="--c:${r.s.c}" ${r.fi !== undefined ? `data-act="gosyn" data-id="${r.s.id}" data-i="${r.fi}"` : `data-act="goto" data-id="${r.s.id}" data-sec="${r.si}"`}>
        <small>${r.s.id} › ${esc(r.ctx)}</small><b>${hl(r.k, q)}</b><p>${hl(r.v, q)}</p></button>`).join("")}
        ${out.length > 40 ? `<p class="empty">… ${out.length - 40} autres résultats, précise ta recherche.</p>` : ""}</div>`
    : `<p class="empty">grep: aucun résultat pour « ${esc(q)} ».</p>`;
}

function renderSeason(){
  const s = byId[state.sid];

function renderPane(){
  const s = byId[state.sid];
  const pane = document.getElementById("pane");

  else if(state.tab === "syn") pane.innerHTML = synHTML(s);
  else if(state.tab === "flash") pane.innerHTML = flashHTML(s);
  else pane.innerHTML = quizHTML(s);

function grpHTML(g){
  const h = g.h ? `<h4 class="gh">${esc(g.h)}</h4>` : "";
  if(g.kv) return `<div>${h}<dl class="kv">${g.kv.map(([k,v]) => `<div class="row"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl></div>`;
  if(g.table) return `<div>${h}<div class="tw"><table><thead><tr>${g.table.head.map(x => `<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${g.table.rows.map(r => `<tr>${r.map(x => `<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  if(g.steps) return `<div>${h}<ol class="steps">${g.steps.map(x => Array.isArray(x) ? `<li><div><b class="mono">${esc(x[0])}</b><span>${esc(x[1])}</span></div></li>` : `<li><div><b>${esc(x)}</b></div></li>`).join("")}</ol></div>`;
  if(g.flow) return `<div>${h}<ol class="steps flow">${g.flow.map(x => `<li><div><b>${esc(x[0])}</b>${x[1] ? `<span class="mono">${esc(x[1])}</span>` : ""}</div></li>`).join("")}</ol></div>`;
  if(g.code) return `<div>${h}<pre class="code"><code>${esc(g.code)}</code></pre></div>`;
  if(g.def) return `<div>${h}<p class="def">${fmt(g.def)}</p></div>`;
  if(g.ul) return `<div>${h}<ul class="ul">${g.ul.map(x => `<li>${fmt(x)}</li>`).join("")}</ul></div>`;
  if(g.cols) return `<div>${h}<div class="cols">${g.cols.map(([t,sub,txt]) => `<div class="col"><b>${esc(t)}</b>${sub ? `<small>${esc(sub)}</small>` : `<small></small>`}<p>${fmt(txt)}</p></div>`).join("")}</div></div>`;
  if(g.p){
    if(g.prose === false || !state.reading) return `<div>${h}<p class="tip">${fmt(g.p)}</p></div>`;
    const fix = /^Correction\s*:/.test(g.p);
    return `<div>${h}<p class="${fix ? "tip fix" : "prose"}">${fmt(g.p)}</p></div>`;
  }
  return "";
}

  <header class="reader-h"><small>${s.id} · ${esc(f.id)} · FICHE DE SYNTHÈSE</small><h2>${esc(f.t)}</h2><p>${esc(f.sub)}</p></header>
  ${body}
  <nav class="reader-nav">
    ${prev ? `<button class="btn" data-act="syn-open" data-i="${i-1}">‹ ${esc(prev.id)} ${esc(prev.t)}</button>` : `<span></span>`}
    ${next ? `<button class="btn pri" data-act="syn-open" data-i="${i+1}">${esc(next.id)} ${esc(next.t)} ›</button>` : `<button class="btn pri" data-act="tab" data-tab="quiz">QCM de la saison ›</button>`}
  </nav>`;
}
function cardsHTML(s){
  return `<nav class="jump" aria-label="Sections">${s.sections.map((sec,i) => `<button data-act="jump" data-sec="${i}">${i+1} · ${esc(sec.t.split(/[:,(]/)[0].trim())}</button>`).join("")}${s.notes.length ? `<button data-act="jump" data-sec="beyond">Au-delà</button>` : ""}</nav>
  ${s.sections.map((sec,i) => `<details class="sec" id="sec-${i}"${i===0 ? " open" : ""}>
    <summary><span class="sec-n">${String(i+1).padStart(2,"0")}</span><span class="sec-t"><b>${esc(sec.t)}</b><small>${esc(sec.ref)}</small></span><span class="chev">›</span></summary>
    <div class="sec-body">${sec.g.map(grpHTML).join("")}</div>
  </details>`).join("")}
  ${s.notes.length ? `<aside class="beyond" id="sec-beyond"><h3>! Au-delà des fiches</h3><ol>${s.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ol></aside>` : ""}
  <div class="btn-row"><button class="btn pri block" data-act="tab" data-tab="quiz">Tester mes connaissances : QCM ›</button></div>`;
}

/* ---------- Flash ---------- */
function newFlash(s, only){
  const deck = shuffle(only || flashDeck(s));
  state.flash = {deck, i:0, flipped:false, ok:[], ko:[]};
}
function flashHTML(s){
  if(!state.flash) newFlash(s);
  const f = state.flash;
  if(f.i >= f.deck.length){
    const total = f.deck.length;
    return `<div class="panel">
      <p class="mono" style="color:var(--c);font-size:12px">// session terminée</p>
      <h3>${f.ok.length} / ${total} notions maîtrisées</h3>
      <p>${f.ko.length ? `${f.ko.length} notion${f.ko.length>1?"s":""} à revoir. Relance uniquement celles-là pour les fixer.` : "Aucune notion ratée, bravo."}</p>
      <div class="btn-row">
        ${f.ko.length ? `<button class="btn pri" data-act="flash-ko">Revoir les ${f.ko.length} ratées</button>` : ""}
        <button class="btn" data-act="flash-new">Nouveau paquet complet</button>
      </div>
    </div>`;
  }
  const c = f.deck[f.i];
  const pct = Math.round(f.i / f.deck.length * 100);
  return `<div class="fl-head"><span>carte ${f.i+1}/${f.deck.length}</span><span><span style="color:var(--ok)">✓ ${f.ok.length}</span> · <span style="color:var(--ko)">✗ ${f.ko.length}</span></span></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <button class="flip${f.flipped ? " on" : ""}" data-act="flip" aria-label="Retourner la carte">
    <div class="flip-in">
      <div class="face front"><small>${esc(c.ctx)}</small><div class="big">${esc(c.k)}</div><span class="hint">touche pour révéler ↻</span></div>
      <div class="face backf"><small>${esc(c.ctx)} › ${esc(c.k)}</small><div class="ans">${esc(c.v)}</div><span class="hint">tu le savais ?</span></div>
    </div>
  </button>
  <div class="fl-actions">
    <button class="btn ko" data-act="flash-mark" data-ok="0" ${f.flipped ? "" : "disabled"}>✗ À revoir</button>
    <button class="btn ok" data-act="flash-mark" data-ok="1" ${f.flipped ? "" : "disabled"}>✓ Je savais</button>
  </div>`;
}

/* ---------- QCM ---------- */
function startQuiz(s, subset){
  const src = subset || s.quiz;
  state.quiz = {
    full: !subset,
    i: 0, done: false, onlyWrong: false,
    qs: shuffle(src).map(q => ({q:q.q, e:q.e, o:q.o, opts: shuffle(q.o.map((t,j) => ({t, ok: j===0}))), pick:null}))
  };
}
function quizHTML(s){
  const z = state.quiz;
  if(!z){
    const sc = best[s.id];
    return `<div class="panel">
      <p class="mono" style="color:var(--c);font-size:12px">$ ./qcm --saison ${s.id.toLowerCase()}</p>
      <h3>QCM · ${esc(s.title)}</h3>
      <p>${s.quiz.length} questions tirées dans le désordre, réponses mélangées. Tu réponds à tout, puis tu reçois la correction détaillée avec l'explication de chaque erreur.</p>
      <div class="meta"><span>Questions <b>${s.quiz.length}</b></span><span>Meilleur score <b>${sc ? sc.pct + " %" : "—"}</b></span>${sc ? `<span>Le <b>${new Date(sc.date).toLocaleDateString("fr-FR")}</b></span>` : ""}</div>
      <div class="btn-row"><button class="btn pri" data-act="quiz-start">Lancer le QCM ›</button></div>
    </div>`;
  }
  if(!z.done){
    const q = z.qs[z.i];
    const pct = Math.round(z.i / z.qs.length * 100);
    const last = z.i === z.qs.length - 1;
    return `<div class="fl-head"><span>question ${z.i+1}/${z.qs.length}</span><button class="toggle" data-act="quiz-quit">Abandonner</button></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <p class="q">${esc(q.q)}</p>
    <div class="opts" role="radiogroup">${q.opts.map((o,j) => `<button class="opt" role="radio" aria-pressed="${q.pick===j}" aria-checked="${q.pick===j}" data-act="pick" data-j="${j}"><span class="l">${"ABCD"[j]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
    <div class="qnav">
      <button class="btn" data-act="qprev" ${z.i===0 ? "disabled" : ""}>‹</button>
      <button class="btn pri" data-act="qnext" ${q.pick===null ? "disabled" : ""}>${last ? "Voir la correction" : "Suivante ›"}</button>
    </div>`;
  }
  const good = z.qs.filter(q => q.opts[q.pick] && q.opts[q.pick].ok).length;
  const total = z.qs.length;
  const pct = Math.round(good / total * 100);
  const pass = pct >= 70;
  const msg = pct >= 90 ? "Excellent, c'est maîtrisé." : pct >= 70 ? "Validé. Relis les explications des erreurs pour consolider." : pct >= 50 ? "En progrès : relis les sections concernées puis refais tes erreurs." : "À retravailler : repasse par les fiches et les flashcards.";
  const wrong = z.qs.filter(q => !(q.opts[q.pick] && q.opts[q.pick].ok));
  const list = z.onlyWrong ? wrong : z.qs;
  return `<div class="panel"><div class="score">
    ${ring(pct, "lg")}
    <div><span class="exit ${pass ? "ok" : "ko"}">exit ${pass ? 0 : 1}${z.full ? "" : " · révision des erreurs"}</span>
      <h3>${good} / ${total} bonnes réponses</h3><p>${msg}</p></div>
  </div>
  <div class="btn-row">
    ${wrong.length ? `<button class="btn pri" data-act="quiz-wrong">Refaire mes ${wrong.length} erreur${wrong.length>1?"s":""}</button>` : ""}
    <button class="btn" data-act="quiz-start">Refaire tout le QCM</button>
  </div></div>
  <div class="corr-h"><h4>Correction</h4>${wrong.length ? `<button class="toggle" aria-pressed="${z.onlyWrong}" data-act="only-wrong">${z.onlyWrong ? "Erreurs seulement ✓" : "Afficher seulement les erreurs"}</button>` : ""}</div>
  <div class="corr">${list.map(q => {
    const n = z.qs.indexOf(q) + 1;
    const mine = q.opts[q.pick];
    const ok = mine && mine.ok;
    return `<article class="ci${ok ? "" : " bad"}">
      <span class="st ${ok ? "ok" : "ko"}">Q${n} · ${ok ? "✓ CORRECT" : "✗ ERREUR"}</span>
      <p class="cq">${esc(q.q)}</p>
      <div class="a">${ok ? `<span>ta réponse</span><b class="g">${esc(mine.t)}</b>` : `<span>ta réponse</span><span class="y">${esc(mine ? mine.t : "—")}</span><span>la bonne</span><b class="g">${esc(q.o[0])}</b>`}</div>
      <p class="ex">${esc(q.e)}</p>
    </article>`;
  }).join("")}</div>`;
}
function finishQuiz(s){
  const z = state.quiz;
  z.done = true;
  if(z.full){
    const good = z.qs.filter(q => q.opts[q.pick] && q.opts[q.pick].ok).length;
    const pct = Math.round(good / z.qs.length * 100);
    if(!best[s.id] || pct >= best[s.id].pct){ best[s.id] = {pct, date: Date.now()}; store.set("best", best); }
  }
}

/* ---------- Événements ---------- */
$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if(!b) return;
  const act = b.dataset.act;
  const s = state.sid ? byId[state.sid] : null;
  const top = () => window.scrollTo({top:0, behavior:"instant" in window ? "instant" : "auto"});

  if(act === "open"){ state.view = "season"; state.sid = b.dataset.id; state.tab = "cards"; state.flash = null; state.quiz = null; state.syn = null; renderSeason(); window.scrollTo(0,0); return; }
  if(act === "goto"){
    state.view = "season"; state.sid = b.dataset.id; state.tab = "cards"; state.flash = null; state.quiz = null; renderSeason();
    const sec = document.getElementById("sec-" + b.dataset.sec);
    if(sec){ sec.open = true; sec.scrollIntoView({block:"start"}); }
    return;
  }
  if(act === "gosyn"){
    state.view = "season"; state.sid = b.dataset.id; state.tab = "syn"; state.syn = +b.dataset.i; state.flash = null; state.quiz = null;
    renderSeason(); window.scrollTo(0,0); return;
  }
  if(act === "syn-open"){ state.syn = +b.dataset.i; renderPane(); window.scrollTo(0,0); return; }
  if(act === "syn-list"){ state.syn = null; renderPane(); window.scrollTo(0,0); return; }
  if(act === "home"){ state.view = "home"; state.sid = null; renderHome(); window.scrollTo(0,0); return; }
  if(act === "tab"){
    state.tab = b.dataset.tab;
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === state.tab));
    renderPane(); window.scrollTo(0,0); return;
  }
  if(act === "jump"){
    const sec = document.getElementById("sec-" + b.dataset.sec);
    if(sec){ if(sec.tagName === "DETAILS") sec.open = true; sec.scrollIntoView({behavior:"smooth", block:"start"}); }
    return;
  }
  /* Flash */
  if(act === "flip"){ state.flash.flipped = !state.flash.flipped; b.classList.toggle("on", state.flash.flipped); document.querySelectorAll('[data-act="flash-mark"]').forEach(x => x.disabled = !state.flash.flipped); return; }
  if(act === "flash-mark"){
    const f = state.flash, c = f.deck[f.i];
    (b.dataset.ok === "1" ? f.ok : f.ko).push(c);
    f.i++; f.flipped = false; renderPane(); return;
  }
  if(act === "flash-ko"){ newFlash(s, state.flash.ko); renderPane(); return; }
  if(act === "flash-new"){ newFlash(s); renderPane(); return; }
  /* QCM */
  if(act === "quiz-start"){ startQuiz(s); renderPane(); window.scrollTo(0,0); return; }
  if(act === "quiz-quit"){ state.quiz = null; renderPane(); return; }
  if(act === "quiz-wrong"){
    const wrong = state.quiz.qs.filter(q => !(q.opts[q.pick] && q.opts[q.pick].ok)).map(q => ({q:q.q, o:q.o, e:q.e}));
    startQuiz(s, wrong); renderPane(); window.scrollTo(0,0); return;
  }
  if(act === "pick"){ state.quiz.qs[state.quiz.i].pick = +b.dataset.j; renderPane(); return; }
  if(act === "qprev"){ state.quiz.i = Math.max(0, state.quiz.i - 1); renderPane(); return; }
  if(act === "qnext"){
    const z = state.quiz;
    if(z.i < z.qs.length - 1){ z.i++; renderPane(); }
    else { finishQuiz(s); renderPane(); window.scrollTo(0,0); }
    return;
  }
  if(act === "only-wrong"){ state.quiz.onlyWrong = !state.quiz.onlyWrong; renderPane(); return; }
});

/* Lien direct vers une saison : …#SA3 */
const start = (location.hash || "").replace("#","").toUpperCase();
if(byId[start]){ state.view = "season"; state.sid = start; renderSeason(); } else { renderHome(); }
