{id:"SC2", bloc:"C", title:"Cloud computing", c:"#6fd8ff",
sections:[
 {t:"Les bases du cloud", ref:"fiche 01", g:[
  {h:"Le principe", kv:[
   ["Cloud","Infrastructure consommée comme l'électricité, payée à l'usage"],
   ["On-Premises","Tout acheter et gérer : CAPEX lourd, délais longs"],
   ["2006","AWS EC2 : naissance de l'IaaS"],
   ["CAPEX → OPEX","Investissement → dépense de fonctionnement"]]},
  {h:"5 caractéristiques NIST", steps:["Accès réseau large, depuis partout","Mise en commun des ressources (isolées)","Libre-service à la demande","Élasticité rapide","Service mesuré, facturé à l'usage"]},
  {p:"Règle : sans les 5 caractéristiques, ce n'est pas du cloud."},
  {h:"Qui gère quoi ?", table:{head:["Couche","On-Prem","IaaS","PaaS","SaaS"], rows:[
   ["Application","Vous","Vous","Vous","Provider"],
   ["Données","Vous","Vous","Vous","Vous (toujours !)"],
   ["Runtime / middleware","Vous","Vous","Provider","Provider"],
   ["OS","Vous","Vous","Provider","Provider"],
   ["Virtu., serveurs, réseau, datacenter","Vous","Provider","Provider","Provider"],
   ["Exemples","Proxmox","EC2, Compute Engine","Beanstalk, Lambda, Heroku","M365, Salesforce"],
   ["Pizza","Fait maison","À emporter","Livrée","Restaurant"]]}},
  {p:"Choisir : contrôle de l'OS ou lift & shift → IaaS · focus code et auto-scaling → PaaS · appli standard, pas d'équipe IT → SaaS · conformité extrême → on-prem ou hybride. En pratique : hybride multi-cloud."}
 ]},
 {t:"Responsabilité & réversibilité", ref:"fiche 02", g:[
  {h:"Responsabilité partagée", kv:[
   ["Provider","Sécurité DU cloud (infra)"],
   ["Client","Sécurité DANS le cloud"],
   ["Toujours vous","Données, accès, conformité RGPD (partagée)"],
   ["Faille appli","IaaS/PaaS : vous · SaaS : provider (accès : vous)"],
   ["Panne VM","Provider redémarre · à vous : 2+ VM, load balancer"],
   ["Amende RGPD","Pour vous, pas pour le provider"]]},
  {h:"Sauvegardes", kv:[
   ["Piège","« C'est dans le cloud donc sauvegardé » : FAUX"],
   ["Redondance","Disponibilité, pas récupération (suppression répliquée)"],
   ["IaaS","Rien par défaut : activer AWS / Azure Backup"],
   ["PaaS BDD","Auto 7-35 j · long terme : vous"],
   ["SaaS","Vérifier pour VOS données"],
   ["3-2-1","Dont 1 copie hors provider"]]},
  {h:"Lock-in & réversibilité", kv:[
   ["Réversibilité","Changer de provider sans perte ni coupure majeure"],
   ["Lock-in","Technique, contractuel, compétences, coûts"],
   ["Faible portabilité","DynamoDB, Cosmos DB, Lambda, SaaS propriétaire"],
   ["Moyenne","VM, MySQL managé, Docker"],
   ["Forte","PostgreSQL, Kubernetes, Terraform, JSON/CSV/SQL"],
   ["Egress","Sortie payante (0,08-0,12 €/Go)"]]},
  {h:"6 stratégies anti lock-in", steps:["Standards ouverts","Infrastructure as Code (Terraform)","Conteneurs (Docker, Kubernetes)","Architecture découplée (API)","Formats de données ouverts","Multi-cloud (complexe)"]},
  {p:"Basecamp quitte AWS (2022) : ~7 M$ économisés sur 5 ans."}
 ]},
 {t:"Garanties contractuelles", ref:"fiche 03", g:[
  {h:"Disponibilité et indisponibilité", table:{head:["SLA","Indispo / an","/ mois","/ semaine"], rows:[
   ["99 %","3,65 j","7,2 h","1,68 h"],
   ["99,9 % (3 nines)","8,76 h","43 min","10 min"],
   ["99,95 %","4,38 h","21 min","5 min"],
   ["99,99 % (4 nines)","52 min","4,3 min","1 min"],
   ["99,999 % (5 nines)","5,26 min","26 s","6 s"]]}},
  {h:"SLA", kv:[
   ["Contenu","Engagements, métriques, calcul, crédits, exclusions"],
   ["Crédits","Bons d'achat à réclamer, pas de l'argent"],
   ["Ne couvre pas","La perte business, votre appli, les bugs, la Preview"],
   ["Exclusions","Maintenance, force majeure, erreur client, DDoS, tiers"],
   ["Azure VM","1 VM 99,9 % · Availability Set 99,95 % · Zones 99,99 %"]]},
  {h:"SLI / SLO / SLA", kv:[
   ["SLI","Indicateur mesuré (uptime 99,92 %)"],
   ["SLO","Objectif interne (≥ 99,95 %)"],
   ["SLA","Engagement contractuel (≥ 99,9 %)"],
   ["Ordre","SLA ≤ SLO ≤ réalité"],
   ["Error budget","100 % − SLO (99,9 % → 43,2 min/mois)"],
   ["Budget épuisé","Gel des nouveautés, focus stabilité"]]},
  {h:"RGPD & contrat", kv:[
   ["Provider","Sous-traitant : infra conforme, DPA signé"],
   ["Client","Responsable de traitement : base légale, registre, DPO"],
   ["Région","Azure France Central · AWS eu-west-3 · GCP europe-west9"],
   ["DPA","Accord de sous-traitance (obligatoire)"],
   ["Exit clause","Accès et suppression des données à la sortie"],
   ["Limitation","Souvent ≤ montant payé sur 12 mois"]]},
  {h:"Certifications", kv:[
   ["HDS","Données de santé (France)"],
   ["SecNumCloud","ANSSI, souveraineté, immunité au Cloud Act"],
   ["ISO 27001","SMSI, souvent exigé en B2B"],
   ["SOC 2","Audit US (Type 2 : efficacité sur 6-12 mois)"],
   ["PCI DSS","Paiements par carte"],
   ["Vérifier","Par service, par région, date de validité"]]}
 ]},
 {t:"Les fournisseurs", ref:"fiches 04, 05", g:[
  {h:"Big 3", kv:[
   ["AWS ~30 %","Leader, catalogue immense, complexe"],
   ["Azure ~20 %","Intégration Microsoft, champion de l'hybride (Arc)"],
   ["GCP ~12 %","Data (BigQuery), ML (Vertex AI), Kubernetes (GKE)"],
   ["Communs","Régions en France, HDS, ISO 27001… mais Cloud Act"],
   ["Certifs","AWS Cloud Practitioner · AZ-900 · Cloud Digital Leader"]]},
  {h:"Providers FR / EU", kv:[
   ["OVHcloud","Leader EU, prix, pas d'egress, SecNumCloud partiel"],
   ["Scaleway","Innovation, ARM, serverless, dev experience"],
   ["Clever Cloud","PaaS souverain : git push = déploiement"],
   ["Outscale","Qualifié SecNumCloud"],
   ["Atouts","Pas de Cloud Act, RGPD natif, support FR"],
   ["Limites","Catalogue réduit, Europe surtout"]]},
  {p:"Cloud Act : loi américaine extraterritoriale permettant aux autorités US d'accéder aux données d'un fournisseur américain, même hébergées dans ses régions européennes. Trade-off principal : souveraineté contre services avancés."}
 ]}
],
notes:[
 "EU Data Act : depuis le 12 septembre 2025, les fournisseurs doivent faciliter le changement de cloud, et à partir du 12 janvier 2027 les frais de changement, frais de sortie (egress) compris, sont interdits pour une migration. L'egress du trafic courant reste payant.",
 "SecNumCloud : AWS, Azure et GCP ne sont toujours pas qualifiés en direct, mais S3NS (filiale de Thales, technologie Google Cloud) a obtenu la qualification SecNumCloud 3.2 en décembre 2025 pour son offre PREMI3NS ; Bleu (Orange et Capgemini, technologie Microsoft) suit la même voie."
],
quiz:[
 {q:"Un SLA de 99,9 % autorise combien d'indisponibilité par an ?", o:["8,76 heures","52 minutes","3,65 jours","43 minutes"], e:"0,1 % de 8 760 h = 8,76 h par an (≈ 43 min par mois). 52 min/an, c'est 99,99 % ; 3,65 j, c'est 99 %."},
 {q:"En SaaS, qui est responsable des données ?", o:["Vous, toujours","Le provider","Personne, c'est partagé à parts égales","L'éditeur seulement si le contrat le précise"], e:"Quel que soit le modèle, les données, les accès et la conformité RGPD restent de votre responsabilité. Le provider sécurise l'infra (sécurité DU cloud)."},
 {q:"La « sécurité DU cloud » (l'infrastructure) relève de…", o:["Le provider","Le client","L'ANSSI","Le DPO"], e:"Modèle de responsabilité partagée : le provider sécurise DU cloud (datacenter, réseau, hyperviseur), le client sécurise ce qu'il met DANS le cloud."},
 {q:"Lequel n'est PAS une des 5 caractéristiques NIST du cloud ?", o:["Hébergement dans le pays du client","Élasticité rapide","Libre-service à la demande","Service mesuré"], e:"Les 5 : accès réseau large, mise en commun des ressources, libre-service à la demande, élasticité rapide, service mesuré. La localisation n'en fait pas partie."},
 {q:"Heroku ou AWS Lambda relèvent de quel modèle ?", o:["PaaS","IaaS","SaaS","On-Premises"], e:"En PaaS on fournit le code, le provider gère OS et runtime. EC2 est de l'IaaS, Microsoft 365 du SaaS."},
 {q:"Quel est le bon ordre entre SLA, SLO et la réalité mesurée ?", o:["SLA ≤ SLO ≤ réalité","SLO ≤ SLA ≤ réalité","Réalité ≤ SLA ≤ SLO","SLA = SLO = réalité"], e:"L'objectif interne (SLO) est plus exigeant que l'engagement contractuel (SLA), pour garder de la marge avant de payer des pénalités."},
 {q:"Avec un SLO de 99,9 %, quel est l'error budget mensuel ?", o:["43,2 minutes","8,76 heures","4,3 minutes","0,1 minute"], e:"Error budget = 100 % − SLO = 0,1 % de 30 jours ≈ 43,2 min. S'il est épuisé, on gèle les nouveautés et on se concentre sur la stabilité."},
 {q:"Si le provider ne respecte pas son SLA, vous recevez…", o:["Des crédits (bons d'achat) à réclamer","Un remboursement de la perte business","Une indemnité automatique en argent","Rien, le SLA n'est pas contractuel"], e:"Les crédits sont des bons d'achat, et il faut souvent les réclamer. Le SLA ne couvre pas la perte business ni vos bugs."},
 {q:"Qu'est-ce que le Cloud Act ?", o:["Une loi américaine permettant l'accès aux données des providers US, même hébergées en Europe","Une certification européenne de souveraineté","Le règlement européen sur la portabilité du cloud","Un label de l'ANSSI"], e:"Loi extraterritoriale US. SecNumCloud (ANSSI) protège contre elle ; le règlement européen sur le changement de cloud, c'est l'EU Data Act."},
 {q:"« Mes données sont dans le cloud, donc elles sont sauvegardées. » Vrai ?", o:["Faux : la redondance assure la disponibilité, pas la récupération","Vrai pour tous les modèles","Vrai seulement en IaaS","Vrai si la région est en France"], e:"Une suppression ou un chiffrement par ransomware est répliqué partout. En IaaS rien n'est sauvegardé par défaut : il faut activer un service de backup et garder 1 copie hors provider."},
 {q:"Quelle qualification de l'ANSSI garantit souveraineté et immunité au Cloud Act ?", o:["SecNumCloud","HDS","SOC 2","ISO 27001"], e:"SecNumCloud est délivré par l'ANSSI. HDS concerne les données de santé, SOC 2 est un audit américain, ISO 27001 certifie un SMSI."},
 {q:"Que signifie le passage CAPEX → OPEX ?", o:["L'investissement devient une dépense de fonctionnement","Les coûts disparaissent","On achète le matériel au lieu de le louer","On passe d'un contrat annuel à un contrat mensuel"], e:"On-prem = gros investissement initial (CAPEX). Cloud = paiement à l'usage (OPEX), plus souple mais à surveiller (egress, ressources oubliées)."}
]}
];

 {id:"E02", t:"Systèmes d'exploitation", sub:"Le logiciel principal : noyau, interfaces, démarrage, processus, pilotes, fichiers, installation", parts:[
  {h:"Qu'est-ce qu'un système d'exploitation ?", g:[
   {def:"**Système d'exploitation** (OS, operating system) = le logiciel principal d'un ordinateur. Il offre une suite de services permettant la création de logiciels applicatifs et sert d'intermédiaire entre les logiciels et le matériel."},
   {table:{head:["OS d'ordinateurs","OS de smartphones"], rows:[
    ["Microsoft Windows","Android"],["Apple macOS","iOS (iPhone)"],["GNU/Linux","Windows Phone, BlackBerry OS (anciens)"]]}}]},
  {h:"Composants d'un OS : le noyau", g:[
   {p:"Le **noyau** (kernel) est le composant principal de l'OS. Ses fonctionnalités (liste non exhaustive) :"},
   {ul:["Exécution et ordonnancement des programmes","Gestion des ressources de l'ordinateur (ex. : la mémoire)","Gestion des périphériques","Manipulation des systèmes de fichiers","Gestion et communication via le réseau"]}]},
  {h:"Les interfaces", g:[
   {p:"Pour exploiter les fonctionnalités du noyau, on passe par différentes interfaces :"},
   {cols:[
    ["Interface graphique","GUI, Graphical User Interface","Les menus de l'OS pour le configurer et réaliser des tâches courantes (ex. : cliquer sur Démarrer puis sur le bouton d'extinction)."],
    ["Ligne de commande","CLI, Command Line Interface","Pour utilisateurs avancés : on lance des commandes propres à l'OS (ex. : shutdown). Sous Windows : l'invite de commande (le « terminal »)."],
    ["Programmation","API, Application Programming Interface","Utilisée non par des humains mais par des programmes pour accéder aux fonctionnalités de l'OS."]]},
   {p:"GUI + CLI = **interfaces homme-machine (IHM)** : elles permettent à un humain d'interagir avec la machine."}]},
  {h:"Démarrage d'un OS (boot)", g:[
   {steps:["Appui sur le bouton power (allumage)","Le BIOS initialise les composants de la carte mère et certains périphériques","Le BIOS identifie les périphériques internes et externes","Le BIOS démarre le système d'exploitation","L'OS démarré, on peut lancer les applications"]},
   {p:"En anglais, un ordinateur « boot » quand il démarre. Redémarrer = reboot."}]},
  {h:"Processus & multitâche", g:[
   {def:"**Processus** (process) = un programme en cours d'exécution. Il a un début et parfois une fin, et peut être démarré par l'utilisateur ou par un autre processus. Une application est souvent composée d'un ensemble de processus."},
   {p:"Un OS **multitâche** exécute plusieurs programmes de façon apparemment simultanée. Comme un cœur de processeur ne fait qu'une tâche à la fois, l'OS bascule très rapidement d'un processus à l'autre. Sous Windows, le Gestionnaire des tâches permet de voir et stopper les processus en cours."}]},
  {h:"Pilotes de périphériques (drivers)", g:[
   {def:"**Pilote** (driver) = programme permettant à l'OS (et aux logiciels) d'interagir avec un périphérique. Chaque périphérique a son pilote ; sans pilote, il est inutilisable. Les composants internes (ex. : carte graphique) en nécessitent aussi."},
   {cols:[
    ["Pilotes génériques & plug-and-play","","L'OS fournit des pilotes génériques (compatibles avec la plupart des périphériques, mais moins complets que ceux du constructeur). Un périphérique plug-and-play utilise aussi un pilote : l'OS le détermine automatiquement."],
    ["Installation manuelle","","Sans pilote générique, on l'installe soi-même depuis le site officiel du fabricant. Éviter les sites non officiels (risque de virus). Le pilote doit correspondre à l'OS (un pilote Windows ≠ macOS). Sous Windows : Gestionnaire de périphériques."]]}]},
  {h:"Fichiers", g:[
   {p:"Un **fichier** est une collection d'informations portant un nom, enregistrée sur un média (disque dur, bande magnétique, disque optique, mémoire flash). L'OS crée, modifie et détruit les fichiers et les répertoires (dossiers)."},
   {p:"Il gère aussi les **attributs** (nom, dates de création/modification, type, taille, emplacement) et les **permissions** (autorisations de lire, écrire ou exécuter selon l'utilisateur)."}]},
  {h:"Installer un OS", g:[
   {p:"À l'achat, l'OS est généralement pré-installé, mais on peut l'installer soi-même : système différent, nouvelle version (ex. : Windows 11), réinstallation (bug/virus) ou reconfiguration. En entreprise, on réinstalle systématiquement l'OS sur les PC neufs."},
   {kv:[
    ["Média d'installation","Avant un CD/DVD ; aujourd'hui plutôt une clé USB"],
    ["Image ISO","Copie conforme (« photo ») du contenu d'un disque. On crée la clé USB soi-même avec un utilitaire ; ISO est le format le plus utilisé"],
    ["Booter sur le média","Faire démarrer un OS « léger » stocké sur le média : il faut souvent modifier l'ordre de démarrage dans le BIOS"],
    ["Fin d'installation","Redémarrer puis retirer le média (ou rétablir l'ordre de boot) pour démarrer sur le système installé"]]}]}
 ]},
 {id:"E02.5", t:"Connectique et périphériques", sub:"Les connecteurs externes et les périphériques courants de l'ordinateur", parts:[
  {h:"Connecteurs externes", g:[
   {p:"Les connecteurs externes relient des périphériques à l'ordinateur pour l'étendre ou l'utiliser : ce sont les « portes d'accès » vers le monde extérieur."},
   {kv:[
    ["USB (Universal Serial Bus)","Connecteur universel : transfère des données, alimente et charge les appareils. USB-A (plat, le plus courant), USB-B (carré : imprimantes/scanners), USB-C (récent, performant, réversible)"],
    ["HDMI","Envoie vidéo + audio vers un écran ou un téléviseur. Remplace les anciens VGA / composante"],
    ["DisplayPort","Alternative plus récente et puissante que l'HDMI pour la vidéo haute résolution (pro / gaming)"],
    ["Jack audio 3,5 mm","« Prise casque » : écouteurs, micros et haut-parleurs externes. Très ancien (années 1960) mais toujours utilisé"],
    ["Ethernet (RJ45)","Connexion réseau filaire à Internet ou un réseau local : plus rapide et stable que le Wi-Fi"]]},
   {p:"Connecteurs obsolètes : Parallel (DB-25), Serial (DB-9), FireWire, Thunderbolt (ancien standard Apple → remplacé par l'USB-C), ainsi que VGA et DVI (vidéo avant l'HDMI / DisplayPort)."}]},
  {h:"Périphériques d'entrée (input)", g:[
   {p:"Ils permettent à l'utilisateur d'envoyer de l'information à l'ordinateur."},
   {kv:[
    ["Clavier","Saisie de texte et de commandes. Dispositions : AZERTY (FR), QWERTY (EN), Dvorak (vitesse). Filaire (USB) ou sans fil (Bluetooth/radio)"],
    ["Souris","Pointage le plus courant. Optique ou laser (plus précise). Filaire ou sans fil"],
    ["Trackpad","Pavé tactile : remplace la souris sur les portables, gère les gestes multitouch"],
    ["Microphone","Capture le son (appels, enregistrements, reconnaissance vocale). Intégré ou externe (USB / jack)"]]}]},
  {h:"Périphériques de sortie (output)", g:[
   {p:"Ils permettent à l'ordinateur de transmettre de l'information à l'utilisateur."},
   {cols:[
    ["Écran (moniteur)","","Affiche le contenu généré. Tailles : 24\", 27\", 32\". Résolutions : 1920×1080 (1080p), 2560×1440 (QHD), 3840×2160 (4K). Connecteurs HDMI / DisplayPort."],
    ["Haut-parleurs","","Restituent le son. Intégrés (qualité moyenne), externes USB/jack (meilleure qualité), ou système complet avec subwoofer."],
    ["Imprimante","","Transforme le numérique en papier. Jet d'encre (cartouches) ou laser (toner + chaleur). Branchement USB, Ethernet ou Wi-Fi."]]}]},
  {h:"Périphériques de stockage", g:[
   {p:"Ils permettent de sauvegarder et transporter des données."},
   {cols:[
    ["Disque dur externe","","Stockage supplémentaire relié en USB. Capacités : 256 Go, 512 Go, 1 To, 2 To+. Sert à augmenter l'espace, sauvegarder et transférer des fichiers."],
    ["Clé USB","","Petit stockage portable et amovible. Capacités : 8 à 64 Go+. Pratique pour le transfert ; en entreprise, son usage est souvent contrôlé pour des raisons de sécurité."]]}]},
  {h:"Récapitulatif", g:[
   {ul:["**Connecteurs essentiels** : USB → périphériques génériques · HDMI / DisplayPort → vidéo · Jack 3,5 mm → audio · Ethernet → réseau filaire","**Périphériques** : entrée (clavier, souris, micro, trackpad) · sortie (écran, haut-parleurs, imprimante) · stockage (disque dur externe, clé USB)"]},
   {p:"Plus vous êtes familier de ces connecteurs et périphériques, mieux vous saurez configurer, dépanner et maintenir un ordinateur."}]}
 ]},
 {id:"E03", t:"Histoire de l'informatique", sub:"Des premiers algorithmes à l'ordinateur personnel moderne", parts:[
  {h:"Qu'est-ce que l'informatique ?", g:[
   {def:"**Informatique** = domaine scientifique, technique et industriel du traitement automatique de l'information numérique par l'exécution de programmes, hébergés par des dispositifs électriques-électroniques (systèmes embarqués, ordinateurs, robots, automates…)."},
   {p:"Le terme « informatique » n'apparaît que dans les années 50-60, mais l'histoire remonte bien plus loin : jusqu'à l'Antiquité !"}]},
  {h:"Les précurseurs (avant le 20e siècle)", g:[
   {table:{head:["Pionnier / objet","Date","Apport"], rows:[
    ["Euclide","~300 av. J.-C.","Algorithme d'Euclide (calcul du PGCD) : l'un des plus anciens algorithmes connus"],
    ["Al-Khwârizmî","~800-850","Son nom latinisé donne le mot « algorithme », son ouvrage le mot « algèbre ». Classifie les algorithmes existants"],
    ["Métier Jacquard","1801","J. M. Jacquard : premier système mécanique programmable par cartes perforées"],
    ["Ada Lovelace","~1830-1852","Réalise le premier véritable programme informatique sur la machine analytique de Charles Babbage"]]}}]},
  {h:"L'ère moderne : les fondations (20e siècle)", g:[
   {cols:[
    ["Alan Turing","1936-1940","Mathématicien et cryptologue : la machine de Turing fonde scientifiquement l'informatique. Pionnier de l'IA, il joue un rôle majeur dans la cryptanalyse d'Enigma (2de Guerre mondiale)."],
    ["John von Neumann","1945","Rapport sur la machine EDVAC (1945). Donne son nom à l'architecture de von Neumann, utilisée par la quasi-totalité des ordinateurs modernes."]]},
   {h:"Premières machines", ul:[
    "**Machines électromécaniques** (fin 1930s) : Harvard Mark I / IBM ASCC (Aiken & Watson, 1939-1943) et Zuse 3 (Konrad Zuse, 1939-1941).",
    "**Premier « ordinateur »** (pas de consensus, 6 candidats) : ABC (1937), Complex Number Calculator (1939), Zuse 3 (1941), Colossus (1943), ASCC/Mark I (1944), ENIAC (1946).",
    "**EDVAC** (1946-1951) : l'un des premiers ordinateurs électroniques ; opère en binaire (l'ENIAC en décimal). 56 kW, ~6 000 tubes à vide, 7 tonnes, 45 m².",
    "**Premiers commercialisés** : BINAC (1949, le premier vendu), Ferranti Mark I (1951, premier généraliste), UNIVAC I (1951, premier commercial américain)."]}]},
  {h:"La révolution du matériel", g:[
   {p:"Le **transistor** (1947, laboratoires Bell, Nobel 1956) change tout : bien plus petit, léger et robuste que le tube électronique, il fonctionne à basse tension et quasi instantanément."},
   {table:{head:["Invention","Date","À retenir"], rows:[
    ["Transistor","1947","Premiers ordinateurs à transistor : TRADIC (1954), TX-0 (1956)"],
    ["Disque dur","1956","IBM RAMAC 350 : 50 disques de 61 cm à 1 200 tr/min… pour 3,75 Mo !"],
    ["Circuit intégré","1958","Jack Kilby : la « puce électronique » (chip / IC)"],
    ["Loi de Moore","1965","G. Moore : le nombre de transistors d'un microprocesseur double tous les 2 ans (ajustée en 1975)"],
    ["Microprocesseur","1969","Inventé chez Intel : l'Intel 4004, le premier processeur"]]}}]},
  {h:"L'ordinateur personnel", g:[
   {kv:[
    ["Mainframe","Ordinateur central partagé via des terminaux"],
    ["Mini-ordinateur","Un processeur pour un utilisateur (ex. : PDP-8)"],
    ["Micro-ordinateur","Équipé d'un microprocesseur, plus petit et moins cher (ex. : Altair 8800)"]]},
   {table:{head:["Machine","Date","À retenir"], rows:[
    ["Précurseurs","1950-1972","Simon (1950), IBM 610 (1957), Olivetti Programma 101 (1965), Kenbak-1 (1971, « 1er PC »), Micral (1972, français, Intel 8008)"],
    ["Xerox Alto & Star","1973 & 1981","Première souris et première interface graphique ; le Star est le premier vrai PC complet commercialisé"],
    ["Altair 8800","1975","Kit à 400 $. Débuts de Gates, Allen, Wozniak, Jobs ; 1er logiciel Microsoft = Altair Basic"],
    ["Apple I puis II","1976-1977","Issu du Homebrew Computer Club ; l'Apple II (1977) s'écoule à 4 millions d'exemplaires"],
    ["Micros familiaux","1977-1984","Commodore PET / VIC-20 / 64 (25 M !), TRS-80, TI-99, Atari, Thomson MO5/TO7, Amstrad CPC 464"],
    ["IBM PC","1981","IBM 5150 (Intel 8088) puis XT (1983) : naissance du standard « IBM compatible »"],
    ["Apple Lisa & Macintosh","1983 & 1984","Le Macintosh popularise l'interface graphique WIMP (Windows, Icons, Menus, Pointing device)"]]}},
   {p:"Correction : la souris a été inventée avant le Xerox Alto, par Douglas Engelbart (années 1960). L'Alto est la première machine à interface graphique."},
   {p:"Ce module traite surtout le hardware ; l'histoire des systèmes d'exploitation (GNU/Linux) est abordée en saison A5."}]}
 ]},
 {id:"E04", t:"Composants hardware", sub:"Monter et réparer un PC : carte mère, CPU, RAM, stockage, GPU, alimentation, boîtier", parts:[
  {h:"La carte mère", g:[
   {def:"**Carte mère** = circuit imprimé indispensable qui connecte tous les autres composants. Sa taille est standardisée (formats) et elle porte de nombreux ports et connecteurs."},
   {kv:[
    ["Connecteurs électriques","ATX 24 pins (alimentation principale) + 4/8 pins (alimentation du CPU)"],
    ["Socket processeur","Emplacement du CPU. Tous les CPU ne vont pas sur toutes les cartes (compatibilité de socket)"],
    ["Slots mémoire","2/4 (parfois 6/8) connecteurs pour les barrettes de RAM, avec détrompeur anti-erreur"],
    ["Slots d'extension","ISA (obsolète) → PCI (1994) → AGP (cartes graphiques, disparu) → PCI Express / PCIe (2004, rapide, actuel)"],
    ["Connecteurs stockage","Floppy & IDE/PATA (obsolètes), SATA (v3, courant), mSATA (portables), M.2 (SSD / cartes WiFi-BT)"]]}]},
  {h:"BIOS, chipset & formats", g:[
   {cols:[
    ["BIOS","Basic Input Output System (firmware)","Logiciel installé sur la carte mère : initialise les composants à l'allumage, amorce l'OS et configure la carte. Accès par une touche au démarrage (F2, Suppr, F10… selon le fabricant)."],
    ["Chipset","puce soudée","Anciennement northbridge (CPU/RAM/bus rapides) + southbridge (USB, SATA, PCI). Le northbridge est désormais intégré au CPU. Le chipset détermine les fonctions et la compatibilité de la carte."]]},
   {p:"**Formats** : AT (obsolète) → ATX (305×244 mm), micro-ATX, mini-ITX, E-ATX, etc. Les plus courants : ATX et micro-ATX. Le boîtier doit être compatible avec le format choisi."}]},
  {h:"Le processeur (CPU)", g:[
   {p:"Le processeur (Central Processing Unit) effectue les calculs. C'est, avec la RAM, l'un des composants primordiaux. Il est défini par :"},
   {kv:[
    ["Jeu d'instructions","x86 (obsolète), AMD64 / x86_64 (64 bits, CISC), ARM (RISC : ex. Apple M1/M2)"],
    ["Finesse de gravure","Taille d'un transistor (en nm). Plus de transistors = plus d'opérations par seconde"],
    ["Cadence (fréquence)","En GHz : 1 Hz = 1 cycle/s, donc 3 GHz = 3 milliards/s. N'est plus le seul critère (cache, nombre de cœurs…)"],
    ["Gammes","Intel : Xeon (serveur), Core i9 → i3. AMD : EPYC/Threadripper (serveur), Ryzen 9 → 3"]]},
   {p:"Comparer via un outil comme cpubenchmark. Les gammes « G » (Intel/AMD) intègrent un chipset graphique (pas besoin de carte graphique)."}]},
  {h:"Refroidissement du CPU", g:[
   {p:"Un processeur chauffe et doit être refroidi activement. On utilise en général un **ventirad** (radiateur métal + ventilateur), avec de la **pâte thermique** (un grain de riz suffit) pour améliorer l'échange thermique."},
   {p:"Alternatives : watercooling AIO (tout-en-un, simple) ou DIY (très performant mais coûteux), azote liquide (overclocking), bain d'huile (datacenter)."}]},
  {h:"La mémoire vive (RAM)", g:[
   {def:"**RAM** (Random Access Memory) = stocke les données de travail pendant que l'ordinateur est allumé (volatile). Critères : la capacité (Go) et la fréquence (MHz)."},
   {ul:["Minimum conseillé : 4 Go, idéalement 8 Go+ (plus pour virtualisation, gaming, pro).","Type actuel : DDR SDRAM, générations DDR1 → DDR5 (compatibilité carte mère / CPU).","**Dual channel** : 2 barrettes identiques sur les bons slots → bande passante doublée.","Formats : DIMM (PC fixe) et SO-DIMM (PC portable)."]}]},
  {h:"Le stockage : disque dur & SSD", g:[
   {cols:[
    ["Disque dur (HDD)","Hard Disk Drive","Mémoire de masse magnétique à disques tournants ; conserve les données sans alimentation. Capacité en Go/To, débit ~30-150 Mo/s. Formats 2,5\" (portable) / 3,5\" (fixe). Connectique IDE/PATA (obsolète), SATA, SAS (serveurs)."],
    ["Disque SSD","Solid State Drive","Stockage sur mémoire flash (type de ROM : EEPROM) : bien plus rapide et résistant aux chocs (aucune pièce mobile). Types : 2,5\" SATA, PCIe, mSATA, M.2 NVMe (le plus performant)."]]}]},
  {h:"Cartes d'extension & carte graphique", g:[
   {p:"Connectées sur les slots PCI / PCIe, elles ajoutent des fonctionnalités (son, réseau, acquisition…). La plupart sont aujourd'hui intégrées à la carte mère, sauf les cartes graphiques et d'acquisition."},
   {def:"**Carte graphique (GPU)** = carte dédiée à l'affichage. Elle embarque son propre processeur et sa RAM (GDDR), conçue pour des calculs comme le rendu 3D. Fabricants : Nvidia, AMD, Intel. Performance mesurée en FLOP. Connectique : PCIe 16x (parfois alimentation dédiée requise)."}]},
  {h:"L'alimentation (PSU)", g:[
   {p:"Le bloc d'alimentation convertit le 220 V du secteur en basses tensions continues (12 V, 5 V, 3,3 V). Critère principal : la puissance max en Watts."},
   {kv:[["Bureautique","300-400 W"],["Milieu de gamme","550-600 W"],["Gamer / CAO","750-850 W"],["Station puissante","1 000 W+"]]},
   {p:"**Certification 80 PLUS** : garantit un rendement (secteur → composants). Labels croissants : Bronze, Silver, Gold, Platinum, Titanium. « Qui peut le plus peut le moins » : prévoir une marge. Bronze suffit déjà ; choisir une marque réputée."}]},
  {h:"Boîtier & montage d'un PC", g:[
   {h:"Ordre d'assemblage (général)", steps:["Alimentation","Carte mère (+ backplate) dans le boîtier","CPU","Pâte thermique","Ventirad","RAM","Cartes d'extension & disques","Connexions","Front panel"]},
   {kv:[
    ["Front panel","Boutons, LEDs, USB façade : connexion délicate, se référer à la notice. Les LEDs ont une polarité (si elle ne s'allume pas, elle est à l'envers) ; les boutons non"],
    ["Cable management","Meilleur câblage = meilleure ventilation et maintenance facilitée"],
    ["Électricité statique","Composants sensibles : privilégier le coton, se décharger (toucher la terre) ou utiliser un bracelet antistatique"]]}]}
 ]},
 {id:"E05", t:"Introduction aux réseaux informatiques", sub:"Réseaux, types, topologies, équipements et diagrammes", parts:[
  {h:"Qu'est-ce qu'un réseau ?", g:[
   {def:"**Réseau** = structure composée d'éléments (les nœuds / sommets) reliés entre eux par des liens, assurant leur interconnexion et obéissant à certaines règles de fonctionnement."},
   {p:"Un réseau n'est pas que de l'informatique : transport en commun, réseau routier, LinkedIn… Ici, on se concentre sur les réseaux de communication informatisés : des équipements connectés selon une topologie, qui communiquent via des protocoles."}]},
  {h:"Types de réseaux (par étendue)", g:[
   {table:{head:["Sigle","Nom","Étendue / exemple"], rows:[
    ["Bus","Bus informatique","À l'intérieur de la carte mère"],
    ["PAN","Personal Area Network","Très local (Bluetooth, USB)"],
    ["LAN","Local Area Network","Réseau local (ex. : chez vous)"],
    ["WLAN","Wireless LAN","Réseau local sans fil (Wi-Fi)"],
    ["MAN","Metropolitan Area Network","À l'échelle d'une ville"],
    ["RAN","Rural Area Network","À l'échelle d'une région / zone rurale"],
    ["WAN","Wide Area Network","Pays, continent, planète : ex. Internet"]]}}]},
  {h:"Topologies", g:[
   {p:"La topologie est la façon dont les nœuds sont connectés entre eux. Les principales :"},
   {kv:[
    ["En bus","Tous les nœuds partagent un même câble central"],
    ["En anneau","Les nœuds forment une boucle fermée"],
    ["En étoile","Tous reliés à un équipement central (courant en LAN)"],
    ["Maillée","Nœuds interconnectés (principe d'Internet)"]]}]},
  {h:"Équipements & protocoles", g:[
   {h:"Équipements d'un réseau", ul:["Ordinateurs (clients ou serveurs)","Concentrateurs (« hubs ») : obsolètes","Commutateurs (« switchs »)","Routeurs"]},
   {h:"Protocoles de communication", p:"Pour communiquer, les nœuds doivent parler la même langue : respecter les mêmes règles, le **protocole**. Exemples : HTTP, TCP, IP, ICMP, FTP, UDP, SSH."}]},
  {h:"Les diagrammes réseau", g:[
   {p:"Ils offrent une vue d'ensemble du réseau, simplifient la maintenance et permettent de planifier un futur réseau. Avec l'inventaire du parc, ils font partie de la documentation du SI. On les crée avec un logiciel (ex. : Microsoft Visio)."},
   {cols:[
    ["Diagramme physique","","Montre l'organisation physique réelle des équipements : comment ils sont concrètement connectés."],
    ["Diagramme logique","","Montre la façon dont l'information circule ; plus d'infos, mais pas la position physique des équipements."]]},
   {p:"**Confidentialité** : un diagramme réseau peut faciliter le travail d'un hacker. Demandez la permission avant de l'inclure à un rapport de stage et ne le publiez pas sur Internet."},
   {p:"Pas de « bonne » façon unique : l'important est qu'il soit compréhensible, cohérent et à jour."}]}
 ]},
 {id:"E06", t:"Sécurité : bonnes pratiques", sub:"Critères, acteurs, grands principes, mots de passe, malwares et cryptographie", parts:[
  {h:"Pourquoi la sécurité ?", g:[
   {p:"La sécurité concerne tout le monde : toutes les entreprises n'ont pas d'expert dédié, et en freelance on est seul. Dans une société hyper-connectée, le bon fonctionnement des systèmes est primordial (même « si on n'a rien à cacher »). C'est aussi au programme du Titre Pro (REAC) : connaître et faire appliquer les bonnes pratiques, respecter la charte, intégrer la sécurité à ses interventions, connaître les acteurs."}]},
  {h:"Les 5 critères de sécurité", g:[
   {kv:[
    ["Intégrité","La donnée n'a pas pu être altérée / modifiée à l'insu du système"],
    ["Confidentialité","Seules les personnes autorisées / légitimes peuvent accéder à la donnée"],
    ["Authentification","Identifier un utilisateur avec certitude : un identifiant unique + un facteur d'authentification"],
    ["Disponibilité","Le système reste fonctionnel, accessible, utilisable (maintien en conditions opérationnelles)"],
    ["Non-répudiation","Traçabilité / preuve : empêcher un utilisateur de nier une transaction (conservation de preuves)"]]}]},
  {h:"Les grands principes", g:[
   {kv:[
    ["Menace n°1 = l'utilisateur","Malveillant ou maladroit : dans tous les cas, on ne peut pas lui faire confiance"],
    ["Privilège minimum","Chacun n'a accès qu'à ce qui est strictement indispensable à sa mission"],
    ["Defense in Depth","Sécurité en plusieurs couches indépendantes : si l'une cède, la suivante bloque"],
    ["Être (un peu) parano","Se méfier de ce qui est suspect ou « trop beau » (protège du social engineering)"],
    ["Pas de sécurité absolue","Compromis sécurité / fonctionnalité ; se préparer à l'échec : PRA/PCA et sauvegardes"],
    ["Maillon le plus faible","La sécurité d'un système = celle de son composant le plus faible"],
    ["Secure by design","Penser la sécurité dès la conception, pas à la fin du projet"],
    ["Loi de Murphy","« Tout ce qui peut mal tourner tournera mal » : concevoir comme si elle était vraie"]]}]},
  {h:"Les acteurs de la sécurité", g:[
   {kv:[
    ["ANSSI","Agence nationale de la sécurité des SI (FR, 2009, rattachée au SGDSN) : autorité nationale, recommandations, sécurité des OIV, opère le CERT-FR"],
    ["CSIRT / CERT","Équipes de réponse aux incidents. CERT = marque déposée (Carnegie Mellon). En France : CERT-FR (veille, alertes, prévention)"],
    ["MITRE / CVE","MITRE (US, à but non lucratif) publie le dictionnaire CVE (vulnérabilités). Criticité notée via le CVSS ; identifiant CVE-AAAA-NNNN"],
    ["CNIL","Autorité indépendante FR : veille au RGPD / loi Informatique et Libertés ; sanctions jusqu'à 20 M€. À notifier en cas de fuite de données personnelles"],
    ["OWASP","Sécurité des applications web : projets Top 10, ZAP, WSTG, Cheat Sheet Series, ASVS"]]},
   {p:"Métiers : cryptologue, RSSI/DSSI, auditeur / pentester, DPO (RGPD), expert sécurité, consultant / formateur."}]},
  {h:"Notre mission : 3 aspects", g:[
   {cols:[
    ["Prévention","","Identifier les risques, sensibiliser les utilisateurs, limiter l'impact, tester les politiques, faire de la veille."],
    ["Détection","","Surveiller le réseau et le parc (monitoring, analyse de logs), réagir aux alertes automatisées."],
    ["Réaction","","Suivre le PCA/PRA, restaurer des sauvegardes, prévenir / communiquer (CNIL, assurances, plainte)."]]}]},
  {h:"Mots de passe & authentification", g:[
   {def:"**Bon mot de passe** = aléatoire, assez long et unique à chaque système. Pas d'infos personnelles, pas de simples substitutions (ex. : b0bm4rl3y), pas de mots du dictionnaire, et jamais les plus courants. Solution : un gestionnaire de mots de passe (stockage chiffré), mieux que le papier ou le navigateur."},
   {h:"Facteurs d'authentification", kv:[
    ["Connaissance","Mot de passe, code PIN"],
    ["Possession","Clé, carte à puce, SMS, OTP/TOTP"],
    ["Biologique","Empreinte, rétine, voix"]]},
   {p:"**2FA / MFA** : authentification à facteurs multiples (≥ 2), à activer dès que possible. Ex. : mot de passe (connaissance) + code reçu par SMS (possession)."}]},
  {h:"Malwares & antivirus", g:[
   {p:"Un antivirus fonctionne selon deux modes : analyse de la **signature** (hash) des fichiers et analyse du **comportement** des programmes (méthode heuristique)."},
   {kv:[
    ["Ransomware","Chiffre les données et exige une rançon pour la clé de déchiffrement"],
    ["Spyware","Espionne l'activité ; vole données et comptes (le keylogger enregistre les frappes)"],
    ["Adware","Virus publicitaire : génère de l'argent via des clics"],
    ["Cheval de Troie","Code malicieux caché dans une application en apparence légitime"],
    ["Ver","Se réplique seul et contamine d'autres machines via le réseau"],
    ["Rootkit","Malware furtif, conçu pour être très difficile à détecter"],
    ["Coinminer / Botnet","Mine de la crypto à l'insu de l'utilisateur ; réseau de machines « zombies » (attaques DDoS)"]]}]},
  {h:"Notions de cryptographie", g:[
   {p:"Distinguer le **chiffrement** (réversible, pour protéger une donnée) du **hachage** (empreinte à sens unique). Trois grandes familles de chiffrement :"},
   {cols:[
    ["Symétrique","","Une même clé pour chiffrer et déchiffrer."],
    ["Asymétrique","","Une paire de clés (publique / privée)."],
    ["Hybride","","Combine les deux : l'asymétrique sécurise l'échange de la clé symétrique."]]}]}
 ]},
 {id:"E07", t:"Bits, octets, numération", sub:"Unités binaires, multiples (SI vs binaires), bases de numération et encodage", parts:[
  {h:"Bit & octet", g:[
   {cols:[
    ["Bit","binary digit, symbole : b","Un chiffre binaire qui ne prend que deux valeurs : 0 ou 1. Les ordinateurs traitent exclusivement des informations codées avec des bits."],
    ["Octet","byte, symbole : o (FR) / B (EN)","1 octet = 8 bits. Ne pas confondre bit (b) et byte/octet (B) : attention à la majuscule !"]]}]},
  {h:"Les multiples : SI vs binaires", g:[
   {p:"Historiquement, kilo/méga/giga représentaient des puissances de 2 (1 kilobit = 2¹⁰ = 1 024 bits), ce qui ne correspond pas au système métrique (1 km = 1 000 m). D'où une confusion : parfois 1 000, parfois 1 024. La norme de 1998 crée les préfixes binaires (kibi, mébi, gibi…) pour lever l'ambiguïté."},
   {table:{head:["Préfixe","Décimal (SI, puissance de 10)","Binaire (puissance de 2)"], rows:[
    ["kilo / kibi","ko = 10³ = 1 000 o","Kio (KiB) = 2¹⁰ = 1 024 o"],
    ["méga / mébi","Mo = 10⁶ o","Mio (MiB) = 2²⁰ = 1 048 576 o"],
    ["giga / gibi","Go = 10⁹ o","Gio (GiB) = 2³⁰ o"],
    ["téra / tébi","To = 10¹² o","Tio (TiB) = 2⁴⁰ o"],
    ["péta / pébi","Po = 10¹⁵ o","Pio (PiB) = 2⁵⁰ o"]]}},
   {p:"Mêmes préfixes pour les bits (kbit, Mbit… / Kibit, Mibit…). Attention à la casse : b = bit, B = byte (octet)."}]},
  {h:"Le piège des fabricants", g:[
   {p:"Vous achetez un disque de 1 TB (= 1 téraoctet = 10¹² octets selon le fabricant). Une fois branché, l'OS n'affiche que ~930 Go ! Le fabricant compte en TB (10¹²) tandis que le système affiche en TiB (2⁴⁰). Aucune donnée n'a disparu : c'est une différence d'unité."}]},
  {h:"Numération : les bases", g:[
   {p:"La numération est le principe de représentation des nombres. En informatique, on utilise plusieurs bases :"},
   {table:{head:["Système","Base","Chiffres & comptage"], rows:[
    ["Décimal","10","0 à 9"],
    ["Octal","8","0 à 7 → 0, 1… 7, 10, 11, 12… 17, 20…"],
    ["Hexadécimal","16","0 à F → … 8, 9, A, B, C, D, E, F, 10, 11…"],
    ["Binaire","2","0 et 1 → 0, 1, 10, 11, 100, 101, 110, 111…"]]}},
   {p:"On convertit d'une base à l'autre par des formules, un convertisseur en ligne ou une calculatrice scientifique."}]},
  {h:"Encoder les caractères", g:[
   {p:"Convertir un nombre en binaire est direct ; pour les caractères, on les encode. Un **jeu de caractères codés** (norme d'encodage) est une façon de représenter des caractères (le code Morse en est un exemple)."},
   {cols:[
    ["ASCII","American Standard Code for Information Interchange","La norme la plus connue, mais limitée à 128 caractères : suffit pour l'anglais, pas pour le français (accents)."],
    ["Unicode & UTF-8","depuis le début des années 90","Codage cohérent de la plupart des systèmes d'écriture. Unicode 13.0 (2020) : 143 859 caractères, 154 écritures, symboles et émojis."]]}]}
 ]},
 {id:"E08", t:"Adressage IP", sub:"Adresses IPv4, masques de sous-réseau, calculs binaires et méthode du nombre magique", parts:[
  {h:"L'adresse IP", g:[
   {def:"**Adresse IP** = l'« adresse postale » d'une machine sur un réseau utilisant la suite de protocoles TCP/IP : elle permet d'envoyer et de recevoir des données."},
   {cols:[
    ["IPv4","","Plus ancienne, nombre limité (~4,3 milliards d'adresses). Objet de ce module."],
    ["IPv6","","Plus moderne, nombre d'adresses quasi illimité (vue plus tard)."]]}]},
  {h:"Structure d'une adresse IPv4", g:[
   {p:"Une IPv4 = 4 nombres de 0 à 255 séparés par des points (ex. : 192.168.1.1), soit 4 octets = 32 bits (4 blocs de 8 bits). Sur notre réseau domestique, elle est attribuée par la box via le protocole DHCP."},
   {code:"décimal :      192 .      168 .        1 .        1\nbinaire : 1100 0000.1010 1000.0000 0001.0000 0001"},
   {p:"On ne dépasse pas 255 par bloc : 255 = 1111 1111 en binaire (8 bits)."}]},
  {h:"Le masque de sous-réseau", g:[
   {p:"Dans une IP, une partie identifie le réseau, l'autre la machine : c'est le **masque de sous-réseau** qui fait la séparation. Il ressemble à une IP (4 octets, 32 bits) et est aussi fourni par la box via DHCP. Ex. : 255.255.255.0."},
   {def:"**Règle** : un masque ne peut pas avoir n'importe quelles valeurs : tous les 1 à gauche, tous les 0 à droite."},
   {p:"Pour communiquer directement (sans routeur), deux machines doivent être sur le même réseau : même début d'adresse IP et même masque."}]},
  {h:"Trouver l'adresse de réseau (ET logique)", g:[
   {p:"On réalise un **ET logique** bit-à-bit entre l'adresse IP et le masque (1 ET 1 = 1, sinon 0). Exemple pour la machine A : 192.168.1.42 / 255.255.255.0."},
   {code:"adresse : 1100 0000.1010 1000.0000 0001.0010 1010\nmasque  : 1111 1111.1111 1111.1111 1111.0000 0000\n-------------------------------------------------\nET      : 1100 0000.1010 1000.0000 0001.0000 0000\ndécimal :       192.      168.        1.        0"},
   {p:"L'adresse de réseau est donc 192.168.1.0. Deux machines d'un même réseau ont la même adresse de réseau."}]},
  {h:"Nombre d'adresses & adresses réservées", g:[
   {p:"Pour le nombre d'adresses, on compte les 0 du masque en binaire. Ici 8 zéros → 2⁸ = 256 adresses. Sur tout sous-réseau, 2 adresses sont réservées :"},
   {table:{head:["Adresse","Exemple (192.168.1.0 /24)"], rows:[
    ["Adresse de réseau (1re)","192.168.1.0"],
    ["Première adresse utilisable","192.168.1.1"],
    ["Dernière adresse utilisable","192.168.1.254"],
    ["Adresse de broadcast (dernière)","192.168.1.255"]]}},
   {p:"Soit 256 − 2 = 254 machines max. Le broadcast permet d'envoyer un paquet à toutes les machines du réseau. Besoin de plus de machines ? On ajoute des 0 au masque (ex. : 255.255.252.0 → 10 zéros → 2¹⁰ − 2 = 1 022 machines)."}]},
  {h:"Résumé : les 5 étapes", g:[
   {steps:[
    ["Masque de sous-réseau","Selon le nombre de machines (avec marge) → ajouter plus ou moins de 0"],
    ["Adresse de réseau","ET logique bit-à-bit entre l'IP et le masque"],
    ["Première utilisable","Adresse de réseau + 1"],
    ["Adresse de broadcast","NOT du masque, puis OU logique avec l'adresse de réseau"],
    ["Dernière utilisable","Adresse de broadcast − 1"]]}]},
  {h:"Méthode du nombre magique", g:[
   {def:"**Nombre magique = 256 − octet significatif**. L'octet significatif est celui où le masque sépare la partie réseau de la partie machine. On calcule ensuite tous ses multiples jusqu'à 256."},
   {p:"Pour l'adresse de réseau, remplacer l'octet significatif de l'IP par le multiple inférieur ou égal (octets suivants à 0). Pour le broadcast, le multiple suivant − 1 (octets suivants à 255)."},
   {code:"IP        : 192.168.42.5   masque : 255.255.224.0\nmagique   : 256 - 224 = 32\nmultiples : 0, 32, 64, 96, 128, 160, 192, 224, 256\nréseau    : 192.168.32.0     (32 = multiple <= 42)\nbroadcast : 192.168.63.255   (64 - 1 = 63)"},
   {p:"Autre exemple : 172.16.53.20 / 255.255.255.128 → nombre magique 128, multiples 0/128/256 → réseau 172.16.53.0, broadcast 172.16.53.127."}]}
 ]}
],
SA2:[
 {id:"01", t:"Outils bureautique", sub:"Suites Microsoft Office et LibreOffice : logiciels, versions et alternatives", parts:[
  {h:"Qu'est-ce qu'un outil bureautique ?", g:[
   {def:"**Outil bureautique** = logiciel conçu pour réaliser les tâches courantes au bureau : gestion de documents, de tableaux de données, de présentations, de courriers électroniques, etc."},
   {p:"Usages principaux : rédiger des documents (traitement de texte), analyser des données (tableurs), créer des présentations (diaporamas), gérer emails et calendriers, mais aussi prise de notes, gestion de projet, édition de PDF, compression…"}]},
  {h:"La suite Microsoft Office", g:[
   {p:"Suite bureautique développée par Microsoft, dédiée à la productivité :"},
   {kv:[
    ["Word","Traitement de texte (mise en forme, styles, images, tableaux, suivi des modifications, commentaires)"],
    ["Excel","Tableur (formules, graphiques, tableaux croisés dynamiques)"],
    ["PowerPoint","Présentations (thèmes, animations, transitions). Rester simple, cohérent, clair"],
    ["Outlook","Emails et calendriers (règles de filtrage, contacts, partage de calendriers)"],
    ["Access","Bases de données (tables, requêtes, formulaires, rapports)"]]},
   {p:"Lancée en 1990. Versions Home & Student (particuliers) vs Office 365 (entreprises, + Outlook/Teams)."}]},
  {h:"Office 365 vs Office 2024", g:[
   {cols:[
    ["Office 365","par abonnement, cloud","Accès à toutes les apps + stockage cloud OneDrive, co-édition en temps réel et mises à jour automatiques."],
    ["Office 2024","licence perpétuelle","Achat unique, sans abonnement : pas de mises à jour régulières ni de services cloud intégrés. Dernière version « classique »."]]}]},
  {h:"LibreOffice (alternative gratuite)", g:[
   {p:"Suite gratuite, open-source et multiplateforme (The Document Foundation), compatible avec les formats Office (docx, xlsx, pptx)."},
   {table:{head:["LibreOffice","Équivalent","Atout spécifique"], rows:[
    ["Writer","Word","Styles, tableaux, suivi des modifications et commentaires"],
    ["Calc","Excel","Bonne gestion des CSV et compatibilité macros"],
    ["Impress","PowerPoint","Personnalisable, export PDF direct"],
    ["Base","Access","Compatible MySQL / PostgreSQL"]]}}]},
  {h:"Comparaison & alternatives", g:[
   {kv:[
    ["LibreOffice","Gratuit et open-source (sans licence payante), plus léger et moins gourmand, mis à jour par une communauté active"],
    ["Microsoft Office","Standard du marché, collaboration cloud intégrée et fonctionnalités très complètes"]]},
   {p:"Pour trouver d'autres logiciels, des sites comme AlternativeTo, Capterra ou Alternative.me proposent comparaisons et avis."}]}
 ]},
 {id:"02", t:"Diagnostic & résolution d'incidents", sub:"Outils Windows et SysInternals, dépannage du démarrage, sauvegardes", parts:[
  {h:"Enjeux & outils Windows de base", g:[
   {p:"Un diagnostic d'incident efficace limite l'interruption de service, la baisse de productivité et la perte de données, et peut révéler des failles de sécurité. Trois outils intégrés à Windows :"},
   {kv:[
    ["Gestionnaire de tâches","Surveiller les performances en temps réel (CPU, mémoire), arrêter un processus, gérer les programmes au démarrage"],
    ["Observateur d'événements","Consulter les journaux (erreurs, avertissements, événements critiques) : crashs, pannes, sécurité"],
    ["Résolution des problèmes","Diagnostic et correction automatisés (réseau, périphériques, mises à jour)"]]}]},
  {h:"Outils avancés", g:[
   {kv:[
    ["PSR (Problem Steps Recorder)","Enregistre les actions sous forme de captures + descriptions : idéal pour transmettre un incident au support"],
    ["Netstat","Connexions réseau actives en ligne de commande : netstat -ano, -b (processus propriétaire)"]]},
   {h:"Suite SysInternals (Microsoft)", kv:[
    ["Process Explorer","Gestionnaire de tâches avancé : analyse approfondie des processus"],
    ["TCPView","Connexions réseau et ports utilisés, en temps réel"],
    ["Autoruns","Programmes lancés au démarrage (les désactiver si besoin)"],
    ["Process Monitor","Surveille les accès aux fichiers et au registre"]]}]},
  {h:"La chaîne de démarrage Windows", g:[
   {kv:[
    ["BootMGR","Le Boot Manager (remplace NTLDR depuis Vista) : charge l'OS après le BIOS/UEFI"],
    ["Winload.exe","Prend le relais : charge le noyau et les pilotes critiques (la RAM est chargée ici)"],
    ["WinResume.exe","Gère la reprise après hibernation (restaure la session via hiberfil.sys)"],
    ["BCD","Boot Configuration Data : base des paramètres de démarrage (équivalent moderne de boot.ini)"]]}]},
  {h:"Réparer le démarrage", g:[
   {p:"L'utilitaire **bootrec** répare les problèmes de démarrage :"},
   {kv:[["bootrec /fixmbr","Répare le MBR"],["bootrec /fixboot","Répare le secteur de démarrage"],["bootrec /rebuildbcd","Reconstruit le BCD"]]},
   {p:"Sans la ligne de commande : **Réinitialiser ce PC** (conserver mes fichiers / tout supprimer), **Démarrage avancé** (réparation du démarrage, options avancées) et **Restauration du système** (revenir à un point antérieur, doit être activée au préalable)."}]},
  {h:"Outils disque & système", g:[
   {kv:[
    ["DiskPart","Gérer disques/partitions (list disk, select disk, clean)"],
    ["CHKDSK","Vérifie le système de fichiers : /f répare, /r récupère les secteurs défectueux"],
    ["DISM","Répare l'image système : /checkhealth, /restorehealth"],
    ["Memory Diagnostic","Teste l'intégrité de la RAM (écrans bleus, redémarrages)"],
    ["Éditeur de Registre","regedit : clés HKLM (système), HKCU (utilisateur), HKCR (associations). Les clés Run listent les programmes au démarrage. Modifier avec prudence !"],
    ["Gestionnaire de périphériques","Installer / mettre à jour / restaurer un pilote, repérer un périphérique défectueux (icône d'alerte)"]]}]},
  {h:"Sauvegarde & logiciels tiers", g:[
   {cols:[
    ["Sauvegarde Windows","","**Historique des fichiers** : copies régulières des fichiers personnels. **Sauvegarde système** : image complète (fichiers + programmes + paramètres)."],
    ["Logiciels tiers utiles","","CCleaner (nettoyage), Malwarebytes (anti-malware), AOMEI Backupper (images/clonage), HiJackThis (diagnostic)."]]},
   {p:"Précautions : télécharger depuis des sources fiables, éviter d'en cumuler trop (ressources), vérifier la compatibilité Windows."}]}
 ]},
 {id:"03", t:"Contrôle à distance & procédures", sub:"Télémaintenance : solutions natives, tierces et cloud, rédaction de procédures", parts:[
  {h:"Le contrôle à distance", g:[
   {def:"**Contrôle à distance** (télémaintenance / assistance à distance) = gérer, superviser et dépanner un équipement à distance, sans présence physique sur le site."},
   {p:"Avantages : réduit les coûts (plus de déplacement), améliore la productivité (plus de problèmes résolus par jour) et offre une grande flexibilité (intervention immédiate, 24/24, sans contrainte géographique). Concerne PC/portables (Windows, macOS, Linux), serveurs, voire tablettes/smartphones et périphériques."}]},
  {h:"Types d'interventions", g:[
   {cols:[
    ["Préventive","","Planifiée à l'avance : mises à jour, vérifications régulières avant qu'un problème ne survienne."],
    ["Curative (dépannage)","","Réactive : imprimante non détectée, logiciel qui plante, aide à une opération."],
    ["Installation","","Déployer des logiciels tiers pour adapter l'environnement aux besoins."]]}]},
  {h:"Prérequis & sécurité", g:[
   {ul:[
    "Connexion Internet fiable (une liaison lente rend l'expérience frustrante).",
    "Authentification forte (pas un simple mot de passe) et chiffrement (TLS 1.2 minimum).",
    "Plan B en cas de panne de l'outil ; formation des techniciens et utilisateurs.",
    "Communication claire : expliquer quand/comment on accède à la machine, respecter la confidentialité, documenter."]},
   {p:"Coûts à prévoir : logiciels (achat/abonnement), infrastructure IT, conformité (RGPD) et formation. Face au sur-site (déplacement, frais, attente), le ROI du distant devient vite évident."}]},
  {h:"Les solutions", g:[
   {h:"Natives aux OS", kv:[
    ["Windows","Bureau à distance (RDP, connexion locale + ouverture de ports), Assistance rapide (compte Microsoft requis), PowerShell Remoting (WinRM)"],
    ["Linux","GNOME Remote Desktop (Ubuntu/Debian), SSH (administration par shell, ex. via PuTTY sous Windows)"]]},
   {h:"Cloud (supervision web)", kv:[
    ["Principe","L'app tourne dans un environnement virtuel (appliance), pas installée localement. Atouts : accès universel, gestion centralisée, sécurité, scalabilité. Ex. : Citrix, Microsoft RDS / Azure Virtual Desktop"]]},
   {h:"Tierces", kv:[
    ["VNC","Solution historique (vieux protocole, serveur + client) : nécessite une sécurité renforcée (ex. via SSH). Ex. : RealVNC, UltraVNC, TightVNC (open-source)"],
    ["AnyDesk","Rapide même sur connexion lente, peu coûteux, TLS 1.2, multiplateforme. Moins de gestion centralisée pour les grands parcs"],
    ["TeamViewer","Très populaire, multiplateforme, chiffrement de bout en bout, collaboration. Coût par utilisateur élevé"]]}]},
  {h:"Communication & procédures", g:[
   {cols:[
    ["Relation avec l'utilisateur","","Poser les bonnes questions pour cerner le problème. Adapter le discours au niveau de l'utilisateur. Expliquer chaque étape et rassurer (sécurité, confidentialité)."],
    ["Bonne procédure (mode opératoire)","","Titre & contexte (quel problème ?) · pré-requis (outils, accès) · étapes détaillées (captures, par OS) · résultats attendus + solutions alternatives."]]},
   {p:"Documenter = standardiser, transmettre les connaissances et gagner du temps ; une FAQ/intranet permet aux utilisateurs de résoudre seuls certains cas."}]},
  {h:"À distance ou sur site ?", g:[
   {cols:[
    ["À distance","","Problèmes logiciels, configurations réseau, installations : rapides et sans frais de déplacement."],
    ["Sur site","","Problèmes matériels, diagnostics physiques : un pré-diagnostic à distance réduit le temps d'immobilisation."]]}]}
 ]},
 {id:"04", t:"Incidents hardware & réglementation", sub:"Diagnostic matériel, outils de test, réglementation DEEE et RGPD", parts:[
  {h:"Méthode de diagnostic", g:[
   {p:"Avant de démonter, quelques gestes simples : nettoyer la poussière (souvent en cause), débrancher les périphériques (garder clavier/souris + écran), tester avec des câbles en bon état, puis faire un test de démarrage."},
   {cols:[
    ["1. Identifier les symptômes","","Écran noir ? Erreurs à l'écran ? Poussière, comportement anormal, sons inhabituels. Messages d'erreur du BIOS/UEFI."],
    ["2. Isoler la cause","","Un composant empêche-t-il le démarrage ? (carte mère, processeur, RAM, alimentation). Une fois l'écran BIOS accessible, on utilise les outils de diagnostic."]]},
   {p:"Analogie corps humain : le système « sanguin » (alimentation) fait circuler l'énergie, le système « nerveux » (bus/liaisons) la data. Ne pas oublier la pile du BIOS/UEFI qui l'alimente PC éteint."}]},
  {h:"Diagnostiquer un écran noir", g:[
   {kv:[
    ["Branchements & câbles","Prises (écran, PC), changer les câbles électriques externes"],
    ["Alimentation","Tester / changer le bloc d'alimentation"],
    ["Carte graphique","La débrancher et utiliser la sortie de la carte mère"],
    ["RAM & pile BIOS","Vérifier la barrette ; changer la pile ; tenter un clear CMOS (jumper)"],
    ["Cas graves","Remplacer la carte mère (compatibilité CPU/RAM) ou le processeur"]]},
   {p:"Écran noir avec message : souvent le disque dur. Erreur Windows au démarrage : tester en mode normal puis sans échec. Machine qui s'allume mais autres erreurs : probablement logiciel (virus, mauvaise mise à jour)."}]},
  {h:"Outils de diagnostic matériel", g:[
   {p:"À utiliser uniquement si le PC démarre."},
   {kv:[
    ["Multimètre","Vérifier l'alimentation électrique (tensions 3,3 V, 5 V, 12 V)"],
    ["POST (BIOS/UEFI)","Power-On Self Test : détecte les composants en panne avant l'OS (codes/bips)"],
    ["CPU-Z / HWMonitor","Températures, fréquences, ventilateurs (très complet)"],
    ["MemTest86(+)","Test de la RAM (bootable) ; sinon retirer une barrette à la fois"],
    ["CrystalDiskInfo / Mark","Santé et performance des disques (HD Tune pour la surface)"],
    ["OCCT / BatteryBar","Test de charge alimentation ; test de batterie (sur 1-2 semaines)"]]}]},
  {h:"Réparer ou remplacer ?", g:[
   {cols:[
    ["Réparer","","RAM : nettoyer les contacts, repositionner. Disque : réallocation des secteurs ; cloner avant si données critiques. BIOS/UEFI : reset ou flash du firmware."],
    ["Remplacer","","RAM (modèle compatible), alimentation (puissance adaptée), carte graphique / carte mère si aucune réparation possible, en veillant à la compatibilité."]]},
   {p:"Cas complexes : pannes intermittentes, surchauffe, conflits matériels (souvent après une mise à jour ou un changement de matériel)."}]},
  {h:"Réglementation DEEE", g:[
   {def:"**DEEE** = Déchets d'Équipements Électriques et Électroniques en fin de vie (directive européenne 2012/19/UE). Tout appareil électrique ou à piles en fin de vie est un DEEE."},
   {kv:[
    ["Enjeux","Matériaux polluants (plomb, mercure, cadmium), pollution des sols/eaux, ressources rares, ~50 millions de tonnes/an"],
    ["Obligations","Trier, confier à une filière agréée, assurer le suivi et la destruction des données (ex. DBAN, Eraser)"],
    ["Bonnes pratiques","Privilégier le reconditionnement et la réutilisation, sensibiliser, tracer"]]}]},
  {h:"Le RGPD", g:[
   {p:"Adopté en mai 2018, il protège les données personnelles dans l'UE. Sanctions : jusqu'à 20 M€ ou 4 % du CA mondial. La **CNIL** (autorité française, 1978) informe, contrôle et sanctionne."},
   {cols:[
    ["7 principes clés","","Licéité/loyauté/transparence · limitation des finalités · minimisation · exactitude · limitation de la conservation · intégrité & confidentialité · responsabilité (accountability)."],
    ["Droits des personnes","","Accès · rectification · effacement (« oubli ») · limitation · portabilité · opposition · non-décision automatisée."]]},
   {p:"En entreprise : registre des traitements, AIPD (analyse d'impact), consentement libre et éclairé, mesures techniques (pseudonymisation, chiffrement, sauvegardes), DPO. En cas de violation : **notifier la CNIL sous 72 h** et informer les personnes si le risque est élevé."}]}
 ]},
 {id:"06", t:"BIOS, UEFI, MBR & GPT", sub:"Firmware, partitionnement des disques et systèmes de fichiers", parts:[
  {h:"Firmware, puce BIOS & Clear CMOS", g:[
   {def:"**Firmware** = logiciel intégré au matériel, situé entre le hardware et l'OS (ex. : BIOS, UEFI, firmware de carte graphique). La puce BIOS est soudée à la carte mère et stocke ce firmware bas niveau."},
   {p:"**Clear CMOS** : réinitialise les paramètres du BIOS/UEFI aux valeurs d'usine. Le CMOS est la petite mémoire (alimentée par une pile) qui stocke la config (ordre de démarrage, date/heure, CPU). Se fait en retirant la pile ou via un jumper : utile en cas de mauvaise config ou de problème de démarrage."}]},
  {h:"Le BIOS", g:[
   {p:"Le **BIOS** (Basic Input/Output System) initialise le matériel puis cherche le secteur de démarrage pour lancer l'OS. Interface textuelle au clavier, datée ; accès via F2 ou Suppr."},
   {h:"Paramètres clés", ul:["Boot Order, Legacy USB, date/heure","S.M.A.R.T. (santé disque)","Config CPU & alimentation (Wake-on-LAN), ventilateurs/températures","Sécurité (mots de passe)","Virtualisation (Intel VT-x / AMD-V)","Mise à jour (flash)"]},
   {p:"Flasher le BIOS/UEFI améliore stabilité et compatibilité, mais n'est pas sans risque : si la mise à jour plante, la carte mère peut devenir inutilisable."},
   {p:"Limitations du BIOS : disques de 2 To max, mode 16 bits, pas d'USB 3.0 ni de Secure Boot natif."}]},
  {h:"L'UEFI & comparaison", g:[
   {p:"L'**UEFI** (Unified Extensible Firmware Interface) succède au BIOS : interface graphique (souris), gère les disques > 2 To (via GPT) et fonctionne en 32/64 bits."},
   {cols:[
    ["Secure Boot","","Seul un OS signé et approuvé peut démarrer (vérification de la signature) : bloque rootkits et logiciels non autorisés."],
    ["Fast Boot","","Accélère le démarrage en sautant certaines vérifications matérielles non essentielles."],
    ["CSM / TPM / PXE","","CSM (compatibilité BIOS), TPM (chiffrement), Network Boot PXE (démarrage réseau)."]]},
   {table:{head:["Critère","BIOS","UEFI"], rows:[
    ["Mode","16 bits","32 / 64 bits"],
    ["Taille de disque","≤ 2 To","> 2 To (GPT)"],
    ["Interface & sécurité","Textuelle, basique","Graphique + Secure Boot"]]}}]},
  {h:"MBR vs GPT (partitionnement)", g:[
   {table:{head:["Critère","MBR (Master Boot Record)","GPT (GUID Partition Table)"], rows:[
    ["Partitions","4 principales max","Jusqu'à 128"],
    ["Taille disque","2 To max","> 2 To"],
    ["Robustesse","Vulnérable (un seul secteur)","Protection CRC32"],
    ["Firmware","BIOS (ancien)","Optimal avec UEFI"]]}}]},
  {h:"Systèmes de fichiers", g:[
   {table:{head:["Système","Taille fichier","Compatibilité & usage"], rows:[
    ["NTFS","> 4 Go","Windows (volumes 16 To+). Chiffrement, compression, permissions, journal. Disques internes Windows"],
    ["FAT32","4 Go max","Très compatible (Windows, macOS, Linux, appareils). Volume 32 Go max sous Windows. Petits fichiers / clés USB"],
    ["exFAT","> 4 Go","Léger et multiplateforme. Périphériques amovibles avec gros fichiers. Moins de fonctions avancées que NTFS"]]}}]}
 ]},
 {id:"07", t:"ITIL v4 : fondamentaux", sub:"Gestion des services, valeur, relations de service et 4 dimensions", parts:[
  {h:"Qu'est-ce qu'ITIL ?", g:[
   {def:"**ITIL** (Information Technology Infrastructure Library) = un référentiel de bonnes pratiques pour la gestion des services informatiques, axé sur la satisfaction client, l'optimisation des coûts, la gestion des risques et l'amélioration continue. Public, libre et évolutif."},
   {table:{head:["Version","Apport"], rows:[
    ["V1 · 1989","42 livres (création par la CCTA)"],
    ["V2 · 2000","Relation client/fournisseur, SLA, gestion des incidents/problèmes/changements/configuration"],
    ["V3 · 2007/11","Cycle de vie des services et co-création de valeur"],
    ["V4 · 2019","Le SVS et le modèle à 4 dimensions"]]}}]},
  {h:"Gestion des services & valeur", g:[
   {p:"La **gestion des services** = un ensemble de capacités organisationnelles spécialisées pour créer de la valeur sous forme de services. La valeur est subjective (perçue par les parties prenantes) et résulte d'une co-création entre fournisseur et consommateur."},
   {cols:[
    ["Valeur = résultats − (coûts + risques)","","On crée de la valeur en maximisant les résultats tout en minimisant coûts et risques."],
    ["Valeur = utilité + garantie","","**Utilité** : « ce que fait le service » (adapté à l'objectif). **Garantie** : « comment il fonctionne » : disponibilité, capacité, sécurité, continuité."]]}]},
  {h:"L'organisation & les rôles", g:[
   {kv:[
    ["Fournisseur de services","L'organisation qui fournit le service (interne ou externe)"],
    ["Client","Définit les exigences et porte la responsabilité des résultats"],
    ["Utilisateur","Celui qui utilise le service"],
    ["Sponsor","Celui qui alloue le budget de consommation du service"]]},
   {p:"D'autres parties prenantes co-créent de la valeur : employés, partenaires, société, actionnaires, régulateurs…"}]},
  {h:"Produits, services & relation", g:[
   {p:"L'organisation combine ses ressources (personnes, informations, technologies, partenaires, processus) en produits et services. Une **offre de services** décrit formellement : des biens (propriété transférée), un accès à des ressources (sans transfert) et des actions de service."},
   {def:"**Relation de service** = coopération fournisseur ↔ consommateur pour co-créer de la valeur : fourniture du service, consommation du service et gestion de la relation."}]},
  {h:"Les 4 dimensions de la gestion des services", g:[
   {steps:[
    ["Organisations & personnes","Structure, rôles, responsabilités, autorité, culture du service"],
    ["Information & technologie","Données, connaissances et technologies (cloud, IA, sécurité…). Qualité de l'info : disponibilité, intégrité, confidentialité, traçabilité"],
    ["Partenaires & fournisseurs","Relations et contrats : fourniture de services vs achat de marchandises"],
    ["Flux de valeur & processus","Activités coordonnées qui créent la valeur. Un processus : entrées → activités → livrables"]]}]},
  {h:"Les facteurs externes", g:[
   {p:"Chaque dimension subit des facteurs externes, analysés via des cadres :"},
   {cols:[
    ["PESTEL","","Politiques, Économiques, Sociaux, Technologiques, Environnementaux, Légaux."],
    ["STEEPLE","","Variante de PESTEL ajoutant la dimension éthique."],
    ["SWOT","","Forces, Faiblesses, Opportunités, Menaces (interne/externe)."]]}]}
 ]},
 {id:"08", t:"ITIL v4 : SVS & CVS", sub:"Système de valeur, 7 principes directeurs, chaîne de valeur et pratiques", parts:[
  {h:"Le Système de Valeur des Services (SVS)", g:[
   {def:"**SVS** = décrit comment tous les composants et activités d'une organisation fonctionnent ensemble, en système, pour permettre la création de valeur. Il s'interface avec d'autres organisations (écosystème)."},
   {p:"Les opportunités et demandes entrent dans le SVS et déclenchent les activités menant à la valeur. Ses 5 éléments :"},
   {steps:[
    ["Principes directeurs","Recommandations universelles"],
    ["Gouvernance organisationnelle",""],
    ["Chaîne de valeur des services (CVS)",""],
    ["Pratiques","Ressources pour accomplir un objectif"],
    ["Amélioration continue",""]]}]},
  {h:"Les 7 principes directeurs", g:[
   {table:{head:["#","Principe (fiche)","Idée"], rows:[
    ["1","Accent sur la valeur","Tout doit être lié à la valeur pour les parties prenantes"],
    ["2","Commencer par le pourquoi","Partir de l'existant, ne pas repartir de zéro inutilement"],
    ["3","Progresser itérativement","Par petites étapes, avec rétroaction"],
    ["4","Transparence & collaboration","Rendre le travail visible, partager l'information"],
    ["5","Impliquer les parties prenantes","Approche holistique : rien n'est isolé"],
    ["6","Adapter l'approche","Aux besoins et contraintes propres à l'organisation"],
    ["7","Automatiser & optimiser","La techno pour les tâches répétitives, sans négliger l'humain"]]}},
   {p:"Ces principes s'influencent mutuellement et se renforcent."},
   {p:"Correction : intitulés officiels ITIL 4 : Privilégier la valeur · Commencer là où vous êtes (et non « par le pourquoi ») · Progresser par itération avec des retours · Collaborer et promouvoir la visibilité · Penser et travailler de façon holistique · Opter pour la simplicité et rester pratique · Optimiser et automatiser."}]},
  {h:"Amélioration continue & gouvernance", g:[
   {cols:[
    ["Roue de Deming (PDCA)","","Plan / Do / Check / Act : le cycle de l'amélioration continue, à tous les niveaux. Modèle en 7 étapes : vision ? → où sommes-nous ? → où aller ? → comment ? → action → arrivés ? → garder l'élan."],
    ["Mesure & gouvernance","","On mesure pour : évaluer, suivre les progrès, décider sur des données, communiquer. Repères : **CSF** (facteur critique de succès) et **KPI** (indicateur clé). La gouvernance (entité dirigeante) évalue, oriente et surveille."]]}]},
  {h:"La Chaîne de Valeur des Services (CVS)", g:[
   {p:"Modèle opérationnel décrivant les 6 activités clés pour répondre à la demande et créer de la valeur (début : demande/opportunité → fin : produits/services, avec boucle de rétroaction) :"},
   {kv:[
    ["Planifier","Vision et direction partagées sur les 4 dimensions"],
    ["Améliorer","Amélioration continue des produits, services et pratiques"],
    ["Engager","Comprendre les besoins et entretenir les relations avec les parties prenantes"],
    ["Concevoir & transformer","Garantir qualité, coûts et délais de mise sur le marché"],
    ["Obtenir & construire","Disposer des composants de service au bon endroit, au bon moment"],
    ["Fournir & supporter","Livrer et soutenir les services selon les attentes convenues"]]},
   {p:"Un **flux de valeur** est une suite d'étapes mobilisant tout ou partie de ces activités."}]},
  {h:"Les pratiques (34, en 3 catégories)", g:[
   {p:"Une **pratique** = un ensemble de ressources organisationnelles pour accomplir un objectif."},
   {kv:[
    ["Générales de gestion","Architecture, amélioration continue, sécurité de l'information, connaissances, mesures & rapports, portefeuille, projet, risques, financière, fournisseurs…"],
    ["Gestion des services","Incidents, problèmes, demandes, changements, niveaux de service (SLA), Centre de Services, configuration, disponibilité, capacité…"],
    ["Techniques","Gestion du déploiement, infrastructure & plateformes, développement de logiciels"]]},
   {p:"Ex. : la gestion de la sécurité de l'information vise la confidentialité, l'intégrité, la disponibilité (+ traçabilité, authenticité, non-répudiation), en équilibrant prévention, détection et correction."}]}
 ]},
 {id:"09", t:"Pratiques ITIL & GLPI", sub:"GLPI : gestion d'actifs, tickets, profils et indicateurs (TTO / TTR)", parts:[
  {h:"GLPI & concepts ITIL", g:[
   {def:"**GLPI** (Gestion Libre de Parc Informatique) = solution open-source de gestion des services IT, basée sur les bonnes pratiques ITIL : gestion des actifs, des tickets, des demandes et de l'assistance."},
   {p:"Trois processus ITIL clés s'y retrouvent : gestion des **incidents** (interruptions de service), des **demandes** (requêtes utilisateurs) et des **changements** (modifications de l'infrastructure)."}]},
  {h:"Les profils GLPI", g:[
   {kv:[
    ["Self-Service","Utilisateur final : soumet des demandes, suit ses tickets, accède aux ressources (favorise l'autonomie)"],
    ["Hotliner","Assistance de niveau 1 : répond aux appels, résout les problèmes courants"],
    ["Technicien","Incidents plus complexes, suivi des demandes, gestion des équipements"],
    ["Administrateur","Accès complet : configuration, utilisateurs, profils, rapports"],
    ["Observer","Managers : surveille statistiques et rapports pour décider"]]}]},
  {h:"Gestion des tickets & workflow incident", g:[
   {p:"L'interface de tickets permet de créer, suivre et résoudre incidents et demandes, avec priorisation selon l'impact et l'urgence. Selon ITIL, un **incident** est toute interruption ou réduction de qualité de service. Le workflow :"},
   {steps:["Détection et enregistrement de l'incident (ticket)","Classification et priorisation (impact / urgence)","Résolution par le technicien assigné","Clôture une fois la solution validée"]}]},
  {h:"Les indicateurs (TTO / TTR)", g:[
   {cols:[
    ["TTO","Temps Total d'Ouverture","Délai entre la création du ticket et sa prise en charge. Ex. : créé 10h00, traité 10h30 → TTO = 30 min (réactivité)."],
    ["TTR","Temps Total de Résolution","Délai entre la création et la résolution/clôture. Ex. : créé 10h00, résolu 12h00 → TTR = 2 h (efficacité)."]]},
   {p:"Les versions internes (TTO/TTR internes) excluent les temps d'attente externes. Autres mesures : temps moyen de résolution, nombre de tickets ouverts, satisfaction utilisateurs."},
   {p:"Correction : en anglais, TTO = Time To Own (délai de prise en charge) et TTR = Time To Resolve (délai de résolution). Le sens donné dans la fiche est juste."}]},
  {h:"Les autres modules", g:[
   {kv:[
    ["Gestion des actifs","Recenser les équipements (PC, serveurs, imprimantes), historique, liaison aux tickets/contrats"],
    ["Base de connaissances","Documenter les solutions récurrentes ; articles liés aux tickets"],
    ["Contrats & licences","Suivi des contrats (maintenance/garantie) et licences avec alertes d'expiration (conformité)"],
    ["Stocks & projets","Suivi du matériel (commande → livraison) et gestion des projets IT"],
    ["Changements (ITIL)","Tickets de changement avec approbation/validation"],
    ["Rapports, droits, plugins","Statistiques, gestion fine des droits/traçabilité, intégrations (Nagios, IAM, backup) et plugins"]]}]}
 ]}
],
SA3:[
 {id:"01", t:"Réseaux : introduction", sub:"Programme de la saison 3, équipements (Cisco, pfSense) et outils de simulation", parts:[
  {h:"Au programme de la saison 3", g:[
   {p:"Cette saison est consacrée aux réseaux informatiques. Les grands thèmes abordés (liste non exhaustive) :"},
   {ul:["Le modèle OSI","La suite de protocoles TCP/IP","L'adressage IPv4 & IPv6","Fonctionnement & configuration des switchs et routeurs","Gestion du WiFi","Sécurité réseau","Interconnexion de sites distants","Mise en place de serveurs VPN","Paramétrage d'un pare-feu"]}]},
  {h:"Équipements & appliances", g:[
   {p:"Il existe de nombreux fabricants d'équipements et d'appliances réseau. Dans cette formation, on se concentre sur :"},
   {cols:[
    ["Switchs & routeurs Cisco","","Les commutateurs et routeurs Cisco, référence du marché professionnel."],
    ["pfSense","","L'appliance routeur / pare-feu pfSense (solution open source)."]]}]},
  {h:"Outils de simulation", g:[
   {cols:[
    ["Cisco Packet Tracer","","Simulateur réseau de Cisco, idéal pour débuter et s'entraîner."],
    ["GNS3","","Émulateur réseau plus avancé, capable de faire tourner de vrais systèmes."]]}]}
 ]},
 {id:"02", t:"La communication réseau", sub:"Règles, protocoles, encodage, encapsulation, diffusion et architectures", parts:[
  {h:"Les 3 éléments d'une communication", g:[
   {p:"Quand deux systèmes (personnes ou machines) échangent des informations, toute méthode de communication a besoin de 3 éléments :"},
   {cols:[
    ["Source","","L'expéditeur du message."],
    ["Destination","","Le destinataire du message."],
    ["Canal","","Le support qui achemine le message de la source à la destination."]]}]},
  {h:"Protocoles de communication", g:[
   {def:"**Protocole** = l'ensemble des règles qui régissent une communication. Il est spécifique au type de communication (les règles d'un appel téléphonique diffèrent de celles d'un courrier postal)."},
   {p:"Pour transmettre l'information avec succès, un protocole doit gérer : l'identification de l'expéditeur et du destinataire, une langue / syntaxe commune, une vitesse et un rythme adaptés, et une confirmation (accusé de réception). Les protocoles réseau ajoutent : codage, format & encapsulation, taille, synchronisation et options de remise des messages."}]},
  {h:"Encodage & encapsulation", g:[
   {cols:[
    ["Encodage","","Conversion de l'information vers un autre format pour la transmettre (le décodage est l'inverse). En informatique : les infos sont encodées en bits (0/1), envoyées sur un média (cuivre, fibre, ondes radio), puis décodées à l'arrivée."],
    ["Encapsulation","","Comme glisser une carte dans une enveloppe avec une adresse. Le message est encapsulé dans une trame qui porte l'adresse de destination et l'adresse source. À l'arrivée : désencapsulation."]]},
   {p:"Un message mal formaté n'est ni livré ni traité. Un message trop long est découpé en plusieurs trames ; une trame trop longue ou trop courte n'est pas transmise (les trames contiennent de quoi recomposer le message)."}]},
  {h:"Synchronisation des messages", g:[
   {kv:[
    ["Contrôle de flux","Définit la quantité et la vitesse de transmission des données"],
    ["Délai de réponse","Sans réponse dans un délai acceptable, on suppose qu'il n'y en a pas et on réagit"],
    ["Méthode d'accès","Définit quand un hôte peut émettre (pour éviter d'envoyer en même temps)"]]}]},
  {h:"Destinataires & directionnalité", g:[
   {h:"Nombre de destinataires", kv:[["Unicast","Un seul destinataire"],["Multicast","Plusieurs destinataires"],["Broadcast","Tout le monde sur le réseau"]]},
   {h:"Sens de communication", kv:[["Simplex","Un seul sens (TV, radio FM)"],["Half-duplex","Deux sens, non simultanés (talkie-walkie)"],["Full-duplex","Deux sens simultanés (téléphone)"]]}]},
  {h:"Architectures de communication", g:[
   {cols:[
    ["Client / Serveur","","Le serveur fournit un service (ex. : un site web) que le client consomme. Analogie : au café, le client commande, le serveur apporte."],
    ["Pair-à-pair (peer-to-peer)","","Chaque machine est à la fois client et serveur (partage de fichiers, torrents, eMule…). Inconvénient : pas de gestion centralisée."]]}]}
 ]},
 {id:"03", t:"Les serveurs", sub:"Serveur matériel (rack, salle serveur) et serveur logiciel (services réseau)", parts:[
  {h:"Un serveur, c'est quoi ?", g:[
   {def:"Le mot **serveur** désigne deux choses différentes : un ordinateur (hardware) ou un logiciel (software) qui rend un service."}]},
  {h:"Le serveur matériel (hardware)", g:[
   {p:"Un serveur, c'est comme un ordinateur classique à l'intérieur : une (ou plusieurs) alimentation(s), processeur(s), disques durs, RAM, cartes d'extension, mais conçu pour fonctionner en continu (ex. : Dell PowerEdge R6615)."},
   {kv:[
    ["Format rack","Serveur « rackable » installé dans une armoire rack, de largeur normée 19 pouces"],
    ["Unité U","La hauteur d'un équipement est un multiple de 1U = 1,75 pouce (4,5 cm) → 1U, 2U, 3U, 4U…"],
    ["Baie de brassage","Utilise le même format 19 pouces (vue plus tard)"],
    ["Format tour","Comme une unité centrale de bureau : pour les TPE/PME sans salle serveur ni rack"]]}]},
  {h:"La salle serveur", g:[
   {p:"Dans les grandes entreprises et PME, une ou plusieurs salles serveurs regroupent les racks 19\", le cœur du réseau et les serveurs."},
   {cols:[
    ["Sécurité & environnement","","Climatisation permanente · accès restreint (digicode, empreinte, vidéosurveillance) · systèmes anti-incendie (parfois extinction par suppression d'oxygène)."],
    ["Onduleurs","","Les serveurs tournent 24h/24, 7j/7 : il faut garantir l'alimentation électrique. Les onduleurs (parfois au format rack 19\") évitent les coupures."]]}]},
  {h:"Le serveur logiciel (software)", g:[
   {p:"Un logiciel « serveur » est installé sur un ordinateur. Il n'a pas forcément d'interface graphique : son but est de rendre un service (ex. : servir des pages web). Il existe autant de types de serveurs que de protocoles client/serveur :"},
   {table:{head:["Type de serveur","Protocole","Rôle"], rows:[
    ["Serveur web","HTTP","Publication de pages / sites web"],
    ["Serveur de fichiers","FTP, NFS","Partage de dossiers et fichiers"],
    ["Serveur d'impression","SMB","Partage d'imprimantes"],
    ["Serveur d'annuaire","LDAP","Gestion des utilisateurs, groupes et machines"]]}}]}
 ]},
 {id:"04", t:"Ethernet & câblage", sub:"Protocole, normes, paires torsadées, catégories et câbles droit / croisé", parts:[
  {h:"Ethernet, c'est quoi ?", g:[
   {def:"**Ethernet** = un protocole de communication (et non un câble !). C'est lui qui permet à deux machines reliées de communiquer."},
   {table:{head:["Norme","Débit max & nom courant"], rows:[
    ["10BASE-T","10 Mbit/s"],["100BASE-T","100 Mbit/s · Fast Ethernet"],["1000BASE-T","1 Gbit/s · Gigabit Ethernet"],["10GBASE-T","10 Gbit/s · 10 Gigabit Ethernet"]]}},
   {p:"**Autonégociation** : la norme (Fast, Gigabit…) et le mode (half/full-duplex) sont choisis automatiquement par les cartes réseau des deux appareils."}]},
  {h:"Câble de paires torsadées", g:[
   {p:"« Câble Ethernet » est un abus de langage : il s'agit d'un câble de **paires torsadées**, composé de 4 paires de 2 fils de cuivre. Le type dépend du blindage (norme ISO 11801)."},
   {kv:[
    ["U/UTP","Aucun blindage : le moins cher"],
    ["F/UTP","Un blindage unique autour des 4 paires"],
    ["U/FTP","Blindage autour de chaque paire, pas autour des 4"],
