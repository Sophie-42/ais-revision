 {id:"01", t:"Introduction au cloud computing", sub:"Modèles de service : On-Prem, IaaS, PaaS, SaaS, 5 caractéristiques NIST et critères de choix", parts:[
  {h:"De l'On-Premises au cloud : brève histoire", g:[
   {def:"**Cloud computing** = infrastructure consommée comme l'électricité : on ne produit pas, on consomme à la demande, on paie ce qu'on consomme."},
   {kv:[
    ["1990-2000","On-Premises : achat serveurs, salle climatisée, câblage, OS, apps, maintenance. Investissement énorme, délais de semaines/mois"],
    ["Le problème","E-commerce : combien de serveurs acheter ? Trop → gaspillage. Trop peu → saturation. Black Friday down, janvier inutilisés. Impossible de s'adapter rapidement"],
    ["2006","Amazon lance AWS EC2 : puissance de calcul à l'heure, on paie ce qu'on utilise, création/destruction en minutes. L'IaaS était né"]]}]},
  {h:"Les 5 caractéristiques NIST du cloud", g:[
   {steps:[
    ["Accès réseau large bande","Accessible via Internet, depuis n'importe où, n'importe quel appareil"],
    ["Mise en commun des ressources","Ressources partagées entre clients, avec isolation logique garantie"],
    ["Libre-service à la demande","Provisionner sans intervention humaine, via un portail self-service"],
    ["Élasticité rapide","Scale up/down automatique, adaptation aux pics (ex. Black Friday)"],
    ["Service mesuré","Métriques + monitoring, facturation à l'usage, pay-as-you-go"]]},
   {def:"Si un service n'a pas ces 5 caractéristiques, **ce n'est pas du cloud**."}]},
  {h:"Les 4 modèles & la matrice de responsabilité", g:[
   {table:{head:["Composant","On-Prem","IaaS","PaaS","SaaS"], rows:[
    ["Application","Vous","Vous","Vous","Provider"],
    ["Données","Vous","Vous","Vous","Vous (toujours !)"],
    ["Runtime / Middleware","Vous","Vous","Provider","Provider"],
    ["OS","Vous","Vous","Provider","Provider"],
    ["Virtualisation","Vous","Provider","Provider","Provider"],
    ["Serveurs / Stockage / Réseau","Vous","Provider","Provider","Provider"],
    ["Datacenter","Vous","Provider","Provider","Provider"]]}},
   {p:"Plus on monte dans l'abstraction, plus c'est rapide et simple, mais plus on dépend du provider."}]},
  {h:"On-Premises & IaaS", g:[
   {cols:[
    ["On-Premises","sur site, vous gérez TOUT","+ Contrôle total, sécurité physique maîtrisée, perfs prévisibles, pas de coûts récurrents cloud. − CAPEX élevé, scalabilité lente, maintenance lourde, risques de sous/sur-dimensionnement. Quand ? Données ultra-sensibles (santé, défense), applis legacy impossibles à migrer, usage prévisible constant, zones sans Internet fiable."],
    ["IaaS","Infrastructure as a Service","VM + stockage + réseau ; vous gérez l'OS. + OPEX vs CAPEX, scalabilité rapide, haute dispo (SLA 99,9 % +), contrôle OS. − Gestion OS restante (patchs), compétences sys requises, coûts si mal dimensionné, sécurité applicative à vous. Ex. : AWS EC2 / EBS / VPC, GCP Compute Engine, OVHcloud Public Cloud, Amazon Lightsail. Cas : lift & shift, dev/test, contrôle OS, disaster recovery."]]}]},
  {h:"PaaS & SaaS", g:[
   {cols:[
    ["PaaS","Platform as a Service","Vous ne voyez même pas l'OS. + Focus sur le code, pas de gestion OS, déploiement ultra-rapide (git push), scaling auto, intégrations natives CI/CD. − Moins de contrôle, lock-in potentiel, contraintes de runtime, coût parfois plus élevé. Ex. : AWS Elastic Beanstalk, RDS, Lambda (serverless), GCP App Engine / Cloud SQL / Cloud Functions, Heroku, Amazon EKS."],
    ["SaaS","Software as a Service","Le provider gère TOUT. + Aucune gestion technique, déploiement immédiat (s'inscrire → utiliser), coût prévisible (abonnement/user), accessibilité totale. − Zéro personnalisation technique, dépendance totale au provider, questions de conformité/souveraineté, coûts cumulés à vie. Ex. : M365, Google Workspace, Salesforce, HubSpot, SAP S/4HANA Cloud, Zoom, Teams, Dropbox, GitHub."]]}]},
  {h:"L'analogie de la pizza & comparatif", g:[
   {table:{head:["Modèle","Pizza","Démo","Temps","Compétences"], rows:[
    ["On-Premises","Fait maison (ingrédients, pâte, four, nettoyage)","Proxmox","~35 min","Sys admin"],
    ["IaaS","À emporter (vous cuisez chez vous, on livre les ingrédients)","EC2","~15 min","Sys admin"],
    ["PaaS","Pizza livrée (cuite, prête à manger)","Beanstalk","~5 min","Développeur"],
    ["SaaS","Restaurant (tout est fait pour vous)","M365","~2 min","Utilisateur"]]}}]},
  {h:"Critères de choix & scénarios réels", g:[
   {kv:[
    ["Contrôle OS nécessaire","IaaS"],["Application standard (CRM, email)","SaaS"],["Focus développement, scaling","PaaS"],
    ["Conformité extrême (santé, défense)","On-Prem ou hybride"],["Pas d'équipe IT","SaaS"],["Migration simple","IaaS (lift & shift)"]]},
   {h:"Scénarios types", kv:[
    ["Startup tech","PaaS (Beanstalk/Heroku) + PaaS BDD (RDS) + SaaS outils (GitHub, Slack). Focus produit"],
    ["PME traditionnelle","SaaS pour tout (M365, Salesforce). Pas d'IT"],
    ["Hôpital","Hybride : On-Prem/IaaS certifié HDS pour données, SaaS pour outils non-critiques"],
    ["E-commerce","PaaS (auto-scaling) pour pics Black Friday"],
    ["Banque","On-Prem core banking (legacy) + Private Cloud/IaaS pour nouvelles apps + SaaS non-critiques"]]},
   {p:"Dans la vraie vie : la plupart des entreprises font du **mix hybride multi-cloud** : SaaS (M365, Salesforce) + PaaS (apps métier) + IaaS (VMs spécifiques) + On-Prem (legacy en transition)."}]}
 ]},
 {id:"02", t:"Responsabilité & réversibilité", sub:"Shared responsibility model, lock-in, standards ouverts, IaC, conteneurs, egress fees", parts:[
  {h:"Shared Responsibility Model : le principe", g:[
   {def:"**Provider** = responsable de la sécurité **DU** cloud. **Client** = responsable de la sécurité **DANS** le cloud."},
   {p:"La frontière dépend du modèle de service. Plus on monte en abstraction (IaaS → PaaS → SaaS), moins on gère l'infra, mais **données et accès = TOUJOURS votre responsabilité**."},
   {table:{head:["Domaine","On-Prem","IaaS","PaaS","SaaS"], rows:[
    ["Code applicatif","Vous","Vous","Vous","Provider"],
    ["Données","Vous","Vous","Vous","Vous"],
    ["Sauvegardes","Vous","Vous","Vous / Provider","Provider"],
    ["Patchs OS","Vous","Vous","Provider","Provider"],
    ["Sécurité applicative","Vous","Vous","Vous","Provider"],
    ["Sécurité infra","Vous","Provider","Provider","Provider"],
    ["Conformité (RGPD)","Vous","Partagée","Partagée","Partagée"]]}}]},
  {h:"Exemples concrets : qui est responsable ?", g:[
   {kv:[
    ["SQL Injection (faille applicative)","IaaS : vous patchez l'app. PaaS : vous patchez l'app, le provider gère OS/middleware. SaaS : le provider gère l'app, vous gérez les accès"],
    ["RGPD (données personnelles)","Provider (Azure) : DC en Europe dispo, certifs RGPD, DPA signé, outils de chiffrement. Vous : choisir la région Europe (pas US), droit à l'oubli, consentements, least privilege, registre des traitements, nommer un DPO. Non-conformité → amende pour vous, pas le provider"],
    ["Ransomware sur IaaS","Si pas de backup → données perdues, vous êtes responsable. Le provider assure l'infra non compromise et l'isolation. À vous : formation phishing, antivirus/EDR, sauvegardes, segmentation réseau"],
    ["Panne VM (SLA 99,9 %)","Le provider redémarre. Vous : 2+ VMs avec load balancer, état en base (pas en mémoire), monitoring. Sinon votre service reste down"]]}]},
  {h:"Sauvegardes : redondance ≠ backup", g:[
   {def:"« C'est dans le cloud, c'est sauvegardé » → **FAUX**. Un stockage GRS répliqué 6 fois n'est pas un backup : si vous supprimez, c'est supprimé partout. VMs IaaS par défaut : aucune sauvegarde, il faut activer Azure/AWS Backup."},
   {kv:[
    ["On-Prem","Vous (stratégie, exécution, stockage, tests)"],
    ["IaaS","Vous devez activer et configurer les backups"],
    ["PaaS BDD","Automatique 7-35 j côté provider · vous pour le long terme > 35 j"],
    ["SaaS","App sauvegardée par le provider · vérifier pour VOS données"]]},
   {p:"**Backup** = version précédente récupérable. **Redondance** = disponibilité, pas récupération."}]},
  {h:"Réversibilité & vendor lock-in", g:[
   {def:"**Réversibilité** = capacité à changer de provider ou revenir on-prem sans perte de données ni interruption majeure. **Lock-in** = dépendance forte qui rend cette sortie coûteuse ou impossible."},
   {h:"Types de lock-in", kv:[
    ["Technique","APIs propriétaires, formats fermés (DynamoDB, Cosmos DB)"],
    ["Contractuel","Engagements longue durée, pénalités"],
    ["Compétences","Équipe formée sur une techno spécifique"],
    ["Coûts","Migration coûteuse, egress fees (frais de sortie)"]]},
   {h:"Portabilité", kv:[
    ["Faible ❌","SaaS propriétaire, DynamoDB, Cosmos DB, Lambda"],
    ["Moyenne ⚠","IaaS (VMs), PaaS standard (MySQL), Docker"],
    ["Forte ✅","PostgreSQL, Kubernetes, Terraform, formats ouverts (JSON, CSV, SQL)"]]},
   {p:"Exemple concret : DynamoDB → Azure = réécriture complète (mois). PostgreSQL → Azure Database for PostgreSQL = compatible, export/import (jours)."}]},
  {h:"6 stratégies de réversibilité", g:[
   {steps:[
    ["Standards ouverts","PostgreSQL > DynamoDB, Kubernetes > ECS"],
    ["Infrastructure as Code (Terraform)","Multi-cloud, plus de click-ops. Doc auto, reproductibilité, versioning, migration facilitée"],
    ["Conteneurisation (Docker + Kubernetes)","Manifests portables sur AKS/EKS/GKE/on-prem : code identique partout"],
    ["Architecture découplée","Microservices, APIs REST/GraphQL"],
    ["Data portability","Formats ouverts (JSON, CSV, SQL)"],
    ["Multi-cloud","Déployer sur plusieurs providers (complexe)"]]},
   {p:"**Egress fees**, le piège des frais de transfert : AWS/Azure/GCP : entrée gratuite, sortie 0,08-0,12 €/GB, inter-régions 0,02 €/GB. Migrer 10 TB → 800-1 200 €. Parades : export progressif, compression, négocier gros volumes."}]},
  {h:"Sauvegardes externes & documentation", g:[
   {p:"Ne jamais avoir toutes les sauvegardes chez un seul provider. **Règle 3-2-1** : 3 copies · 2 supports différents · 1 hors-site (ou hors-provider). Ex. : primaire Azure, secondaire Azure Backup, tertiaire AWS S3."},
   {p:"Documenter les dépendances, inventaire type : Azure VM → portable facilement · Azure SQL DB → SQL standard OK · Azure Functions → lock-in moyen · Azure Cognitive Services → lock-in fort. Pour chaque service, un plan de sortie explicite."}]},
  {h:"Cas Basecamp : quitter AWS (2022)", g:[
   {p:"Basecamp, SaaS de gestion de projets hébergé sur AWS depuis 15 ans. Facture cloud : 3,2 M$/an. Charge stable et prévisible → décision de rapatrier on-premises. Résultat : migration réussie en 1 an · investissement 600 k$ (serveurs Dell) · **économie 7 M$ sur 5 ans**. Possible car architecture portable (conteneurs, standards ouverts)."},
   {h:"Checklist réversibilité avant de migrer", ul:["Standards ouverts ?","Données exportables ?","Infra codifiée (IaC) ?","Conteneurs ?","APIs standard (REST, GraphQL) ?","Coût de sortie estimé ?","Plan de migration alternatif ?","Compétences transférables ?","Contrats permettent de partir ?","Sauvegardes hors-provider ?"]},
   {p:"À retenir : le lock-in est réel, les services propriétaires créent une dépendance. Balance à trouver : productivité vs portabilité. Startup : time-to-market > réversibilité. PME : équilibre. Grande entreprise : réversibilité = sécurité."},
   {p:"Correction (mise à jour) : avec l'EU Data Act, les frais de changement de cloud, egress compris, seront interdits pour une migration à partir du 12 janvier 2027. L'egress du trafic courant reste payant."}]}
 ]}
,{id:"03", t:"Garanties contractuelles", sub:"SLA, SLO, SLI, conformité (RGPD, HDS, SecNumCloud), certifications et clauses", parts:[
  {h:"SLA : définition, structure & % à connaître", g:[
   {def:"**SLA** (Service Level Agreement) = contrat qui définit : les engagements du provider (dispo, perf), les métriques mesurées, les compensations (crédits) en cas de non-respect, et les exclusions."},
   {steps:["Définitions (services, métriques)","Engagements (taux dispo, temps de réponse)","Méthode de calcul (période)","Compensations (crédits + comment les réclamer)","Exclusions"]},
   {table:{head:["SLA","Downtime / an","/ mois","/ semaine"], rows:[
    ["99 %","3,65 jours","7,2 h","1,68 h"],
    ["99,9 % (3 nines)","8,76 h","43 min","10 min"],
    ["99,95 %","4,38 h","21 min","5 min"],
    ["99,99 % (4 nines)","52 min","4,3 min","1 min"],
    ["99,999 % (5 nines)","5,26 min","26 s","6 s"]]}},
   {p:"**Crédits ≠ compensation des pertes business.** Ex. VM 100 €/mois, dispo 98,5 % → crédit 25 €. Mais perte business de la panne : 10 000 € → non compensée. Un SLA ne couvre pas le coût réel des pannes."}]},
  {h:"Exemples de SLA, crédits & exclusions", g:[
   {h:"Azure Virtual Machines", table:{head:["Configuration","SLA","Downtime / mois"], rows:[
    ["VM unique + Premium SSD","99,9 %","43 min"],
    ["2+ VMs : Availability Set","99,95 %","21 min"],
    ["2+ VMs : Availability Zones","99,99 %","4,3 min"]]}},
   {p:"Plus vous architecturez pour la haute dispo, meilleur est le SLA. Mais : SLA = VM allumée et accessible, ne garantit PAS que votre application fonctionne."},
   {h:"Crédits AWS EC2", kv:[["≥ 99,99 %","Aucun crédit"],["99,0 % - 99,99 %","10 %"],["95,0 % - 99,0 %","25 %"],["< 95,0 %","100 %"]]},
   {p:"Crédits = service credits, pas d'argent liquide. À réclamer (délai souvent 30 j)."},
   {p:"**Exclusions typiques** : maintenance planifiée (préavis), force majeure (catastrophes, guerres), erreurs client (mauvaise config, code défaillant, dépassement de quotas), attaques externes (DDoS massifs), services tiers (API externe qui tombe), services Preview/Beta."}]},
  {h:"Cas réel : panne DNS Azure (juillet 2024)", g:[
   {p:"Panne DNS mondiale Azure : 9 heures d'inaccessibilité, cause : erreur de configuration DNS. SLA Azure DNS annoncé : 100 %. Dispo mensuelle réelle : (43 200 − 540) / 43 200 = **98,75 %**. SLA largement non respecté → crédits accordés : 100 % du coût mensuel Azure DNS."},
   {p:"Mais : DNS coûte quelques euros/mois. La perte business (potentiellement énorme) reste à votre charge → crédits symboliques face aux vraies pertes."}]},
  {h:"SLI, SLO, SLA & error budget", g:[
   {table:{head:["Concept","Définition","Exemple","Public"], rows:[
    ["SLI","Service Level Indicator : métrique mesurée","Uptime = 99,92 %","Interne"],
    ["SLO","Service Level Objective : objectif interne (cible équipe)","Uptime ≥ 99,95 %","Interne"],
    ["SLA","Service Level Agreement : engagement contractuel","Uptime ≥ 99,9 %","Client"]]}},
   {def:"**Relation : SLA (contractuel) ≤ SLO (interne) ≤ réalité.** La marge SLO − SLA = « error budget » pour absorber les imprévus sans casser le contrat."},
   {p:"**Error budget** (Google SRE) : 100 % − SLO. SLO 99,9 % → budget 0,1 % → 43,2 min de downtime « acceptables »/mois. Panne 20 min → budget restant 23,2 min. Panne 50 min → budget dépassé → gel des nouvelles fonctionnalités, focus stabilité. Budget restant → on peut innover / prendre des risques."},
   {p:"SLI < SLO mais SLI > SLA : SLO non atteint (action corrective interne), mais SLA respecté (pas de crédits dus au client)."}]},
  {h:"RGPD & conformité : localisation des données", g:[
   {p:"**RGPD** : en vigueur depuis le 25 mai 2018. S'applique à toute entreprise traitant des données de résidents UE, même hors UE. Amendes jusqu'à 20 M€ ou 4 % du CA mondial."},
   {p:"7 principes clés : ① consentement explicite · ② droit à l'oubli · ③ portabilité · ④ minimisation (strict nécessaire) · ⑤ sécurité (chiffrement, accès limité) · ⑥ notification des violations en 72 h · ⑦ DPO si nécessaire."},
   {cols:[
    ["Provider","sous-traitant","Infrastructure conforme RGPD · sécurité des datacenters · processus certifiés · DPA (Data Processing Agreement) signé · coopération en cas de contrôle CNIL."],
    ["Client","responsable de traitement","Base légale du traitement · consentements utilisateurs · implémenter le droit à l'oubli · registre des traitements · analyse d'impact (DPIA) si nécessaire · choisir région Europe · nommer un DPO."]]},
   {p:"Localisation, bon choix : Azure France Central · AWS eu-west-3 (Paris) · GCP europe-west9. À éviter : régions US ou Asie sans garanties contractuelles strictes (Clauses Contractuelles Types)."}]},
  {h:"Certifications : HDS, SecNumCloud, ISO 27001, SOC 2", g:[
   {table:{head:["Certification","Portée","Obligatoire si…","Providers"], rows:[
    ["RGPD","UE","Données personnelles UE","Tous (conformité basique)"],
    ["HDS","France","Données de santé (dossiers médicaux, e-santé)","OVHcloud, Azure, AWS, Outscale, Scaleway"],
    ["SecNumCloud","France","Données sensibles État (défense, OIV, DR)","OVHcloud, Outscale, Numspot · PAS AWS/Azure/GCP (Cloud Act US)"],
    ["ISO 27001","International","Souvent requis en B2B","Tous les majeurs"],
    ["SOC 2","US / int'l","Clients US (Type 2 = efficacité sur 6-12 mois)","AWS, Azure, GCP"],
    ["PCI-DSS","International","Paiements carte bancaire","Tous (via services spécifiques)"]]}},
   {def:"**SecNumCloud** (ANSSI) : niveau de sécurité le plus élevé en France : localisation FR, droit français, personnel habilité, souveraineté (pas de loi extraterritoriale type Cloud Act US), sécurité renforcée. Arbitrage : souveraineté vs richesse fonctionnelle."},
   {p:"Attention : certification globale ≠ tous les services (vérifier par région et par service), date de validité. Azure : docs.microsoft.com/compliance. AWS : aws.amazon.com/compliance."},
   {p:"Correction (mise à jour) : AWS, Azure et GCP ne sont toujours pas qualifiés SecNumCloud en direct, mais S3NS (Thales, technologie Google Cloud) a obtenu la qualification SecNumCloud 3.2 en décembre 2025 pour son offre PREMI3NS ; Bleu (Orange et Capgemini, technologie Microsoft) suit la même voie."}]},
  {h:"Clauses contractuelles importantes", g:[
   {kv:[
    ["DPA (Data Processing Agreement)","Accord sous-traitant RGPD : obligatoire si données personnelles. Définit les responsabilités"],
    ["Exit clause","Conditions de résiliation, accès aux données après, délai de suppression certifiée"],
    ["SLA","Disponibilité garantie + crédits"],
    ["Limitation de responsabilité","Souvent limitée au montant payé (12 derniers mois). Perte indirecte non couverte"],
    ["Juridiction","Droit applicable (français, US…) et tribunal compétent"]]},
   {p:"Clause typique problématique : « La responsabilité du Provider ne pourra excéder le montant total payé au cours des 12 mois précédant l'incident. » Le client paie 1 000 €/an, une panne cause 100 000 € de perte → indemnisation max 1 000 €, 99 000 € non couverts : c'est vous qui assumez le risque business."},
   {p:"Parades : assurance cyber-risque, architecture haute dispo (multi-zones, failover auto), ne pas dépendre d'un seul service critique, monitoring proactif, tests de basculement."}]},
  {h:"Checklist contrat cloud & à retenir", g:[
   {h:"Avant de signer", ul:["SLA lu et compris (% de dispo)","Crédits en cas de non-respect","Exclusions identifiées","Certifications vérifiées (RGPD, HDS…)","Localisation des données conforme","DPA signé","Exit clause acceptable","Limitation de responsabilité comprise","Juridiction et droit applicable","Support inclus (niveau, horaires)"]},
   {cols:[
    ["Un SLA garantit","","La disponibilité de l'infrastructure + des crédits symboliques."],
    ["Un SLA ne garantit PAS","","La performance applicative, l'absence de bugs dans votre code, la compensation de la perte business, les services Preview/Beta."]]},
   {p:"SLA = filet de sécurité, pas solution miracle. Votre responsabilité : architecturer pour la haute dispo, monitorer, tester les scénarios de panne, avoir un plan B (assurance cyber-risque, PRA/PCA : voir SC1-12)."}]}
 ]},
 {id:"04", t:"Big 3 cloud providers", sub:"AWS, Azure, GCP : le trio qui domine le cloud public, positionnement, services et cas d'usage", parts:[
  {h:"Le marché en un coup d'œil", g:[
   {table:{head:["Provider","Part de marché","Positionnement en 3 mots"], rows:[
    ["AWS","~30 %","Leader, mature, vaste : le pionnier généraliste"],
    ["Azure","~20 %","Enterprise, hybride, Microsoft : l'intégrateur"],
    ["GCP","~12 %","Data, ML, Kubernetes : le spécialiste"],
    ["Autres","~38 %","OVHcloud, Alibaba, Oracle, IBM…"]]}},
   {p:"À retenir : AWS leader, Azure rattrape (grosses entreprises + hybride), GCP progresse via data/ML."}]},
  {h:"AWS : le pionnier du cloud public", g:[
   {p:"Leader généraliste avec le plus grand catalogue."},
   {cols:[
    ["Forces","","Catalogue immense · couverture mondiale · écosystème mature · innovation rapide."],
    ["Faiblesses","","Complexité · interface vieillissante · coûts durs à maîtriser · support de base limité."]]},
   {kv:[["Compute","EC2 / Lambda / EKS : VMs, serverless, K8s"],["Storage","S3 / Glacier : objets, archive"],["Database","RDS / DynamoDB : SQL / NoSQL"],["Network","VPC / CloudFront : réseau, CDN"]]},
   {p:"Quand choisir AWS ? ✅ Besoin de services très variés · équipe déjà formée AWS · startup tech (crédits Activate). ❌ PME sans maturité cloud · env. 100 % Microsoft · contraintes de souveraineté. Ex. : Netflix utilise EC2, S3, CloudFront, DynamoDB."}]},
  {h:"Azure : le cloud de l'entreprise Microsoft", g:[
   {p:"Intégrateur enterprise et champion de l'hybride."},
   {cols:[
    ["Forces","","Intégration Microsoft (AD, M365) · leader hybride (Arc, Stack) · conformité enterprise · Azure OpenAI Service."],
    ["Faiblesses","","Nommage confus · incidents médiatisés · console parfois lente · lock-in Microsoft."]]},
   {kv:[["Compute","Virtual Machines / App Service / AKS : VMs, PaaS web, K8s"],["Storage","Blob Storage / Azure Files : objets, SMB-NFS"],["Database","Azure SQL / Cosmos DB : SQL Server PaaS, NoSQL"],["Identity / Hybride","Entra ID / Azure Arc : IAM + SSO, gestion unifiée"]]},
   {p:"Quand choisir Azure ? ✅ Entreprise déjà Microsoft (AD, M365) · besoin hybride cloud/on-prem · applis .NET · secteur public/santé. ❌ Startup sans legacy MS · stack 100 % open-source · souveraineté stricte. Ex. : Carrefour utilise Azure VMs, SQL, AD, Arc."}]},
  {h:"GCP : le cloud de la data et du ML", g:[
   {p:"Le spécialiste data, ML et Kubernetes."},
   {cols:[
    ["Forces","","BigQuery (référence) · Kubernetes natif (GKE) · réseau performant · pricing lisible."],
    ["Faiblesses","","Part de marché plus faible · moins de régions · support enterprise en retard · Google ferme parfois des services."]]},
   {kv:[["Compute","Compute Engine / Cloud Run / GKE : VMs, containers serverless, K8s"],["Storage / DB","Cloud Storage / Cloud SQL / Spanner : objets, SQL, SQL distribué mondial"],["Data","BigQuery / Pub/Sub : data warehouse, messaging"],["ML","Vertex AI : plateforme ML"]]},
   {p:"Quand choisir GCP ? ✅ Workloads data/analytics (BigQuery) · Machine Learning · archi Kubernetes-native · startup tech moderne. ❌ Entreprise traditionnelle Windows · intégration AD · conformité secteur public stricte. Ex. : Spotify utilise BigQuery, Dataflow, GKE, Vertex AI."}]},
  {h:"Comparaison par domaine", g:[
   {table:{head:["Domaine","Leader","Commentaire"], rows:[
    ["IaaS (VMs)","AWS ≈ Azure","Tous compétitifs"],
    ["Serverless","AWS Lambda","Le plus mature"],
    ["Kubernetes","GCP","GKE = référence (créateur de K8s)"],
    ["PaaS Web","Azure","App Service excellent"],
    ["SQL managé","Azure","Pour SQL Server surtout"],
    ["NoSQL","AWS ≈ Azure","DynamoDB / Cosmos DB"],
    ["Data Warehouse","GCP","BigQuery = référence"],
    ["ML Platform","GCP ≈ Azure","Vertex AI / Azure ML"],
    ["Hybride","Azure","Arc = leader"]]}}]},
  {h:"Matrice de décision & points communs", g:[
   {kv:[
    ["Startup tech généraliste","AWS"],["Entreprise Microsoft","Azure"],["Data / Analytics / ML","GCP"],["Kubernetes-native","GCP"],
    ["E-commerce forte charge","AWS"],["Hybride cloud + on-prem","Azure"],["Budget serré","GCP"],["Conformité maximale","Azure"]]},
   {h:"Points communs des Big 3", ul:["Proposent IaaS, PaaS, SaaS","Ont des régions en France","Soumis au Cloud Act US","Offrent des free tiers pour tester","Certifications majeures (ISO 27001, SOC 2, RGPD, HDS)","N'ont PAS SecNumCloud"]},
   {p:"Il n'y a pas UN meilleur provider. Le meilleur = celui qui répond à vos besoins (souveraineté, écosystème existant, compétences équipe, workloads)."},
   {p:"Certifications d'entrée à considérer : AWS Cloud Practitioner · Microsoft AZ-900 · Google Cloud Digital Leader."}]}
 ]},
 {id:"05", t:"Providers cloud FR / EU", sub:"OVHcloud, Scaleway, Clever Cloud : souveraineté, alternatives et pragmatisme", parts:[
  {h:"Pourquoi regarder côté EU ?", g:[
   {kv:[
    ["Souveraineté","Pas de Cloud Act US : les données ne peuvent pas être réquisitionnées par les autorités américaines"],
    ["RGPD natif","Droit européen uniquement, pas de risque de transfert hors UE"],
    ["Support FR","Documentation et facturation en français / euros"],
    ["Prix","Souvent plus compétitifs, moins de frais cachés (egress)"]]},
   {def:"**Cloud Act US** : loi US extraterritoriale permettant l'accès aux données hébergées par des providers américains, même dans les régions « Europe » d'AWS/Azure/GCP."}]},
  {h:"OVHcloud : leader européen", g:[
   {p:"Fondé en 1999 par Octave Klaba à Roubaix. D'abord hébergeur web puis serveurs dédiés, repositionné cloud en 2016. Incident Strasbourg 2021 (incendie SBG2) → renforcement des pratiques."},
   {cols:[
    ["Forces","","Souveraineté EU (pas de Cloud Act) · SecNumCloud (partiel) · prix compétitifs, pas d'egress."],
    ["Faiblesses","","Catalogue limité vs Big 3 · UI/UX console datée · écosystème plus restreint."]]},
   {kv:[["Compute","Public Cloud Instances · Bare Metal · Managed K8s (CNCF)"],["Storage","Object Storage (S3-compatible) · NAS-HA"],["DB","Managed Databases (MySQL, PostgreSQL, MongoDB, Redis)"],["Autres","AI Training (GPU), vRack (réseau privé), Anti-DDoS inclus"]]},
   {p:"Quand choisir ? ✅ Souveraineté prioritaire · budget contraint · workloads standards (web, DB, VMs) · serveurs de jeux (anti-DDoS, latence EU). ❌ Services avancés (ML poussé, IoT, analytics) · couverture mondiale obligatoire. Ex. : Cdiscount → Public Cloud + Object Storage + Managed K8s + vRack + Anti-DDoS."}]},
  {h:"Scaleway : l'innovation cloud française", g:[
   {p:"Né d'Online.net (groupe Iliad) en 1999, rebrandé Scaleway en 2015. Focus Europe et expérience développeur."},
   {cols:[
    ["Forces","","Innovation (ARM, serverless SQL) · dev experience (CLI, API, Terraform) · prix très compétitifs · souveraineté FR."],
    ["Faiblesses","","Services limités · Europe uniquement · écosystème naissant · moins adapté aux grandes entreprises."]]},
   {kv:[["Compute","Instances (GP, DEV, ARM, GPU) · Elastic Metal · Serverless Containers & Functions"],["Storage","Object Storage · Cold Storage (archive)"],["DB","Managed DB · Serverless SQL (PostgreSQL pay-per-query)"],["Innovations","Apple Silicon (Mac Mini as-a-Service) · IoT Hub"]]},
   {p:"Quand choisir ? ✅ Startup/devs budget serré · workloads serverless · archi ARM64 · dev iOS/macOS (Mac Mini cloud). ❌ Présence mondiale · grande entreprise · ML enterprise/analytics avancés. Ex. : Doctolib (données de santé HDS) → Instances + Managed PostgreSQL + Object Storage + Serverless Containers."}]},
  {h:"Clever Cloud : PaaS européen & écologique", g:[
   {p:"Créé en 2010 à Nantes. PaaS souverain avec focus developer experience et écologie."},
   {cols:[
    ["Forces","","Simplicité (git push = deploy) · souveraineté EU · green IT assumé · support FR réactif."],
    ["Faiblesses","","PaaS uniquement (pas d'IaaS) · services très limités · Europe uniquement · lock-in PaaS."]]},
   {p:"Runtimes : Java, Scala, Node.js, PHP, Python, Ruby, Go, Rust, Elixir, .NET, Haskell, Docker. Add-ons managés : PostgreSQL, MySQL, MongoDB, Redis · Cellar (S3-compatible) · messaging."},
   {code:"clever create --type node my-app\ngit push clever master\n# → build + deploy + scaling auto"},
   {p:"Quand choisir ? ✅ Startup sans équipe ops · apps web standards (APIs, sites) · engagement écologique · MVPs rapides. ❌ Besoin d'IaaS (VMs) · Big Data / ML · présence mondiale. Ex. : Cityscoot → Node.js + PostgreSQL + Redis + Cellar : déploiement simplifié, zéro ops."}]},
  {h:"Souveraineté & conformité : EU vs Big 3", g:[
   {table:{head:["Critère","AWS / Azure / GCP","OVHcloud","Scaleway","Clever Cloud"], rows:[
    ["Cloud Act US","Oui ⚠","Non ✅","Non ✅","Non ✅"],
    ["RGPD","✅","✅","✅","✅"],
    ["ISO 27001","✅","✅","✅","✅"],
    ["HDS","✅ (partiel)","✅","En cours","—"],
    ["SecNumCloud","❌","Partiel","Visé","—"]]}},
   {table:{head:["Critère","Big 3","Providers EU"], rows:[
    ["Catalogue services","Très large","Limité"],
    ["Couverture géo","Mondiale","Europe principalement"],
    ["Prix / support FR","Variable · support payant","Souvent moins cher · support souvent inclus"],
    ["Souveraineté","Cloud Act","Droit EU"]]}}]},
  {h:"Matrice de décision & approche hybride", g:[
   {kv:[
    ["Souveraineté critique","EU (OVHcloud, Scaleway)"],["Données de santé (HDS)","OVHcloud"],["SecNumCloud requis","OVHcloud (périmètre qualifié)"],
    ["Budget serré, workloads standards","EU"],["Services avancés (ML, IoT, analytics)","Big 3"],["Présence mondiale","Big 3"],
    ["Startup sans ops","Clever Cloud"],["Dev Kubernetes innovant","Scaleway"]]},
   {h:"Approche hybride : combiner selon la donnée", kv:[
    ["Données non sensibles","Big 3 avec DPA"],["Données sensibles","Providers EU (+ HDS si santé)"],["Données classifiées","SecNumCloud obligatoire"]]},
   {p:"Exemples de mix : OVHcloud pour données sensibles + AWS pour ML · Scaleway dev/test + Azure prod Microsoft · Clever Cloud web + GCP BigQuery."},
   {p:"Attention : la complexité et les coûts de transfert inter-cloud peuvent vite exploser. Toujours mesurer avant d'engager un multi-cloud."},
   {def:"Le bon provider = celui qui répond à VOS besoins. **Souveraineté vs services avancés** : c'est le trade-off principal."}]}
 ]}
