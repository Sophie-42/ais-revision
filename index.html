SC1:[
 {id:"01", t:"Introduction : panorama de la saison", sub:"Gestion de projet, cycle V, Agile, risques, PCA/PRA, supervision", parts:[
  {h:"Le fil rouge de la saison", g:[
   {def:"Projet, gestion de projet et sécurité sont fondamentaux dans les façons de travailler d'un admin infra. On répond à un besoin particulier, dans un délai donné, pour un coût établi → on travaille en **mode projet**."},
   {p:"La réalisation d'un projet passe par différentes phases selon la typologie et le besoin, et doit prendre en compte certaines spécificités, notamment la gestion du risque. Une fois le projet terminé et le produit livré, celui-ci poursuit sa vie : il évolue, et on ne doit jamais oublier de le superviser."}]},
  {h:"Programme de la saison", g:[
   {cols:[
    ["Gestion de projet","","Projet et gestion de projet (définitions, familles IT) · cycle en V et cycles semi-itératifs · Agile et Scrum · structuration, planification, suivi de projet."],
    ["Sécurité & continuité","","Gestion des risques d'un projet · menaces et vulnérabilités IT / SI · PCA (Plan de Continuité d'Activité) / PRA (Plan de Reprise d'Activité) · supervision post-livraison."]]}]},
  {h:"Les 3 grandes idées à retenir dès le départ", g:[
   {cols:[
    ["Mode projet","","Un besoin + un délai + un coût = projet. Pas une urgence, pas une tâche répétitive, pas une idée floue."],
    ["Phases & risques","","Un projet suit des phases qui dépendent de sa typologie. À chaque phase, on anticipe les risques."],
    ["Après la livraison","","Le produit livré vit : il évolue, et il faut le superviser dans la durée."]]}]}
 ]},
 {id:"02", t:"Projet", sub:"Définition, caractéristiques, familles de projets IT et contraintes", parts:[
  {h:"Qu'est-ce qu'un projet ?", g:[
   {def:"**Projet** = ensemble d'activités coordonnées visant à atteindre un objectif unique, dans un temps défini, avec des ressources limitées."},
   {kv:[
    ["ISO 10006","Ensemble unique de processus, activités coordonnées et maîtrisées, dates de début et de fin, livrables conformes à des exigences spécifiques"],
    ["PMI","Entreprise temporaire initiée pour fournir un produit, un service ou un résultat unique"],
    ["PRINCE2","Organisation temporaire créée pour livrer un ou plusieurs produits conformément à un cas d'affaire convenu"]]},
   {p:"Éléments caractéristiques : un objectif / but, une date de début, une date de fin, une organisation, des livrables, un budget, un résultat unique."}]},
  {h:"Ce qu'un projet n'est pas", g:[
   {table:{head:["Activité courante","Projet"], rows:[["Répétitive","Unique"],["Sans début / fin précisés","Temps défini"],["Procédures établies","Démarche spécifique"],["Objectif stable","Objectif unique"]]}},
   {p:"Ne pas confondre projet avec : une **urgence** (remettre un service en marche), une **tâche répétitive** (gestion des comptes utilisateurs), une **idée floue** (« on pourrait changer nos serveurs »), « juste installer un logiciel », ou un **problème à résoudre** (« le DHCP tombe souvent »)."},
   {p:"Pourquoi fait-on des projets ? Répondre à un besoin, améliorer le service, remplacer un matériel obsolète, renforcer la sécurité, passer à l'échelle."}]},
  {h:"Les 5 grandes familles de projets IT", g:[
   {table:{head:["Famille","Exemples","Enjeux"], rows:[
    ["Infrastructure","Serveurs, virtualisation (Hyper-V/VMware), réseau (switchs, VLAN, WiFi), SAN/NAS","Performance, disponibilité, sécurité"],
    ["Migration","OS (Debian 9 → 12), archi VLAN, Cloud (O365, GSuite), Apache → Nginx","Compatibilité, rollback, continuité de service"],
    ["Cybersécurité","Firewall + segmentation, MFA, audit, gestion de vulnérabilités","Réduction du risque, conformité ANSSI / ISO"],
    ["Applicatif","Application métier, outils collaboratifs, ERP","Intégration, performance, support"],
    ["Optimisation / transformation","Supervision (Zabbix, Centreon), automatisation (scripts, Ansible), refonte infra","Coût, modernisation, résilience"]]}}]},
  {h:"Les 5 grandes contraintes IT & exemples", g:[
   {h:"Contraintes à surveiller", kv:[["Techniques","Interopérabilité, versions"],["Humaines","Utilisateurs, prestataires"],["Financières","Budget global et par phase"],["Sécurité","Conformité, exposition, RGPD"],["Exploitation","Disponibilité, MCO, supervision"]]},
   {cols:[
    ["Facebook Luleå","2012-2013","Datacenter construit en 13 mois. Conception, construction, migration de services. Coordination très forte entre travaux, réseau, électricité, cooling, plateformes applicatives. Automatisation extrême."],
    ["Netflix → AWS","2008-2016","Migration progressive de toute l'infrastructure vers AWS. Haute dispo, tolérance aux pannes, chaos engineering. Approche incrémentale."]]},
   {p:"Pourquoi comprendre le type de projet ? Mieux estimer le travail, anticiper les contraintes, identifier les risques, communiquer efficacement. Vous serez souvent acteur opérationnel."}]}
 ]},
 {id:"03", t:"Gestion de projet", sub:"Pourquoi, triangle qualité/coût/délai, histoire, cycle V vs Agile vs DevOps", parts:[
  {h:"Qu'est-ce que la gestion de projet ?", g:[
   {def:"**Gestion de projet** = démarche visant à organiser de bout en bout le bon déroulement d'un projet, en appliquant méthodes, techniques et outils spécifiques à chaque étape, de l'évaluation d'opportunité à l'achèvement."},
   {p:"Pourquoi gérer un projet ? Structurer l'activité, planifier les tâches, évaluer les risques, coordonner plusieurs acteurs, optimiser les ressources, réduire les imprévus, documenter les choix, améliorer la qualité."},
   {p:"Objectifs finaux : améliorer la satisfaction du client, avoir une vision partagée, pouvoir arbitrer entre alternatives. Gérer ce n'est pas « faire un planning » : c'est anticiper, communiquer, documenter, mener une équipe vers un objectif clair."}]},
  {h:"Le triangle : qualité / coût / délai", g:[
   {def:"Toute la gestion de projet consiste à tenir l'équilibre entre ces trois axes. **Serrer l'un, c'est desserrer les autres.**"},
   {cols:[
    ["Qualité","","Bonne expression des besoins, tout au long du projet. Mécanismes de contrôle qualité (pas seulement sur le livrable final)."],
    ["Coût","","Estimation réaliste puis ajustement. Coûts d'études + de réalisation. Décisions rapides en cas de dépassement."],
    ["Délai","","Souvent imposé par le client. Doit être réaliste et validé par les différents acteurs. Jalons intermédiaires."]]}]},
  {h:"Un peu d'histoire", g:[
   {table:{head:["Période","Contribution"], rows:[
    ["Avant le XXe","Pyramides, cathédrales, aqueducs : approche empirique, hiérarchie stricte, peu de doc, aucune méthode formelle"],
    ["1900-1915","Taylor : organisation scientifique du travail. Adamiecki / Gantt : diagramme de Gantt (visualiser les tâches dans le temps)"],
    ["Années 50","CPM (1957, DuPont) : chemin critique. PERT (1958, US Navy) : milliers d'activités interdépendantes"],
    ["Années 60-80","1956 : modèle Waterfall. 1969 : création du PMI. 1970 Royce : critique Waterfall, propose le cycle V et les modèles semi-itératifs"],
    ["Années 90","Explosion de l'IT : modèles itératifs / incrémentaux. 1996 : 1re version du PMBOK (PMI)"],
    ["2001","Manifeste Agile : itérations, collaboration, retours rapides, produit fonctionnel > documents"],
    ["2010-2020","DevOps (Dev + Ops, CI/CD, monitoring), Cloud (projets hybrides), sécurité (EBIOS, ISO 27001, ANSSI)"]]}},
   {p:"Correction : Royce (1970) a surtout décrit (et critiqué) le modèle en cascade ; le cycle en V a été formalisé plus tard, à la fin des années 1980 (V-Modell allemand, Forsberg et Mooz)."}]},
  {h:"Les 5 étapes de tout projet", g:[
   {steps:[["Définition","Savoir ce que veut le client"],["Conception","Savoir ce que l'on va faire"],["Réalisation","Faire ce que l'on doit faire"],["Validation","Le résultat répond-il au besoin ?"],["Livraison","Fournir les résultats du projet"]]}]},
  {h:"Cycle V vs Agile vs DevOps", g:[
   {table:{head:["Modèle","Principe","+","−"], rows:[
    ["Cycle en V","Chaque phase de conception ↔ une phase de test","Très structuré, doc complète, adapté à l'infra","Peu flexible, effet tunnel si changement tardif"],
    ["Semi-itératif / Agile","Après analyse, on produit par incréments courts","Flexibilité, retours rapides, environnements changeants","Moins de doc, exige une équipe mature, difficile sur gros projet"],
    ["DevOps","Fusion Dev + Ops. CI/CD, IaC, monitoring, culture collaborative. Pas vraiment de la gestion de projet, mais principes très utilisés en Agile","Qualité constante, rapidité, réduction du risque humain","Nécessite outils + culture, pas adapté à tous les environnements"]]}},
   {def:"**Aujourd'hui : gestion de projet hybride.** Tout ne peut pas être Agile (migration AD, changement de firewall) ni figé comme en cycle V. On combine structure traditionnelle (cycle V) + pratiques agiles (itérations, feedback)."},
   {p:"DevOps : 4 piliers : automatisation, intégration continue, supervision, culture collaborative. N'existe pas sans une chaîne outillée cohérente : CI/CD, IaC, monitoring."}]}
 ]},
 {id:"04", t:"Cycle en V", sub:"Acteurs (MOA/MOE), étapes (cadrage → livraison), livrables, tests et REX", parts:[
  {h:"Le cycle en V : principe & cas d'usage", g:[
   {def:"**Cycle en V** = modèle d'organisation de projet qui améliore le Waterfall. Chaque phase de conception (branche descendante) est associée à une phase de contrôle correspondante (branche montante)."},
   {p:"Les 5 étapes classiques : Définition → Conception → Réalisation → Validation → Livraison. Chacune peut avoir plusieurs sous-étapes."},
   {h:"Cas d'usage", ul:["Développement logiciel","Industrie lourde (auto, aviation, militaire)","Migrations / déploiements d'infrastructure (LAN, cœur de réseau)","Infrastructure virtualisée (archi définie avant construction)","Déploiement / migration téléphonie / VoIP (bascule par lots)"]},
   {h:"Pourquoi ça marche bien en infra", kv:[["Prévisibilité","Matériel, délais, compatibilité connus"],["Dépendances techniques fortes","Design préalable indispensable"],["Faible incertitude fonctionnelle","Besoins stables"],["Tests structurés","Recettes techniques formelles"]]},
   {p:"Bon modèle quand : planification stricte, doc complète, validation et tests très cadrés, peu d'allers-retours fonctionnels attendus."}]},
  {h:"Les acteurs : MOA, MOE, AMOA / AMOE", g:[
   {cols:[
    ["MOA","Maîtrise d'Ouvrage","Le client, demandeur du projet. Détermine les objectifs, alloue le budget, fixe les délais, anime les réunions, valide les étapes, participe à la recette. Connaît le métier / le besoin."],
    ["MOE","Maître d'Œuvre","Conception et réalisation. Assiste la MOA, sélectionne et gère l'équipe, assure la qualité, rend compte de l'avancement, tient délais + budget. Connaît la technique."],
    ["AMOA / AMOE","Assistants","Sur projets complexes : intermédiaires pour fluidifier les relations et analyser en détail contraintes et risques. Chacun peut être accompagné."]]},
   {p:"Dans une petite DSI : MOA = direction / métier / responsable informatique ; MOE = admins / ingénieurs / prestataires."},
   {kv:[
    ["Sponsor","Représente le client, lien projet ↔ client"],
    ["Responsable fonctionnel","Définition"],
    ["Chef de projet","Coordination, planification, suivi"],
    ["Admin / ingénieur","Installations, config, tests"],
    ["RSSI","Sécurité + conformité"],
    ["Utilisateurs finaux","Recette, validation"]]},
   {p:"L'ensemble = les **parties prenantes**."}]},
  {h:"Avant le projet : la note de cadrage", g:[
   {p:"Avant le démarrage, l'entreprise définit le projet de façon « macro » en 3 volets qui aboutissent à la **note de cadrage** (document d'avant-projet)."},
   {kv:[
    ["Expression du besoin","But, contexte, périmètre, dates, acteurs, contraintes, risques, impacts (ce que l'on veut)"],
    ["Étude d'opportunité","Analyse de la situation, résultats attendus, opportunités, scénarios, recommandations (pourquoi, ce que ça apporte)"],
    ["Étude de faisabilité","Qualité, délais, coûts, ressources et contraintes techniques / financières / temporelles (est-ce réalisable ?)"]]},
   {p:"Méthode d'appui : **QQOQCCP** : Qui ? Quoi ? Où ? Quand ? Comment ? Combien ? Pourquoi ?"},
   {p:"La note de cadrage contient : but, contexte, périmètre (inclus / exclu), acteurs, contraintes, risques (souvent au niveau organisation), opportunités, impacts."}]},
  {h:"Définition du projet & cahier des charges", g:[
   {p:"MOA + MOE définissent précisément le projet avec les parties prenantes : objectifs, reformulation des besoins, analyse des risques, planification, budget, cahier des charges (document de synthèse)."},
   {cols:[
    ["Outils de planification","","**PBS** : découpage du produit · **WBS** : découpage des tâches · **Matrice RACI** : rôles et responsabilités des parties prenantes · **Gantt** : durée, enchaînement, jalons, assignations."],
    ["Cahier des charges","","Document exhaustif de définition du projet : contrat entre client et fournisseur. Contient : présentation projet + contexte, description des besoins, limites du projet, contraintes, prestations attendues, organisation, budget, délais."]]}]},
  {h:"Conception : 3 livrables", g:[
   {cols:[
    ["Spécifications fonctionnelles","","Description détaillée du besoin, cas d'usage, scénarios utilisateurs / matériel, exigences sécurité et performance."],
    ["Spécifications techniques","","Architecture détaillée (schéma réseau/système/stockage), choix techniques justifiés, caractéristiques matérielles & logicielles, config réseau & sécurité détaillées."],
    ["Maquettage / prototypage","","Valider une archi avant déploiement réel, tester une migration sans impact prod, comparer des solutions, vérifier perfs, tester un plan de reprise."]]}]},
  {h:"Réalisation, validation, livraison", g:[
   {p:"**Réalisation** : cœur du métier. On documente ce que l'on fait, on applique les bonnes pratiques."},
   {h:"Validation : 3 types de tests", kv:[
    ["Fonctionnels","Création compte AD, connexion VPN, accès selon profil"],
    ["Techniques","Perf stockage, haute dispo, latence réseau"],
    ["Sécurité","Authentification, scans de vuln, droits NTFS / ACL"]]},
   {p:"**Cahier de recette** : plan de recette, scénarios de test, jeux de données, prérequis (réseau, comptes, droits), règles de validation, gestion des anomalies."},
   {h:"Livraison : livrables", ul:["DAF : dossier d'architecture final","Dossier d'exploitation","Manuel d'administration","Documentation de bascule (pour PRA/PCA)","Planning de maintenance","Scripts, fichiers de config, supervision"]},
   {def:"**REX** (Retour d'expérience) : quand le projet est fini. Pas seulement se féliciter (ou l'inverse) : analyser ce qui s'est bien / mal déroulé, en comprendre causes et conséquences. Objectif : s'améliorer sur le prochain projet."}]},
  {h:"Synthèse : forces & limites du cycle en V", g:[
   {cols:[
    ["Ce qu'il apporte","","Prévisibilité · structure forte, étapes claires · documentation complète · tests systématiques associés à chaque conception · bonne maîtrise des risques · vision claire pour toutes les parties prenantes."],
    ["Ses limites","","Peu adapté aux besoins changeants · beaucoup de documentation nécessaire · effet tunnel important · validation tardive · cycles qui peuvent être longs · plus de formalisme."]]},
   {p:"Bon choix quand : besoin clair et stable, contraintes techniques fortes, qualité et sécurité non négociables. Sinon, préférer un modèle hybride ou agile."}]}
 ]}
,{id:"05", t:"Agile : le Manifeste", sub:"Origine, 4 valeurs, quand l'utiliser (et quand non), Agile en infra", parts:[
  {h:"Pourquoi Agile ? Le constat de départ", g:[
   {p:"Depuis les années 50, de nombreuses méthodes de gestion de projet existent. Les projets sont souvent complexes et échouent. Le **Chaos Report 1994** (Standish Group) donnait :"},
   {kv:[["Projets stoppés","31 %"],["Projets qui dépassent le budget","52 % dépassent de 189 % le budget prévu"],["Projets qui réussissent (coûts + délais)","16 % seulement"]]},
   {p:"En 2001 : 17 personnalités du développement logiciel se réunissent, échangent sur les problèmes projets et leurs méthodes, déterminent des critères communs et principes. De cette réunion émerge le **Manifeste Agile**."}]},
  {h:"Le Manifeste : résumé opérationnel", g:[
   {h:"Ce que le Manifeste met en avant", ul:["Forte implication du client","Réactivité face à la demande","Développement itératif","Production incrémentale","Production adaptative","Validation à chaque étape","Autonomie des équipes"]},
   {cols:[
    ["Ce que c'est","","Une approche, une philosophie, une démarche."],
    ["Ce que ce n'est PAS","","Une méthode projet. Une structure d'organisation."]]},
   {def:"**La méthode Agile n'existe pas.** Le Manifeste sert de base intellectuelle à des méthodes (Scrum, XP, Crystal Clear, BDD…). « Faire de l'Agile » n'a pas de sens : on applique un cadre agile."}]},
  {h:"Attention aux 3 idées reçues", g:[
   {steps:[
    ["Agile, ce n'est pas l'anarchie !","On DOIT organiser, structurer, documenter. Les projets agiles exigent discipline et rigueur"],
    ["Agile n'est pas réservé au dev logiciel","Ça vient du logiciel, mais les cadres agiles s'appliquent à différents domaines"],
    ["« Ça ne fonctionne pas »","Si si, mais il faut bien appliquer les cadres pour avoir des résultats"]]}]},
  {h:"Quand utiliser un cadre Agile, et en infra ?", g:[
   {cols:[
    ["Quand Agile est pertinent","","Le besoin n'est pas complètement identifié · le besoin peut varier · on doit tester / expérimenter / innover · le client est disponible et prêt à « jouer le jeu »."],
    ["Agile en infra : OK quand","","On peut découper en petites étapes · on peut livrer progressivement · les risques sont maîtrisés · le client valide au fur et à mesure. Ex. : automatisation / scripting, amélioration d'une supervision, environnement Cloud / hybride."],
    ["Agile en infra : mauvais choix quand","","Tout doit basculer d'un coup · un seul livrable final est possible · la prod doit être arrêtée pour avancer · contraintes contractuelles / réglementaires fortes. Ex. : migrations lourdes en one-shot, projets à périmètre figé."]]},
   {p:"Cadres agiles existants : **Scrum** (le plus utilisé, voir fiche 06), Extreme Programming (XP), BDD (Behavior-Driven Development), Crystal Clear… Certains sont antérieurs à 2001 et s'inscrivent dans le Manifeste après coup."},
   {p:"À retenir : Agile met l'accent sur collaboration, réactivité, livrables concrets et adaptation continue, mais ce n'est pas un chaos organisé. Agile ne remplace pas les méthodes classiques : c'est une approche différente pour des besoins spécifiques."}]}
 ]},
 {id:"06", t:"Scrum", sub:"Sprints, rôles (PO, SM, Devs), artefacts et événements", parts:[
  {h:"Scrum, c'est quoi ?", g:[
   {def:"**Scrum** (mêlée, en rugby) = framework Agile très utilisé, itératif, basé sur la collaboration. Fondements en 1986 puis 1995, formalisation en 2002, Scrum Guide en 2010."},
   {p:"Comment ça marche : équipes pluridisciplinaires et auto-organisées, produits réalisés de façon itérative et incrémentale, cycles d'1 mois ou moins, avec des rôles, des événements (rituels) et des livrables (artefacts) définis."},
   {p:"Attention : tous les projets ne peuvent pas être Scrum. Si on vous parle de « chef de projet Scrum », c'est qu'il y a un problème (le rôle n'existe pas)."}]},
  {h:"Le Sprint : le cœur de Scrum", g:[
   {def:"Un **Sprint** (pointe de vitesse) = un cycle de réalisation, une itération. Les objectifs sont fixés avant le Sprint et on ne les change pas pendant. On peut annuler un Sprint."},
   {ul:["Durée : jusqu'à 1 mois (1 à 4 semaines en général)","Durée fixe pendant toute la durée du projet","Débute et termine à des dates précises","Travail non terminé à la fin → Sprint en échec","Travail terminé → il est livré"]},
   {p:"Correction : selon le Scrum Guide, un élément non terminé en fin de Sprint retourne dans le Product Backlog ; on ne parle pas officiellement de « Sprint en échec ». Seul le Product Owner peut annuler un Sprint."}]},
  {h:"Les 3 rôles de la Scrum Team", g:[
   {p:"Petite équipe pluridisciplinaire, avec toutes les compétences pour réaliser le Sprint : petite pour rester réactive."},
   {cols:[
    ["Product Owner (PO)","directeur produit","Responsable du produit, expert métier. Formule, gère et communique les besoins. S'assure qu'ils sont compris. Priorise le Product Backlog."],
    ["Scrum Master (SM)","chef de mêlée / facilitateur","Facilitateur du projet. Protège l'équipe des perturbations extérieures. S'assure du respect de Scrum. Peut être Developer, pas Product Owner."],
    ["Developers","équipe de réalisation","Construisent le projet. Travaillent les uns avec les autres. Admins sys, analystes, concepteurs, développeurs, UI/UX, architectes…"]]}]},
  {h:"Les 3 artefacts (livrables)", g:[
   {table:{head:["Artefact","Contenu","Gestion"], rows:[
    ["Product Backlog","Liste ordonnée et priorisée de ce qui est nécessaire pour le produit (besoins, exigences, fonctionnalités). Peut évoluer","Product Owner"],
    ["Sprint Backlog","Liste des tâches d'un Sprint, issues du Product Backlog. Les objectifs ne changent pas, mais l'état est mis à jour chaque jour","Developers"],
    ["Product Increment","Réalisation du Sprint, s'ajoute aux incréments précédents, aligné sur le DoD","Équipe"]]}},
   {def:"**DoD** (Definition of Done) : ensemble des conditions nécessaires pour considérer un élément comme terminé et livrable. Ex. serveur : provisionné + configuré + tests OK + documenté."}]},
  {h:"Les 5 événements (rituels)", g:[
   {table:{head:["Événement","Rôle","Participants","Durée max"], rows:[
    ["Sprint","Le cycle de réalisation lui-même","Toute l'équipe","≤ 1 mois"],
    ["Sprint Planning","Création du Sprint Backlog : pourquoi, quoi, comment","PO + SM + Devs","8 h"],
    ["Daily Scrum","Rituel quotidien, heure et lieu fixes : ce qui est fait, à faire, les problèmes","SM + Devs (PO si besoin)","15 min"],
    ["Sprint Review","Inspection du résultat, orientation, changements de l'environnement","PO + SM + Devs","4 h"],
    ["Sprint Retrospective","Rituel de fin de Sprint : améliorer qualité et efficacité (outils, interactions, communication)","SM + Devs (PO si besoin)","3 h"]]}},
   {p:"Durées maximales données pour un Sprint d'un mois."}]},
  {h:"Exemple concret : supervision de 50 serveurs", g:[
   {table:{head:["Sprint","Objectifs","Livrables"], rows:[
    ["Sprint 0 (2 sem.)","Définir l'infrastructure cible. Identifier besoins users. Préparer environnement de test","Doc architecture cible, backlog initial, env. de test prêt"],
    ["Sprint 1 (2 sem.)","Installer Zabbix. Configurer agents sur 10 serveurs. Vérifier métriques CPU/RAM/disque","Supervision sur 10 serveurs, doc install & config, backlog MAJ"],
    ["Sprint 2 (2 sem.)","Déployer sur 20 serveurs de plus. Alertes email/SMS. Commencer dashboards","Supervision sur 30 serveurs, alerting opérationnel, dashboards ajustés"],
    ["Sprint 3 (2 sem.)","Déployer les 20 restants. Dashboards complets. Ajuster seuils. Former équipe IT","Supervision complète 50 serveurs, doc finale, formation / transfert de connaissances"]]}},
   {p:"Ce que Scrum apporte : livraisons rapides et régulières d'incréments, adaptation aux changements de besoins/environnement, meilleure collaboration et transparence, amélioration continue de l'efficacité et de la qualité."}]}
 ]},
 {id:"07", t:"Outils de gestion de projet", sub:"PBS, WBS, RACI, Gantt, Kanban, KPI, tableau de bord et communication", parts:[
  {h:"Introduction & panorama", g:[
   {p:"La gestion de projet s'appuie sur des méthodes, des rôles et des outils. On n'utilise pas forcément tous les outils sur un projet : l'important est d'en connaître plusieurs pour choisir ceux en adéquation avec le projet."},
   {steps:[["Structuration","PBS, WBS"],["Planification & ressources","RACI, Gantt, Kanban"],["Suivi","KPI, tableau de bord"],["Communication","COPIL, COTECH, rapports"]]}]},
  {h:"Structuration : PBS & WBS", g:[
   {cols:[
    ["PBS","Product Breakdown Structure","Découpage du produit sous forme de représentation graphique, orienté sur le produit et ce qui le compose. Méthode : définir le produit final → grandes familles de livrables → sous-produits → jusqu'au livrable élémentaire → vérifier la cohérence."],
    ["WBS","Work Breakdown Structure","Découpage des tâches du projet, orienté sur les actions à réaliser. Méthode : définir les livrables → décomposer en lots de travail (Work Packages) → décomposer en tâches → vérifier que chaque tâche est unique, mesurable, datable."]]},
   {p:"À retenir : **PBS = « quoi »** (composants du produit). **WBS = « comment »** (tâches). Le WBS s'appuie souvent sur le PBS."}]},
  {h:"RACI : rôles et responsabilités", g:[
   {p:"La matrice RACI indique les rôles et responsabilités des acteurs pour chaque tâche / livrable du projet."},
   {kv:[["R : Responsible","Réalisateur : fait le travail"],["A : Accountable","Approbateur : valide, rend des comptes"],["C : Consulted","Consulté : donne un avis avant décision"],["I : Informed","Informé : tenu au courant après décision"]]},
   {p:"Règles : chaque tâche doit avoir **au moins un R et un A**. Un A peut aussi être R (personne qui réalise et valide). C et I peuvent être multiples. Idéalement **un seul A** par tâche, sinon conflits de décision. Ne pas oublier support et fournisseurs dans les rôles."}]},
  {h:"Gantt & Kanban", g:[
   {cols:[
    ["Diagramme de Gantt","","Visualise : tâches, durées, dépendances, ressources affectées, jalons. Méthode : identifier phases (via PBS/WBS) → décomposer en tâches → dépendances → estimer les durées → paralléliser ce qui peut l'être → affecter les ressources → mettre à jour selon l'avancement réel."],
    ["Kanban","カンバン, étiquette","Méthode visuelle d'organisation des tâches, très utile pour un petit projet ou une organisation personnelle. Une carte = une action, posée sur un tableau à colonnes : à faire (to do) → en cours (doing) → fait (done)."]]},
   {def:"**Jalon** : événement significatif sans durée (installation terminée, recette validée, doc livrée)."}]},
  {h:"Suivi : KPI & tableau de bord", g:[
   {p:"Le suivi permet de : détecter les dérives, anticiper les risques, ajuster les ressources, décider rapidement des actions correctives."},
   {def:"**KPI** (Key Performance Indicators) = indicateurs clés de performance pour suivre l'avancement. Doivent être peu nombreux (pour ne pas se perdre), significatifs et actualisés régulièrement."},
   {cols:[
    ["Délais","","% de tâches livrées à temps · jalons atteints à temps · durée totale prévue vs réelle."],
    ["Coût","","Coût réel vs prévu · taux de consommation du budget · coût des imprévus."],
    ["Charge / capacité","","Charge consommée vs prévue · taux d'utilisation des ressources · sur-/sous-charge des équipes."]]},
   {p:"**Tableau de bord** = outil de pilotage qui regroupe les informations clés (KPI, alertes, tendances) sous forme visuelle et synthétique : suivre l'état du projet, anticiper les dérives, améliorer la communication, aider la décision."}]},
  {h:"Communication : supports & parties prenantes", g:[
   {p:"La communication est un élément clé : informer les parties prenantes, aligner sur objectifs/planning/livrables, éviter les erreurs, obtenir validation, anticiper les blocages. Facteur de motivation et d'engagement."},
   {table:{head:["Support","Objectif","Fréquence"], rows:[
    ["COPIL (comité de pilotage)","Décision stratégique, suivi global","Semaine / mois"],
    ["COTECH (comité technique)","Suivi tâches techniques, arbitrages","Hebdomadaire"],
    ["Rapport d'avancement","Synthèse chiffrée (KPI, avancement, risques)","Hebdo / bi-hebdo"],
    ["Tableau de bord","Vue synthétique des KPI et alertes","Continu"],
    ["Wiki / doc partagée","Doc, procédures, notes","Continu"],
    ["Kanban / boards","Visualiser l'avancement et les tâches","Temps réel"]]}},
   {p:"4 types de communication : **ascendante** (équipe → direction), **descendante** (direction → équipe), **transversale** (entre équipes techniques), **vers l'utilisateur** (infos, consignes, MEP)."},
   {p:"Piège fréquent : les **utilisateurs finaux** sont trop souvent oubliés dans la communication → incompréhension, frustration et mauvaise adhésion au changement."},
   {p:"Bonnes pratiques : être synthétique, discours adapté au public, fréquence régulière, être transparent (partager les risques, pas seulement les succès), bons outils collaboratifs, un référent communication avec un document des fréquences/publics/contenus."}]}
 ]},
 {id:"08", t:"Identifier & évaluer les risques", sub:"Composantes, types, méthodes d'identification, probabilité × impact = criticité, matrice", parts:[
  {h:"Qu'est-ce qu'un risque ?", g:[
   {def:"**Risque** = événement incertain, qui s'il survient, a un impact négatif sur le projet : planning, budget, qualité, sécurité, disponibilité du SI. Le risque n'est pas un problème : c'est un problème potentiel."},
   {table:{head:["Composante","Contenu","Exemple"], rows:[
    ["Cause","L'origine possible","Matériel vieillissant"],["Événement","Ce qui pourrait se produire","Panne du serveur"],["Conséquence","L'impact sur le projet","Interruption du projet"]]}},
   {p:"**Risque ≠ incertitude** : le risque peut être mesuré (analysé, prévisible, identifié). L'incertitude signifie qu'il n'y a pas assez d'informations pour analyser. Ex. : une nouvelle technologie mal maîtrisée sans REX → incertitude forte → risque élevé."}]},
  {h:"Types & catégories de risques IT", g:[
   {h:"4 grandes familles", kv:[
    ["Organisationnels","Retard fournisseurs, dépendances non gérées, changement d'exigences"],
    ["Humains","Absence d'un expert, erreurs de config, mauvaise communication"],
    ["Techniques","Panne matérielle, incompatibilité, faille de sécurité"],
    ["Extérieurs","Cybersécurité, réglementation, coupure élec / réseau"]]},
   {p:"Catégories dans un projet IT : matériel · logiciel · sécurité · planning · budget · ressources (compétences) · conformité / réglementation · fournisseurs / prestataires."},
   {h:"Exemples courants en infra", ul:["Perte de données","Retard livraison baie de stockage","Configuration erronée du VLAN","Erreur firewall → coupure réseau","Incompatibilité AD / application métier","Cyberattaque pendant migration","Absence expert pendant MEP"]}]},
  {h:"Identifier : 6 méthodes à combiner", g:[
   {steps:["Brainstorming avec l'équipe projet","REX : retours d'expérience, incidents passés","Analyse documentaire (architecture, planning, littérature)","Checklists de risques IT : ANSSI, ISO 27001, ITIL…","Interviews des parties prenantes","Analyse par scénarios : « et si le serveur tombe en panne ? »"]},
   {p:"Bonnes pratiques : impliquer toutes les compétences, croiser technique / fonctionnel / sécurité, analyser tôt dans le projet, mettre à jour régulièrement. Combiner les méthodes pour avoir différents angles."}]},
  {h:"Évaluer : probabilité × impact = criticité", g:[
   {p:"Chaque risque s'évalue sur 3 dimensions : **probabilité** (fréquence d'apparition), **impact** (conséquence sur le projet), **criticité** (importance)."},
   {def:"**Formule : criticité = probabilité × impact.** Échelle courante 1 (faible) / 2 (moyenne) / 3 (forte) pour chaque dimension."},
   {table:{head:["","Impact 1","Impact 2","Impact 3"], rows:[
    ["Prob. 1","1","2","3"],["Prob. 2","2","4","6"],["Prob. 3","3","6","9"]]}},
   {kv:[["Vert (1-3)","Risque acceptable. Documenter"],["Orange (4-6)","Risque à surveiller. Prévoir une action"],["Rouge (9)","Action immédiate. Traiter en priorité"]]},
   {p:"Ex. : serveur ancien qui a beaucoup tourné → probabilité de panne 3. Si panne → projet arrêté le temps du remplacement → impact 3. Criticité = 9 → action immédiate."}]}
 ]}
,{id:"09", t:"Documenter & traiter les risques", sub:"Registre, fiche de risque, 5 stratégies (supprimer / réduire / partager / transférer / accepter)", parts:[
  {h:"Registre des risques & fiche de risque", g:[
   {p:"Les risques identifiés et évalués doivent être documentés (traçabilité, suivi) puis traités si nécessaire. Le **registre des risques** est le document central qui regroupe tous les risques : vision claire, priorisation, suivi. C'est aussi un outil de communication. Il est composé de **fiches de risque**, une par risque identifié."},
   {h:"Exemple de fiche", kv:[
    ["ID","124"],["Description","Erreur de configuration firewall"],["Catégorie","Technique"],["Cause","Manque de double vérification"],["Conséquence","Coupure réseau"],
    ["Probabilité / Impact / Criticité","2 / 3 / 6"],["Action","Procédure d'installation + revue par pair"],["Responsable","Admin réseau"],["Statut / Date MAJ","En cours / 28/11/2025"]]},
   {p:"Bonnes pratiques : outil collaboratif, MAJ après chaque réunion projet, un seul responsable par risque, formulations concrètes (pas floues), registre priorisé, intégré au tableau de bord, historique conservé."},
   {def:"**Séparer risques projet et risques sécurité !** Les risques projet s'arrêtent avec le projet. Les risques sécurité doivent être communiqués et connus pour la maintenance (après la livraison)."}]},
  {h:"Avant de décider : coût de gestion vs coût de non-gestion", g:[
   {p:"L'évaluation de la criticité permet de classer. Pour un risque important, on estime :"},
   {steps:[["Le coût de la gestion","Besoins humains, matériels, immatériels"],["Le coût de la non-gestion","Pertes si le risque n'est pas géré mais se réalise"]]},
   {p:"Le résultat de cette comparaison détermine la stratégie de traitement. Références normatives : **ISO 27005** (gestion des risques SI) et **ISO 31000** (gestion des risques, général)."}]},
  {h:"Les 5 stratégies de traitement", g:[
   {table:{head:["Stratégie","Principe","Exemple"], rows:[
    ["1. Suppression","Risque inacceptable + impact important → on l'élimine. Peut mener à l'annulation du projet","Remplacer un serveur trop ancien avant le démarrage des phases techniques"],
    ["2. Réduction","Mesures qui diminuent la probabilité ou l'impact. Engager des moyens humains + financiers pour rendre le risque acceptable","Documentation, tests supplémentaires, redondance matériel"],
    ["3. Partage","Risque partagé avec un tiers : responsabilité conjointe. Nécessite confiance et bonne coordination","Infogérance partielle"],
    ["4. Transfert","Le risque est confié à un tiers capable de le gérer. La responsabilité est déléguée","Assurance, outsourcing"],
    ["5. Acceptation","Risque qui ne peut être ni supprimé, ni atténué, ni partagé, ni transféré : généralement faible, coût de traitement > pertes potentielles","Petite dépendance externe non critique"]]}},
   {def:"**Accepter ≠ ne rien faire.** Un risque accepté doit continuer à être surveillé : prévoir monitoring, communication, seuils d'alerte."}]},
  {h:"Plan de traitement & suivi", g:[
   {p:"Quand la stratégie est décidée, le plan de traitement doit :"},
   {ul:["Décrire les mesures à mettre en place","Affecter un responsable du traitement","Fixer un délai de mise en œuvre","Évaluer le coût","Affecter les ressources nécessaires","Mettre en place les indicateurs de suivi"]},
   {p:"Après traitement : **recalculer la criticité** pour vérifier l'efficacité, puis mettre à jour la fiche de risque et le registre."},
   {p:"À retenir : identifier ne suffit pas, il faut documenter, évaluer, choisir une stratégie et assurer le suivi dans le temps. Le registre est un véritable outil d'aide à la décision : anticiper plutôt que subir."}]}
 ]},
 {id:"10", t:"EBIOS Risk Manager", sub:"Méthode ANSSI d'analyse des risques : 5 ateliers, livrables, quand l'utiliser", parts:[
  {h:"EBIOS RM, c'est quoi ?", g:[
   {def:"**EBIOS RM** = Expression des Besoins et Identification des Objectifs de Sécurité, Risk Manager. Méthode d'évaluation des risques informatiques gérée par l'**ANSSI**. Permet d'identifier tous les types de risques d'un SI. Compatible ISO 27005 et ISO 31000. Disponible sur le site de l'ANSSI."},
   {p:"Objectifs : identifier les risques informatiques essentiels, raisonner par scénarios de menace, déterminer les mesures de sécurité prioritaires, construire une vision partagée entre équipes techniques et direction."},
   {p:"La méthode est basée sur 5 ateliers qui concernent différents acteurs de l'entreprise ou du projet, et permet de construire une politique de sécurité en fonction de l'analyse des risques."}]},
  {h:"Les 5 ateliers", g:[
   {table:{head:["Atelier","Objectif & activités","Participants"], rows:[
    ["1. Cadrage & socle de sécurité","Définir le cadre de l'étude, le périmètre métier + technique, les événements redoutés avec niveau de gravité, le socle de sécurité et évaluer sa conformité","Direction, métiers, RSSI, DSI"],
    ["2. Sources de risque","Identifier les attaquants, leurs motivations et capacités. Sélectionner les couples sources de risque / objectifs visés jugés prioritaires","Direction, métiers, RSSI, spécialiste analyse de menaces"],
    ["3. Scénarios stratégiques","Cartographier la dangerosité des parties prenantes de l'écosystème, sélectionner les critiques, élaborer les scénarios stratégiques et mesures sur l'écosystème. Vue organisationnelle","Métiers, achats/juridiques, architectes fonctionnels, RSSI, spécialiste cyber"],
    ["4. Scénarios opérationnels","Élaborer les scénarios opérationnels (modes opératoires techniques : vulnérabilités, points d'entrée) et évaluer leur vraisemblance","RSSI, DSI, spécialiste cyber"],
    ["5. Traitement du risque","Synthèse des scénarios, stratégie de traitement, mesures de sécurité, évaluer et documenter les risques résiduels, cadre de suivi + mécanismes de surveillance","Direction, métiers, RSSI, DSI"]]}},
   {p:"Progression : on part du **quoi protéger** (atelier 1), on identifie **qui / pourquoi** (2), on imagine des scénarios **stratégiques** (3) puis **techniques** (4), et on décide **quoi faire** (5)."}]},
  {h:"Les livrables", g:[
   {kv:[
    ["Cartographie des actifs","Ce qu'il faut protéger"],
    ["Scénarios de menace","Risques majeurs au niveau stratégique"],
    ["Scénarios opérationnels","Chemins techniques d'attaque"],
    ["Liste des risques majeurs",""],
    ["Plan de traitement priorisé","Mesures priorisées"],
    ["Dossier de sécurité",""]]}]},
  {h:"EBIOS RM dans un projet : quand l'utiliser (et quand non)", g:[
   {cols:[
    ["Cas d'usage en projet","","Identifier les risques liés aux nouveaux processus, applications ou infrastructures · intégrer la sécurité dès la conception · se conformer à des exigences réglementaires ou normatives (RGPD, ISO 27001) · sécuriser un projet sensible ou critique · réévaluer les risques en cas de changement majeur."],
    ["Quand ne PAS l'utiliser","","Pour des projets très simples ou à très faible risque : une analyse rapide, une checklist ou une version « light » peut suffire. EBIOS RM demande du temps, de la rigueur et la participation de nombreux acteurs."]]},
   {p:"À retenir : EBIOS RM permet de comprendre **qui** peut attaquer, **pourquoi**, et **comment**, pour décider quelles mesures de sécurité mettre en place en priorité. Rigueur et traçabilité indispensables pour projets critiques ou systèmes sensibles."}]}
 ]},
 {id:"11", t:"Sécurité des SI & projet", sub:"Menaces, vulnérabilités, ANSSI, bonnes pratiques, ISO 27001 (SMSI)", parts:[
  {h:"SI, menaces, vulnérabilités : définitions", g:[
   {def:"**Système d'information (SI)** = ensemble des personnes, des outils et des processus qui permettent de collecter, stocker, traiter et transmettre l'information dans une organisation. Comprend : direction, utilisateurs, techniciens, administrateurs + postes, serveurs, infrastructure, logiciels."},
   {table:{head:["Terme","Définition","Exemple"], rows:[
    ["Menace","Événement ou action potentielle qui pourrait nuire au SI","Cyberattaque, erreur humaine"],
    ["Vulnérabilité","Faiblesse du SI pouvant être exploitée par une menace","Faille, mauvaise config"],
    ["Incident","Événement réel ayant un impact négatif","Panne de serveur"]]}}]},
  {h:"Typologie des menaces & vulnérabilités courantes", g:[
   {h:"5 types de menaces IT", kv:[
    ["Humaines","Erreur user, phishing, sabotage interne"],
    ["Techniques","Malware, ransomware, intrusion réseau"],
    ["Physiques","Panne électrique, incendie, inondation"],
    ["Organisationnelles","Absence de procédures, non-respect des politiques"],
    ["Externes","Législation, fournisseurs, événements naturels"]]},
   {h:"Vulnérabilités courantes", ul:["Failles OS, logiciels non à jour","Configurations réseau incorrectes","Absence de sauvegarde ou PRA incomplet","Absence de supervision / monitoring","Serveurs non redondés ou obsolètes","Mots de passe faibles, politique non appliquée","Absence de chiffrement des données sensibles","Câblage et équipements réseau non documentés"]},
   {p:"Les listes sont longues : on s'appuie sur des bonnes pratiques et des référentiels, tant en projet qu'en maintenance."}]},
  {h:"ANSSI & bonnes pratiques", g:[
   {def:"**ANSSI** = Agence Nationale de la Sécurité des Systèmes d'Information. Origine : Direction technique du chiffre créée en 1943 par la France libre (protéger les échanges, casser les codes ennemis). Vocation militaire → défense des SI de l'État + conseil et soutien aux administrations et OIV. Émet recommandations, guides, labels accessibles à tous."},
   {p:"Guides ANSSI utiles : Guide d'hygiène informatique, Anticiper et gérer une crise cyber, Recommandations MFA et mots de passe."},
   {kv:[
    ["Sécurité technique","Séparer prod/test/dev · MAJ OS + logiciels · firewall, segmentation, VLANs · sauvegardes + tests · moindre privilège · MFA + mots de passe complexes · journalisation + supervision"],
    ["Conception projet","Security by design · évaluer les risques à chaque phase · jalons de sécurité (revue vuln, tests conformité) · continuité d'activité dans le planning · environnements temporaires pour tests sécurisés"],
    ["Changements & dev","Revue de sécurité avant MEP · automatiser les déploiements · documenter configs / scripts · patch management, versioning"],
    ["Pilotage & gouvernance","Un responsable sécurité pour le projet (RSSI ou référent) · communication régulière sur les risques · indicateurs de sécurité au tableau de bord (% serveurs patchés, incidents, disponibilité backups) · former et sensibiliser"],
    ["Fournisseurs & externes","Évaluer la sécurité des prestataires (cloud, SaaS) avant intégration · SLA de sécurité et de disponibilité contractuels · suivre les MAJ de sécurité"]]}]},
  {h:"ISO 27001 : le SMSI", g:[
   {def:"**ISO 27001** = norme internationale d'exigences pour un **SMSI** (Système de Management de la Sécurité de l'Information). Objectif : protéger les actifs informationnels."},
   {p:"La norme structure le cycle de vie du SMSI en 4 phases : établissement → implémentation → maintien → amélioration."},
   {h:"Établissement (4 étapes)", steps:["Définir politique et périmètre du SMSI","Identifier et évaluer les risques, élaborer la politique de sécurité","Traiter le risque, identifier le risque résiduel (plan de gestion)","Choisir les mesures de sécurité à mettre en place"]},
   {h:"Maintien (4 étapes)", steps:["Établir un plan de traitement des risques","Déployer les mesures","Générer des indicateurs (performance + conformité)","Former et sensibiliser"]},
   {h:"Amélioration continue", kv:[["Actions correctives","Agir sur les problèmes détectés"],["Actions préventives","Agir sur les causes avant l'incident"],["Actions d'amélioration","Améliorer la performance du système"]]},
   {p:"**Projet + SMSI** : si le SI concerné est géré par un SMSI, il faut s'y conformer : définir la politique de sécurité en lien, identifier les actifs critiques (serveurs, données, NAS), évaluer les risques cyber, définir et suivre les mesures."},
   {p:"À retenir : intégrer la sécurité dès le début du projet (security by design). À terme le produit peut rejoindre un système complexe : il ne doit pas le compromettre."}]}
 ]},
 {id:"12", t:"PCA / PRA", sub:"Continuité, reprise, sauvegardes 3-2-1, redondance, supervision et intégration projet", parts:[
  {h:"PCA vs PRA : 2 outils complémentaires", g:[
   {p:"Comment poursuivre l'activité quand un système ne fonctionne plus ? Comment reconstruire et remettre en route le système défaillant ? Ce sont les rôles des PCA et PRA."},
   {table:{head:["Aspect","PCA (Continuité)","PRA (Reprise)"], rows:[
    ["Objectif","Maintenir les activités critiques en fonctionnement malgré un incident","Restaurer l'IT et les services après incident"],
    ["Portée","Processus métier + organisation","Systèmes, applications, données"],
    ["Temporalité","Pendant l'incident","Après l'incident"],
    ["Exemple","Basculer sur un site secondaire pour continuer les opérations","Restaurer serveurs et bases de données sur le site principal"]]}},
   {p:"**PCI / PRI** : quand PCA et PRA couvrent l'activité complète de l'organisation, la partie IT s'appelle Plan de Continuité Informatique et Plan de Reprise Informatique, intégrés au PCA/PRA."}]},
  {h:"Mise en place PCA & PRA (RTO / RPO)", g:[
   {cols:[
    ["PCA : étapes clés","","Identifier les activités critiques · définir les objectifs de continuité · plan d'organisation humaine et responsabilités (direction, comm, coordination, opérationnel) · préparer les procédures accessibles quel que soit le sinistre · former et sensibiliser · tester et mettre à jour régulièrement (au moins 1× par an)."],
    ["PRA : étapes clés","","Définir le périmètre (quoi protéger et pourquoi) · identifier risques et scénarios de sinistre · définir RTO et RPO · inventaire des ressources et dépendances (ordre de restauration) · stratégies de reprise + procédures · tester et ajuster après toute modification du SI."]]},
   {kv:[["RTO (Recovery Time Objective)","Délai maximum pour restaurer le service"],["RPO (Recovery Point Objective)","Perte de données maximum acceptable"]]},
   {p:"Types de sinistres : matériels (incendie, inondation, panne élec), techniques (panne serveur, crash disque, perte réseau), cyber (ransomware, intrusion, DDoS), humains (erreur, suppression accidentelle), organisationnels (dépendance à une personne), fournisseurs (panne cloud), externes (grève, sabotage, catastrophe naturelle). Conséquences : indispo SI, perte de données, arrêt de prod, impacts financiers, atteinte à l'image, non-conformité RGPD."}]},
  {h:"Prévenir : sauvegarde & redondance", g:[
   {p:"Aucun système n'est infaillible (panne, ransomware, erreur humaine, corruption). La seule manière d'assurer la continuité = **combiner sauvegarde et redondance** : elles répondent à des objectifs différents."},
   {cols:[
    ["Sauvegarde","protège les DONNÉES","Copie des données à un instant T, stockée dans un emplacement distinct. Permet une restauration même en cas de destruction totale."],
    ["Redondance","protège la DISPONIBILITÉ","Dupliquer des ressources pour permettre au service de continuer même en cas de panne d'un élément."]]},
   {p:"**Règle 3-2-1** : 3 copies des données · 2 supports différents · 1 copie externalisée (hors site / cloud). + sauvegardes automatiques, tests de restauration réguliers (souvent oublié !), chiffrement, rétention adaptée (journalière/hebdo/mensuelle/annuelle)."},
   {kv:[
    ["Redondance matérielle","Serveurs en cluster, disques RAID, alimentations redondées, liens réseau multiples"],
    ["Redondance logicielle","Load balancers, réplication de BDD, containers multi-nœuds"],
    ["Redondance géographique","Datacenters multiples, cloud + site physique"]]},
   {p:"L'un sans l'autre laisse un angle mort. Sauvegarde : pas de continuité immédiate, restauration après coup, dépendance à la dernière sauvegarde. Redondance : coûteuse, complexe, n'évite pas la corruption de données. Un bon PRA/PCA repose sur les deux."}]},
  {h:"Supervision : voir, comprendre, anticiper", g:[
   {def:"La **supervision** surveille en temps réel l'état du SI (serveurs, réseau, applications, services). Objectif : détecter rapidement les anomalies avant qu'elles ne deviennent des incidents."},
   {p:"Pourquoi ? Prévenir les pannes (disque plein, CPU…), réduire les interruptions par détection précoce, optimiser le SI, aider au diagnostic (historiques), améliorer la sécurité (activités anormales)."},
   {cols:[
    ["Quoi superviser : technique","","Serveurs (CPU, RAM, disques, services) · réseau (bande passante, dispo, latence) · bases de données · applications / services métier · sauvegardes (succès / échecs)."],
    ["Quoi superviser : sécurité","","Tentatives d'intrusion · modifications suspectes · activité inhabituelle sur les comptes · événements issus des logs."]]},
   {p:"Bonnes pratiques : périmètre clair · éviter le bruit (limiter alertes inutiles) · centraliser les journaux (SIEM, syslog, ELK) · vérifier régulièrement seuils et alertes · documenter les actions en cas d'alerte · intégrer la supervision au PRA/PCA · tester les alertes."}]},
  {h:"Intégrer PCA/PRA dans un projet", g:[
   {p:"Un projet s'inscrit toujours dans un SI existant : il doit respecter, renforcer ou étendre les mécanismes de continuité, de secours et de supervision déjà en place."},
   {kv:[
    ["PCA","Intégrer dès la conception les exigences de continuité (cluster, redondance réseau, double site). Définir RPO/RTO. Compatibilité avec le PCA existant. Procédures manuelles de continuité si interruptions possibles"],
    ["PRA","Documenter comment le nouvel équipement sera restauré. Prévoir scripts, images, templates. Intégrer la brique dans le plan de reprise global et les tests PRA (simulation de panne). Vérifier les dépendances (réseau, stockage, DNS)"],
    ["Sauvegardes","Définir quoi sauvegarder (données, configs, VM, BDD), stratégie de rétention, automatisation, tests de restauration inclus dans le planning"],
    ["Redondance","Identifier les SPOF. Décider redondance matérielle (RAID, alim…), réseau (2 liens fibre, 2 switches), applicative (cluster, LB). Intégrer au dimensionnement et budget. Tester le basculement avant MEP"],
    ["Supervision","Définir ce qui doit être supervisé dans les éléments livrés. Ajouter les nouveaux équipements dans la supervision existante. Produire seuils, graphes, dashboards. Transmettre au RUN alertes + procédures"]]},
   {def:"À retenir : PCA, PRA, sauvegardes, redondance et supervision **ne sont pas des options** : ce sont des exigences structurantes à prévoir dès la conception, à tester avant la MEP, à intégrer au SI existant."}]}
 ]}
